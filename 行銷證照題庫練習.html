<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>行銷證照題庫練習</title>

<style>
/* Layout: sticky part tabs + stats strip, then a single column of question cards, paged by 20 */
:root{
  --bg:#f3f5f6;--surface:#fff;--fg:#1b2428;--muted:#5d6b72;--line:#d9e0e3;
  --accent:#0d6e78;--accent-soft:#dff1f2;--accent-fg:#fff;
  --good:#17753b;--good-bg:#e1f4e7;--bad:#b3261e;--bad-bg:#fbe5e3;
  --font:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --num:'Space Grotesk','Noto Sans TC',system-ui,sans-serif;
}
:root[data-part="sport"]{--accent:#c2410c;--accent-soft:#fdeadd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181b;--surface:#1b2327;--fg:#e8eef0;--muted:#98a7ae;--line:#2d393e;
  --accent:#4fc3cd;--accent-soft:#17323a;--accent-fg:#0b1a1d;
  --good:#6fd394;--good-bg:#173525;--bad:#ff8d85;--bad-bg:#3b1d1b;color-scheme:dark}
  :root[data-part="sport"]:not([data-theme="light"]){--accent:#ff9a62;--accent-soft:#3a2418}}
:root[data-theme="dark"]{
  --bg:#12181b;--surface:#1b2327;--fg:#e8eef0;--muted:#98a7ae;--line:#2d393e;
  --accent:#4fc3cd;--accent-soft:#17323a;--accent-fg:#0b1a1d;
  --good:#6fd394;--good-bg:#173525;--bad:#ff8d85;--bad-bg:#3b1d1b;color-scheme:dark}
:root[data-theme="dark"][data-part="sport"]{--accent:#ff9a62;--accent-soft:#3a2418}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:820px;margin:0 auto}
header{padding:20px 0 12px}
h1{font-size:1.35rem;margin:0;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{flex:1 1 160px;font:inherit;font-weight:700;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab small{font-weight:400;opacity:.85;margin-left:6px}
.stats{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:10px;font-size:.88rem;color:var(--muted);align-items:center}
.stats b{font-family:var(--num);font-size:1.05rem;color:var(--fg);margin-left:3px}
.stats .g b{color:var(--good)}.stats .r b{color:var(--bad)}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.prog .pg{background:var(--good)}.prog .pb{background:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
select,button.ghost{font:inherit;font-size:.9rem;padding:7px 10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;min-width:0}
button.ghost{cursor:pointer}
select{flex:1 1 150px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.card.ok{border-color:var(--good)}.card.no{border-color:var(--bad)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.qn{font-family:var(--num);font-weight:700;color:var(--accent)}
.cat{font-size:.75rem;background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:99px}
.verdict{margin-left:auto;font-weight:700;font-size:.85rem;padding:1px 10px;border-radius:4px}
.ok .verdict{background:var(--good-bg);color:var(--good)}
.no .verdict{background:var(--bad-bg);color:var(--bad)}
.q{margin:0 0 10px;font-weight:500;overflow-wrap:anywhere}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;text-align:left;font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .l{font-family:var(--num);font-weight:700;flex:none;width:1.4em}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.exp{margin:10px 0 0;padding:10px 12px;background:var(--bg);border-radius:6px;font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.exp b{color:var(--fg)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:.82rem;cursor:pointer;text-decoration:underline;padding:0}
.pager{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.pager button{font:inherit;min-width:40px;padding:6px 10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer;font-family:var(--num)}
.pager button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{color:var(--muted);font-size:.78rem;text-align:center;margin-top:24px}
</style>

<script>
const DATA={"tour":[{"n":1,"cat":"觀光行銷導論","q":"某航空公司保有全球最佳之飛航安全紀錄，旅客訂購前述航空公司機位之意願明顯高於其他業者，對於此一航空公司而言，此為SWOT 分析之?","o":{"A":"優勢","B":"劣勢","C":"機會","D":"威脅"},"a":"A","e":"優勢（strength）係指協助企業達成目標之內部能力。"},{"n":2,"cat":"觀光行銷導論","q":"行銷概念（marketing concept）主張若欲達到組織目標，必須特別關注以下何項工作？","o":{"A":"擁有良好品質、卓越績效與創新特質之產品","B":"竭盡所能地進行銷售與促銷","C":"判斷目標市場之需求與需要","D":"維護或改善消費者與社會福祉"},"a":"C","e":"行銷概念（marketing concept）主張若欲達到組織目標，必須判斷目標市場之需求與需要，此外，相較於競爭者更具效益與效率地傳遞顧客欲求之滿意。行銷概念強調必須關注目標市場之需求與需要，否則定將無法促使顧客滿意。"},{"n":3,"cat":"觀光行銷導論","q":"特定地區受到恐怖攻擊活動之威脅，影響旅客前往該地旅遊之意願，對於該地觀光業者而言，此為 SWOT 分析之?","o":{"A":"優勢","B":"劣勢","C":"機會","D":"威脅"},"a":"D","e":"威脅（threat）係指可能挑戰企業績效之既有或潛在外部因素。"},{"n":4,"cat":"觀光行銷導論","q":"下列何者係為社會行銷概念（social marketing concept）特別異於其他行銷概念之處？","o":{"A":"強調提供優質產品","B":"強調銷售與促銷之功能","C":"強調滿足市場之需求與需要","D":"強調消費者與社會大眾之整體利益"},"a":"D","e":"社會行銷概念（social marketing concept）主張組織必須界定目標市場之需要、慾望與興趣，並以維護或改善消費者與社會福祉之方式，相較於競爭者更具效益與效率地傳遞顧客欲求之滿意。維護或改善消費者與社會福祉係為社會行銷概念特別強調與著眼之處。"},{"n":5,"cat":"觀光行銷導論","q":"某家旅館轉型成為產後護理之家，提供產婦精緻高級的月子中心服務。此為麥可波特（Michael E. Porter）提出之何種競爭策略？","o":{"A":"成本領導","B":"差異化","C":"聚焦","D":"客製化"},"a":"C","e":"聚焦（focus）係指企業著重一個或多個窄小之市場區隔，而非追逐較大市場。此例強調著重單一特定市場區隔，因此屬聚焦策略。"},{"n":6,"cat":"觀光行銷導論","q":"某家餐飲業者係以美味肋排見長之連鎖餐廳，管理階層強調選擇適切牛齡之牛肉，並且運用適宜溫度慢火烹調肉品，藉以確保肋排汁多味美。請問前述業者係屬何種行銷策略之概念？","o":{"A":"產品概念","B":"銷售概念","C":"行銷概念","D":"社會行銷概念"},"a":"A","e":"產品概念（product concept）之行銷策略與關注重點主要著眼於產品之改進，以期擁有良好品質、卓越績效與創新特質之產品。此例強調產品之改進，因此屬產品概念。"},{"n":7,"cat":"觀光行銷導論","q":"下列何者之敘述非為人口統計區隔（demographic segmentation）之概念？","o":{"A":"不同宗教信仰民眾朝聖地點選擇具有差異","B":"經常從事旅遊與不常從事旅遊之民眾在於參與自助旅行之意願具有差異","C":"男性與女性在於前往香港購物旅遊之意願具有差異","D":"位處不同家庭生命週期階段之家庭選擇旅遊目的地之考量因素具有差異"},"a":"B","e":"人口統計區隔（demographic segmentation）係以人口統計變項，諸如：年齡、生命週期、性別、所得、職業、教育、宗教、種族與國籍等，劃分市場成為若干族群。經常從事旅遊與不常從事旅遊係屬行為區隔。"},{"n":8,"cat":"觀光行銷導論","q":"某家旅行業者聘僱大量業務人力，並且藉由廣告宣傳努力推銷旅遊產品。請問前述業者係屬何種行銷策略之概念？","o":{"A":"產品概念","B":"銷售概念","C":"行銷概念","D":"社會行銷概念"},"a":"B","e":"銷售概念（selling marketing）主張組織必須竭盡所能地進行銷售與促銷，否則顧客不會購買更多組織提供之服務與商品。此例強調銷售與促銷，因此屬銷售概念。"},{"n":9,"cat":"觀光行銷導論","q":"某家國際連鎖速食業者依據不同國家地區消費者偏好之差異，開發不同商品品項。此為何種市場區隔之考量？","o":{"A":"地理區隔","B":"人口統計區隔","C":"心理區隔","D":"行為區隔"},"a":"A","e":"地理區隔（geographic segmentation）係將市場分為若干地理單位，諸如：國家、州、省、區域、郡、縣、城市或社區等。此例強調不同國家地區偏好之差異，因此屬地理區隔。"},{"n":10,"cat":"觀光行銷導論","q":"西南航空瞭解顧客需求，提供較為低廉之機票價格，並且採行更具效率之服務傳遞流程，以期提高顧客滿意。請問前述業者係屬何種行銷策略之概念？","o":{"A":"產品概念","B":"銷售概念","C":"行銷概念","D":"社會行銷概念"},"a":"C","e":"行銷概念（marketing concept）主張若欲達到組織目標，必須判斷目標市場之需求與需要，此外，相較於競爭者更具效益與效率地傳遞顧客欲求之滿意。此例強調顧客需求與滿意，因此屬行銷概念。"},{"n":11,"cat":"觀光行銷導論","q":"關島、夏威夷與帛琉的接待業者瞄準蜜月市場，推出眾多遊程服務方案。此為何種市場區隔之考量？","o":{"A":"地理區隔","B":"人口統計區隔","C":"心理區隔","D":"行為區隔"},"a":"D","e":"行為區隔（behavioral segmentation）係以購買者之知識、態度與對於產品之使用或反應區隔市場。此例強調不同消費者產品使用之差異，因此屬行為區隔。"},{"n":12,"cat":"觀光行銷導論","q":"某家旅館全面禁菸、大量僱用在地勞動人力、適當進行廢棄物與汙水處理，並且依循綠色概念進行能源與空間規劃。請問前述業者係屬何種行銷策略之概念？","o":{"A":"產品概念","B":"銷售概念","C":"行銷概念","D":"社會行銷概念"},"a":"D","e":"社會行銷概念（social marketing concept）主張組織必須界定目標市場之需要、慾望與興趣，並以維護或改善消費者與社會福祉之方式，相較於競爭者更具效益與效率地傳遞顧客欲求之滿意。此例強調消費者與社會福祉，因此屬社會行銷概念。"},{"n":13,"cat":"觀光行銷導論","q":"__________係指區隔市場之規模或獲利性是否足夠支撐市場經營之程度。","o":{"A":"可衡量性","B":"可接近性","C":"足量性","D":"可實踐性"},"a":"C","e":"足量性係指區隔市場之規模或獲利性是否足夠支撐市場經營之程度"},{"n":14,"cat":"觀光行銷導論","q":"航空公司提供飛行常客計畫，藉以維繫顧客關係。此為透過何種價值連結建立顧客關係之途徑？","o":{"A":"財務性利益","B":"社會性利益","C":"結構性利益","D":"比較利益"},"a":"A","e":"財務性（financial）利益主要係與財務誘因有關，飛行常客計畫可使旅客累積里程，做為免費機票、機位升等與機場貴賓室等，具有財務價值之酬償。"},{"n":15,"cat":"觀光行銷導論","q":"下列針對無差異化行銷（undifferentiated marketing）之敘述何者為非？","o":{"A":"鎖定一個或者少數小型市場","B":"業者著眼各個區隔市場之間在於需求方面之共同性","C":"僅以一種市場供應之方式進入整個市場","D":"行銷之時並不考慮顧客需求之差異"},"a":"A","e":"無差異化行銷（undifferentiated marketing）係指面對不同區隔市場之時，業者著眼各個區隔市場之間在於需求方面之共同性，而非其間之差異性。因此，並未鎖定特定小型市場。"},{"n":16,"cat":"觀光行銷導論","q":"旅館與旅行業者之業務人員積極拜訪客戶，並且提供個性化與個人化之服務與產品，藉以維繫顧客關係。此為透過何種價值連結建立顧客關係之途徑？","o":{"A":"財務性利益","B":"社會性利益","C":"結構性利益","D":"比較利益"},"a":"B","e":"社會性（social）利益係可藉由企業員工瞭解個別顧客之需要與企盼之產品或服務，其後再將產品與服務個性化與個人化，藉以增強其與顧客之社會連結（social bonds）。"},{"n":17,"cat":"觀光行銷導論","q":"下列何者之敘述非屬 SWOT 分析之中機會（opportunity）之概念？","o":{"A":"機會係為外部環境創造之契機","B":"機會係為企業外部之因素","C":"機會不隨時空環境改變","D":"機會提供企業發展之絕佳優勢"},"a":"C","e":"機會（opportunity）係指可能為企業帶來優勢之外部因素。"},{"n":18,"cat":"觀光行銷導論","q":"航空公司協助旅行業者建立電腦訂位系統，藉以維繫顧客關係。此為透過何種價值連結建立顧客關係之途徑？","o":{"A":"財務性利益","B":"社會性利益","C":"結構性利益","D":"比較利益"},"a":"C","e":"電腦訂位系統係為強化航空公司與旅行業者之間之結構性（structural）關係。"},{"n":19,"cat":"觀光行銷導論","q":"某家旅行業者亟欲開發某地之旅遊產品，惟較其他競爭對手，此一旅行業者缺乏直飛該地之航班機位，對於此一旅行業者而言，此為 SWOT 分析之?","o":{"A":"優勢","B":"劣勢","C":"機會","D":"威脅"},"a":"B","e":"劣勢（weakness）係指影響企業達成目標之內部限制。"},{"n":20,"cat":"觀光行銷導論","q":"服務之無形性（intangibility）係指?","o":{"A":"購買服務之前，無法看到、嚐到、觸摸、聽到或聞到服務產品","B":"無法分離服務與服務提供者","C":"服務品質取決於服務提供者，以及服務之時間、地點與方式","D":"服務無法存放留待日後出售或使用"},"a":"A","e":"服務之無形性（intangibility）係指購買服務之前，無法看到、嚐到、觸摸、聽到或聞到服務產品。"},{"n":21,"cat":"觀光行銷導論","q":"某家航空公司力求降低各項成本，以期提供相同航段之業界最低票價，藉此吸引消費者注意與購買。此為麥可波特（Michael E. Porter）提出之何種競爭策略？","o":{"A":"成本領導","B":"差異化","C":"聚焦","D":"客製化"},"a":"A","e":"成本領導（cost leadership）係指企業努力達成最低之成本。此例強調最低成本之達成，因此屬成本領導策略。"},{"n":22,"cat":"觀光行銷導論","q":"服務之不可分割性（inseparability）係指無法分離以下何者？","o":{"A":"顧客與其他不同屬性之顧客","B":"服務與服務提供者","C":"服務時間","D":"服務地點"},"a":"B","e":"服務之不可分割性（inseparability）係指無法分離服務與服務提供者。"},{"n":23,"cat":"觀光行銷導論","q":"下列何者係為目標行銷步驟之順序？","o":{"A":"市場區隔—市場定位—目標市場訂定","B":"市場區隔—目標市場訂定—市場定位","C":"市場定位—目標市場訂定—市場區隔","D":"目標市場訂定—市場區隔—市場定位"},"a":"B","e":"目標行銷之步驟依序係為市場區隔（market segmentation）、目標市場訂定（market targeting）與市場定位（market positioning）。"},{"n":24,"cat":"觀光行銷導論","q":"下列何者並非造成服務多變性（variability）之可能因素？","o":{"A":"服務提供者","B":"服務時間","C":"標準作業流程","D":"服務地點與方式"},"a":"C","e":"服務之多變性（variability）或者異質性（heterogeneity）係指服務品質取決於服務提供者，以及服務之時間、地點與方式。標準作業流程旨在降低服務之多變性或異質性，而非造成多變性與異質性。"},{"n":25,"cat":"觀光行銷導論","q":"下列何者之敘述係為心理區隔（psychographic segmentation）之概念？","o":{"A":"對於住宿產品與旅館品牌之熟悉程度影響住宿旅館選擇","B":"不同種族對於從事旅遊行為具有差異","C":"不同生活型態之民眾選擇不同遊憩活動","D":"所得較高之民眾較為願意參加奢華之旅"},"a":"C","e":"心理區隔（psychographic segmentation）係以社會階級、生活型態與個人特質，劃分不同購買者之族群。生活型態係屬心理區隔。"},{"n":26,"cat":"觀光行銷導論","q":"下列何項產品與服務不具之易逝性（perishability）之特徵？","o":{"A":"航空公司機位","B":"旅館客房","C":"郵輪床位","D":"高鐵紀念商品"},"a":"D","e":"服務之易逝性（perishability）係指服務無法存放留待日後出售或使用。前述選項之中惟僅高鐵紀念商品不具前述特徵。"},{"n":27,"cat":"觀光行銷導論","q":"某家旅行業者因應人口結構變遷，鎖定長青族群做為主要行銷對象。此為何種市場區隔之考量？","o":{"A":"地理區隔","B":"人口統計區隔","C":"心理區隔","D":"行為區隔"},"a":"B","e":"人口統計區隔（demographic segmentation）係以人口統計變項，諸如：年齡、生命週期、性別、所得、職業、教育、宗教、種族與國籍等，劃分市場成為若干族群。此例強調不同人口統計特徵偏好之差異，因此屬人口統計區隔。"},{"n":28,"cat":"觀光行銷導論","q":"旅行業者之業務人員進行推銷拜訪之時，無法帶著旅遊相關組件進行展示，諸如：機艙座位、旅館客房與旅遊據點。此一敘述代表服務之何種特性？","o":{"A":"無形性","B":"不可分割性","C":"易變性","D":"不可儲存"},"a":"A","e":"服務之無形性（intangibility）係指購買服務之前，無法看到、嚐到、觸摸、聽到或聞到服務產品。此例強調購買服務之前無法感知服務產品，因此屬服務之無形性。"},{"n":29,"cat":"觀光行銷導論","q":"______係指區隔市場之規模與購買能力可被衡量的程度。","o":{"A":"可衡量性","B":"可接近性","C":"足量性","D":"可實踐性"},"a":"A","e":"衡量性（measurability）係指區隔市場之規模與購買能力可被衡量的程度。"},{"n":30,"cat":"觀光行銷導論","q":"某對情侶可能因為餐廳氣氛浪漫選擇於此用餐，然而，假若相同空間之中坐著一群喧嘩之顧客，此對情侶可能大失所望。此一敘述代表服務之何種特性？","o":{"A":"無形性","B":"不可分割性","C":"易變性","D":"不可儲存"},"a":"B","e":"服務之不可分割性（inseparability）係指無法分離服務與服務提供者。不可分割性亦同象徵顧客亦為服務產品之組成，此例強調無法分離其他顧客與服務情境，因此屬服務之不可分割性。"},{"n":31,"cat":"觀光行銷導論","q":"______係指吸引與供應區隔市場之有效性活動可以進行之程度。","o":{"A":"可衡量性","B":"可接近性","C":"足量性","D":"可實踐性"},"a":"D","e":"可實踐性係指吸引與供應區隔市場之有效性活動可以進行之程度。"},{"n":32,"cat":"觀光行銷導論","q":"某位餐廳服務人員平日服務表現向來良好，然而，某日精神狀況不佳或者心情不佳，致使服務品質低落。此一敘述代表服務之何種特性？","o":{"A":"無形性","B":"不可分割性","C":"易變性","D":"不可儲存"},"a":"C","e":"服務之多變性（variability）或者異質性（heterogeneity）係指服務品質取決於服務提供者，以及服務之時間、地點與方式。此例強調服務品質受到服務提供者自身之因素影響，因此屬服務之多變性。"},{"n":33,"cat":"觀光行銷導論","q":"下列針對雙叉式行銷（bifurcated marketing）之敘述何者為非？","o":{"A":"市場具有兩大區隔","B":"追求在於一個或者少數小型市場之中獲得較高市場佔有率","C":"依據不同區隔擬定不同行銷計畫","D":"依據不同區隔提供不同產品與服務"},"a":"B","e":"雙叉式行銷（bifurcated marketing）係指針對顧客組合係為雙叉之市場，依此兩大市場區隔發展不同之行銷方案。因此，並未追求在於一個或者少數小型市場之中獲得較高市場佔有率。"},{"n":34,"cat":"觀光行銷導論","q":"某家擁有 100 間客房之旅館，某晚售出 60 間客房，其餘40 間客房就此閒置，無法留置隔日再行販售。此一敘述代表服務之何種特性？","o":{"A":"無形性","B":"不可分割性","C":"易變性","D":"不可儲存"},"a":"D","e":"服務之易逝性（perishability）係指服務無法存放留待日後出售或使用。此例強調購買服務無法存放之特質，因此屬服務之易逝性。"},{"n":35,"cat":"觀光行銷導論","q":"某家餐飲業者僅以一種市場供應之方式進入整個市場，著重消費者之共同需求，而非消費者之間之差異。前述係屬何種市場涵蓋策略？","o":{"A":"無差異化行銷","B":"雙叉式行銷","C":"差異化行銷","D":"集中行銷"},"a":"A","e":"無差異化行銷（undifferentiated marketing）係指面對不同區隔市場之時，業者著眼各個區隔市場之間在於需求方面之共同性，而非其間之差異性。此例著眼共同性而非差異性，因此屬無差異化行銷。"},{"n":36,"cat":"觀光行銷導論","q":"下述何項做法可以改善服務無形性（intangibility）之負面影響？","o":{"A":"改善內部裝潢","B":"導入自助式服務","C":"規劃服務藍圖","D":"收取訂金"},"a":"A","e":"服務之無形性（intangibility）造成之不確定性致使買方經常尋求有形證據，以便提供服務的資訊與信心。改善內部裝潢旨在提供服務之有形證據，故可改善無形性之負面影響。"},{"n":37,"cat":"觀光行銷導論","q":"選擇市場涵蓋策略必須考量眾多因素，其中之一係為產品同質性程度，假若產品之間具有極高之同質性（degree of product homogeneity），何種市場涵蓋策略係為較為適合之選項？","o":{"A":"無差異化行銷","B":"雙叉式行銷","C":"差異化行銷","D":"集中行銷"},"a":"A","e":"假若產品同質性（degree of product homogeneity）較高，雙叉式行銷與差異化行銷不易突顯產品之間之差異，而此亦非在於數個市場之中，選擇特定市場集中行銷，藉以獲致較高佔有率之案例，因此，採取無差異化行銷似為較佳選項。"},{"n":38,"cat":"觀光行銷導論","q":"下列何種餐飲服務類型最能運用服務之不可分割性（inseparability）藉以降低人力成本？","o":{"A":"宴會服務","B":"自助餐式服務","C":"客房餐飲服務","D":"餐桌服務"},"a":"B","e":"服務之不可分割性（inseparability）隱含顧客與員工為服務之共同製造者。自助餐式服務強調共同生產之特質，故為運用不可分割性降低人力成本之實例。"},{"n":39,"cat":"觀光行銷導論","q":"下列何項做法無法降低服務多變性（variability）之負面影響？","o":{"A":"服務藍圖","B":"標準作業流程","C":"員工輪調","D":"教育訓練"},"a":"C","e":"服務之多變性（variability）衍生服務品質取決於服務提供者之特性，因此，服務品質因人而異。服務藍圖、標準作業流程與教育訓練強調統一服務人員之服務品質，員工輪調則缺乏此一特性。"},{"n":40,"cat":"觀光行銷導論","q":"國內某家旅館業者亟欲拓展國際市場，惟對國際旅客與國外通路而言，前述旅館並未具有鮮明之印象。前述可能係為何種定位之錯誤？","o":{"A":"定位不足","B":"過度定位","C":"困惑的定位","D":"定位衝突"},"a":"A","e":"定位不足（underpositioning）係指購買者對於業者僅具模糊之印象，或者並不清楚業者有何特殊之處。此例係屬印象模糊，故為定位不足之問題。"},{"n":41,"cat":"觀光行銷導論","q":"下列何項做法非觀光業者用以降低服務易逝性（perishability）之負面影響？","o":{"A":"收取訂金","B":"超額預約","C":"營收管理","D":"工作設計"},"a":"D","e":"服務之易逝性（perishability）致使服務無法儲存，訂金之支付可以大幅提高顧客實際消費之可能性、超額預約可以提高實際使用機率、營收管理可以平衡淡旺季節落差與提高使用與營運狀況，惟於工作設計僅能改善工作效率，無法降低服務之易逝性。"},{"n":42,"cat":"觀光行銷導論","q":"國內某家旅行業者專營獎勵旅遊，前述業者對於獎勵旅遊安排具有高度專業，對於整體獎勵旅遊市場亦甚熟悉且具頗高市場佔有率。前述係屬何種市場涵蓋策略？","o":{"A":"無差異化行銷","B":"雙叉式行銷","C":"差異化行銷","D":"集中行銷"},"a":"D","e":"集中行銷（concentrated marketing）係指業者追求在於一個或者少數小型市場之中獲得較高市場佔有率，而非在於大型市場之中獲得較低市場佔有率之策略。此例著眼特定市場區隔，因此屬集中行銷。"},{"n":43,"cat":"觀光行銷導論","q":"下列何者非為觀光餐旅業者經常用以降低服務多變性與創造一致性之做法？","o":{"A":"企業識別系統的設計","B":"員工聘僱與訓練程序的投資","C":"組織服務績效流程的標準化","D":"顧客滿意度的監控"},"a":"A","e":"企業識別系統（corporate identity system， CIS）係為提升企業形象、增強企業識別性，以期增加營銷利潤，因此，規劃製作之標準化、規格化、組織化與系統化之整套經營理念 、行銷策略與視覺傳達設計。而此無法用以降低服務多變性與創造一致性。"},{"n":44,"cat":"觀光行銷導論","q":"下列針對集中行銷（concentrated marketing）之敘述何者為非？","o":{"A":"市場具有若干不同區隔","B":"鎖定一個或者少數小型市場","C":"追求在於一個或者少數小型市場之中獲得較高市場佔有率","D":"採取此一行銷策略之業者通常具有較大之規模與資源"},"a":"D","e":"集中行銷（concentrated marketing）係指業者追求在於一個或者少數小型市場之中獲得較高市場佔有率，而非在於大型市場之中獲得較低市場佔有率之策略。"},{"n":45,"cat":"觀光行銷導論","q":"國內某家餐飲集團提供完善教育訓練課程、激勵第一線服務人員與全體支援之服務人員，同心協力為使顧客滿意。此一敘述代表何種行銷類型？","o":{"A":"外部行銷","B":"內部行銷","C":"互動行銷","D":"綠色行銷"},"a":"B","e":"內部行銷（internal marketing）係指服務公司提供完善教育訓練課程、激勵第一線服務人員與全體支援之服務人員，同心協力為使顧客滿意。因此，此例屬內部行銷。"},{"n":46,"cat":"觀光行銷導論","q":"下列何者之敘述非屬 SWOT 分析之中威脅（threat）之概念？","o":{"A":"威脅係為一種外部因素","B":"威脅可能挑戰企業績效與發展","C":"業者通常無法克服威脅，僅能順應環境進行調整","D":"威脅僅將影響單一企業"},"a":"D","e":"威脅（threat）係指可能挑戰企業績效之既有或潛在外部因素。"},{"n":47,"cat":"觀光行銷導論","q":"下列何者特別強調服務人員與顧客在於服務接觸之時之品質？","o":{"A":"外部行銷","B":"內部行銷","C":"互動行銷","D":"綠色行銷"},"a":"C","e":"互動行銷（interactive marketing）係指認知之服務品質取決於服務接觸之時，買賣互動之品質。"},{"n":48,"cat":"觀光行銷導論","q":"政府陸續開放陸客來臺觀光與自由行，對於接待來臺旅客業務之旅行業者而言，此為 SWOT 分析之?","o":{"A":"優勢","B":"劣勢","C":"機會","D":"威脅"},"a":"C","e":"機會（opportunity）係指可能為企業帶來優勢之外部因素。"},{"n":49,"cat":"觀光行銷導論","q":"下列何者無法協助觀光餐旅事業之經理人員進行產能管理？","o":{"A":"促使顧客參與服務傳遞系統","B":"交叉訓練員工","C":"採用兼職員工","D":"超額預約"},"a":"D","e":"超額預約（overbooking）旨在進行需求之管理，此與「產能管理」無涉。"},{"n":50,"cat":"觀光行銷導論","q":"下列何者之敘述非為地理區隔（geographic segmentation）之概念？","o":{"A":"不同社會階層之民眾可能參加不同旅遊行程","B":"城市居民與鄉村居民飲食習慣具有差異","C":"溫帶與熱帶地區民眾旅遊偏好具有差異","D":"濱海與山間民眾遊憩活動選擇具有差異"},"a":"A","e":"地理區隔（geographic segmentation）係將市場分為若干地理單位，諸如：國家、州、省、區域、郡、縣、城市或社區等。不同社會階層係屬心理區隔。"},{"n":51,"cat":"觀光行銷導論","q":"下列何者無法協助觀光餐旅事業之經理人員進行需求管理？","o":{"A":"調整價格","B":"改變服務傳遞系統","C":"運用預約方式","D":"運用排隊等候"},"a":"B","e":"改變服務傳遞系統（service delivery system）旨在進行產能之管理，此與「需求管理」無涉。"},{"n":52,"cat":"觀光行銷導論","q":"某家旅行業者針對不同社經背景之客群，分別提供符合顧客利益之套裝旅遊行程。此為麥可波特（Michael E. Porter）提出之何種競爭策略？","o":{"A":"成本領導","B":"差異化","C":"聚焦","D":"客製化"},"a":"B","e":"差異化（differentiation）係指企業在於多數市場重視之顧客利益領域達到優越之表現。此例強調在於不同市場均能顧及顧客利益，因此屬差異化策略。"},{"n":53,"cat":"觀光行銷導論","q":"國內旅館與餐飲業者看好年菜市場潛力，紛紛投入年菜線上訂購系統之經營。前述代表何種市場成長策略？","o":{"A":"集中型多角化策略","B":"水平型多角化策略","C":"複合型多角化策略","D":"市場滲透策略"},"a":"A","e":"集中型多角化策略（concentric diversification strategy）係指企業尋求與既有產品系列具有關聯或行銷綜效之產品，即使新產品可能吸引新層級之顧客。此例係為具有關聯或行銷綜效之產品，因此屬集中型多角化策略。"},{"n":54,"cat":"觀光行銷導論","q":"下列何者之敘述係為行為區隔（behavioral segmentation）之概念？","o":{"A":"旅館業者依據不同地區之特性規劃不同景觀、設施與客房","B":"旅遊業者針對不同年齡開發不同旅遊產品","C":"森林遊憩業者依據不同年級階層規劃不同校外教學方案","D":"曾經多次參加某家旅行業者之旅遊行程且均獲得不錯旅遊體驗之消費者，通常還會持續購買同一業者之旅遊產品"},"a":"D","e":"行為區隔（behavioral segmentation）係以購買者之知識、態度與對於產品之使用或反應區隔市場。使用經驗係屬行為區隔。"},{"n":55,"cat":"觀光行銷導論","q":"_____係指區隔市場可被界定與運用之程度。","o":{"A":"可衡量性","B":"可接近性","C":"足量性","D":"可實踐性"},"a":"B","e":"可近性（accessibility）係指區隔市場可被界定與運用之程度。"},{"n":56,"cat":"觀光行銷導論","q":"國內某家旅行業者建立自有之遊覽巴士公司，係屬何種市場成長策略？","o":{"A":"向後整合","B":"向前整合","C":"水平整合","D":"斜面整合"},"a":"A","e":"向後整合（backward integration）係指與生產或價值傳遞過程上一步驟之組織整併。此例係面對消費者之旅行業者往上一步驟之遊覽巴士供應商進行整併，因此，屬向後整合。"},{"n":57,"cat":"觀光行銷導論","q":"某家郵輪業者推出攀岩、溜冰、衝浪等各式活動，吸引精力充沛、喜好冒險之夫妻與家庭。此為何種市場區隔之考量？","o":{"A":"地理區隔","B":"人口統計區隔","C":"心理區隔","D":"行為區隔"},"a":"C","e":"心理區隔（psychographic segmentation）係以社會階級、生活型態與個人特質，劃分不同購買者之族群。此例強調不同心理特徵偏好之差異，因此屬心理區隔。"},{"n":58,"cat":"觀光行銷導論","q":"航空公司收購躉售與零售旅行業者，係屬何種市場成長策略？","o":{"A":"向後整合","B":"向前整合","C":"水平整合","D":"斜面整合"},"a":"B","e":"向前整合（forward integration）係指與生產或價值傳遞過程下一步驟之組織整併。此例係機位供應商，即航空公司，往下一步驟代售機票給消費者之旅行業者進行整併，因此，屬向前整合。"},{"n":59,"cat":"觀光行銷導論","q":"下列何者非為評估市場區隔必須考量之因素？","o":{"A":"消費者購買行為","B":"區隔市場的規模與成長","C":"區隔市場的結構性吸引力","D":"公司的目的與資源"},"a":"A","e":"評估不同市場區隔之時，必須考量三項因素：區隔市場的規模與成長、區隔市場的結構性吸引力與公司的目的與資源。消費者購買行為與「評估不同市場區隔」無涉。"},{"n":60,"cat":"觀光行銷導論","q":"旅館業者收購其他競爭對手，係屬何種市場成長策略？","o":{"A":"向後整合","B":"向前整合","C":"水平整合","D":"斜面整合"},"a":"C","e":"水平整合（horizontal integration）係指整併生產與銷售相似產品，或者經營相似業務、提供相同勞務之業者，以求規模經濟之策略行為。此例係與生產與銷售相似產品，或者經營相似業務、提供相同勞務之業者整併，因此，係屬水平整合。"},{"n":61,"cat":"觀光行銷導論","q":"喜達屋（Starwood）旅館集團旗下涵蓋數個不同品牌與型態之旅館，提供不同客群旅客之住宿需求。前述係屬何種市場涵蓋策略？","o":{"A":"無差異化行銷","B":"雙叉式行銷","C":"差異化行銷","D":"集中行銷"},"a":"C","e":"差異化行銷（differentiated marketing）係指面對不同區隔市場之時，業者選擇兩個或者兩個以上之區隔市場做為行銷目標，分別針對不同區隔市場提供特定之產品與服務，以及對應之行銷措施。此例劃分不同市場區隔滿足不同需求，因此屬差異化行銷。"},{"n":62,"cat":"觀光行銷導論","q":"______係為依據不同需要、特性或行為，劃分市場之消費者，藉以提供不同產品或行銷活動之過程。","o":{"A":"行銷組合","B":"行銷分析","C":"市場擴展","D":"市場區隔"},"a":"D","e":"市場區隔（market segmentation）係為依據不同需要、特性或行為，劃分市場之消費者，藉以提供不同產品或行銷活動之過程。"},{"n":63,"cat":"觀光行銷導論","q":"下列針對差異化行銷（differentiated marketing）之敘述何者為非？","o":{"A":"市場具有若干不同區隔","B":"業者選擇兩個或者兩個以上之區隔市場做為行銷目標","C":"僅採一種行銷措施","D":"針對不同區隔市場提供特定之產品與服務"},"a":"C","e":"差異化行銷（differentiated marketing）係指面對不同區隔市場之時，業者選擇兩個或者兩個以上之區隔市場做為行銷目標，分別針對不同區隔市場提供特定之產品與服務，以及對應之行銷措施。因此，僅採一種行銷措施為非。"},{"n":64,"cat":"觀光行銷導論","q":"下列何者之敘述非屬 SWOT 分析之中優勢（strength）之概念？","o":{"A":"優勢之項目多數係屬企業外部之因素","B":"優勢可以協助達成組織目標","C":"組織之優勢並非持續不變","D":"組織之優勢可以透過相關資源之投入加以形塑"},"a":"A","e":"優勢（strength）係指協助企業達成目標之內部能力。"},{"n":65,"cat":"觀光行銷導論","q":"選擇市場涵蓋策略必須考量眾多因素，其中之一係為企業資源，假若企業資源較為有限，市場亦非同質之時，何種市場涵蓋策略係為較為適合之選項？","o":{"A":"無差異化行銷","B":"雙叉式行銷","C":"差異化行銷","D":"集中行銷"},"a":"D","e":"假若企業資源有限，企業似應無法依據各個不同區隔市場之需求，分別進行行銷活動，此外，若欲採取無差異行銷，亦將可能受到資源雄厚企業進行差異化行銷之挑戰，因此，集中行銷係為較佳之選項。"},{"n":66,"cat":"產品策略","q":"服務業的產品和實體產品最大的差異，以下何者為非？","o":{"A":"無形性","B":"不可儲存性","C":"不可分割性","D":"主觀性"},"a":"D","e":"主觀性為非，應為易變性。"},{"n":67,"cat":"產品策略","q":"____係為受到市場關注、能夠購得、使用或消費以滿足需要或需求。","o":{"A":"產品","B":"價格","C":"通路","D":"促銷"},"a":"A","e":"產品（product）係為受到市場關注、能夠購得、使用或消費以滿足需要或需求。"},{"n":68,"cat":"產品策略","q":"下列何者為服務業的核心產品（core product）？","o":{"A":"滿足顧客需求","B":"塑造服務差異化","C":"提升產品競爭力","D":"增加顧客價值"},"a":"A","e":"滿足顧客需求，其他選項為附屬服務。"},{"n":69,"cat":"產品策略","q":"服務業的附屬服務（supplementary services），以下何者為非？","o":{"A":"滿足顧客需求","B":"塑造服務差異化","C":"提升產品競爭力","D":"增加顧客價值"},"a":"A","e":"滿足顧客需求，其他選項為附屬服務。"},{"n":70,"cat":"產品策略","q":"餐飲業接受訂單的服務內容下列何者為非？","o":{"A":"加入會員","B":"訂位","C":"訂餐","D":"訂預售票"},"a":"D","e":"訂預售票。"},{"n":71,"cat":"產品策略","q":"品牌在觀光業具有重大的意義，其主要原因是？","o":{"A":"品牌是知名度的保證","B":"大部份觀光業服務難以評斷","C":"大多顧客有忠誠度","D":"品牌決定定價"},"a":"B","e":"大部份觀光業服務難以評斷。"},{"n":72,"cat":"產品策略","q":"品牌權益的內容，下列何者為非？","o":{"A":"品牌競爭力","B":"品牌忠誠度","C":"品牌知名度","D":"品牌聯想"},"a":"A","e":"依據 David Aaker 在 1991 年所提出之品牌權益五星模型，即認為品牌權益（brand equity）是由「品牌知曉」（brand awareness）、「品質知覺」（perceived quality）、「品牌聯想」（brand association）、「品牌忠誠」（brand loyalty）及「品牌其他資產」（other proprietary，如商標、專利等智慧財產權） 五個部分所組成。故不包含品牌競爭力。"},{"n":73,"cat":"產品策略","q":"企業要建立品牌權益，最好的方式是？","o":{"A":"加強品牌廣告","B":"加強服務品質","C":"強化顧客關係","D":"加強產品品質"},"a":"C","e":"強化顧客關係，因為品牌權益是在顧客知曉與瞭解產品之後。"},{"n":74,"cat":"產品策略","q":"顧客對服務的辨識及回憶某品牌的能力，稱之為？","o":{"A":"品牌意義","B":"品牌知名度","C":"品牌忠誠度","D":"品牌權益"},"a":"B","e":"品牌知名度是指消費者對一個品牌的記憶程度。"},{"n":75,"cat":"產品策略","q":"關於品牌權益的敘述下列何者為誤？","o":{"A":"其英文為 Brand Right","B":"品牌權益有正有負","C":"其存在於產品服務之外","D":"可以提供顧客或企業價值"},"a":"A","e":"品牌權益英文為 brand equity。"},{"n":76,"cat":"產品策略","q":"在觀光業中最能區隔與競爭對手的特色是________________。","o":{"A":"超級的服務品質","B":"品牌的建立","C":"最具競爭力的價格","D":"品牌延伸"},"a":"B","e":"品牌的建立。"},{"n":77,"cat":"產品策略","q":" 服務的生產與消費同時發生，其表示服務產品的特性為___________。","o":{"A":"無形性","B":"不可分割性","C":"易變性","D":"不可儲存"},"a":"B","e":"不可分割性。"},{"n":78,"cat":"產品策略","q":"核心產品係為_____。","o":{"A":"消費者真正所欲購置之服務或商品","B":"協助顧客使用核心產品之服務或商品","C":"用以增加產品價值，並與競爭產品產生區隔之額外產品","D":"涵蓋產品內容與提供方式"},"a":"A","e":"核心產品（core product）係為消費者真正所欲購置之服務或商品。"},{"n":79,"cat":"產品策略","q":"以下何者為餐廳的核心產品？","o":{"A":"美味的餐飲","B":"稀有的食材和高級的廚藝","C":"經濟實惠的餐飲","D":"頂級的服務"},"a":"A","e":"美味的餐飲，其他選項為附屬服務。"},{"n":80,"cat":"產品策略","q":"以下何者為旅行社的核心產品？","o":{"A":"經濟實惠的旅遊產品","B":"代購旅遊產品","C":"經驗豐富態度佳的領隊","D":"豐富的旅遊資訊"},"a":"B","e":"代購旅遊產品，其他選項為附屬服務。"},{"n":81,"cat":"產品策略","q":"輔助產品係指______。","o":{"A":"消費者真正所欲購置之服務或商品","B":"協助顧客使用核心產品之服務或商品","C":"用以增加產品價值，並與競爭產品產生區隔之額外產品","D":"涵蓋產品內容與提供方式"},"a":"B","e":"輔助產品（facilitate product）係指，協助顧客使用核心產品之服務或商品。"},{"n":82,"cat":"產品策略","q":"米其林餐廳，下列敘述何者為非？","o":{"A":"米其林餐廳由神祕客評分","B":"米其林餐廳每年不同","C":"米其林餐廳收費很高","D":"米其林餐廳都很清潔美麗"},"a":"C","e":"米其林餐廳收費很高為誤，米其林一顆星是一般收費才會入選的。"},{"n":83,"cat":"產品策略","q":"支援產品係為_____。","o":{"A":"消費者真正所欲購置之服務或商品","B":"協助顧客使用核心產品之服務或商品","C":"用以增加產品價值，並與競爭產品產生區隔之額外產品","D":"涵蓋產品內容與提供方式"},"a":"C","e":"支援產品（supporting product）係為用以增加產品價值，並與競爭產品產生區隔之額外產品。"},{"n":84,"cat":"產品策略","q":"引申產品涵蓋______。","o":{"A":"產品內容與品牌商標","B":"顧客參與與顧客滿意","C":"產品價值與產品權益","D":"產品內容與提供方式"},"a":"D","e":"引申產品（augmented product）包含產品內容與提供方式，涵蓋可近性、氣氛、顧客與服務提供者之互動、顧客參與以及顧客彼此間之互動，前述要素結合核心、輔助與支援產品，成為引申產品。"},{"n":85,"cat":"產品策略","q":"_____係為用來識別賣方的商品或服務，以及與競爭者產生區隔的名稱、名詞、標誌、符號、設計，或是以上要素的組合。","o":{"A":"產品","B":"品牌","C":"商標","D":"意象"},"a":"B","e":"品牌（brand）係為用來識別賣方的商品或服務，以及與競爭者產生區隔的名稱、名詞、標誌、符號、設計，或是以上要素的組合。"},{"n":86,"cat":"產品策略","q":"下列何者非為品牌所能扮演之角色？","o":{"A":"協助消費者識別產品來源或製造商","B":"對於獨特產品特色或要素提供法律保護","C":"代表某種程度之品質","D":"提高生產效率"},"a":"D","e":"品牌可以協助消費者識別產品來源或製造商、對於獨特產品特色或要素提供法律保護，以及代表某種程度之品質，然而，似難提高生產效率。"},{"n":87,"cat":"產品策略","q":"_____賦予產品與服務品牌之力量，目的在於創造差異。","o":{"A":"產品","B":"品牌","C":"商標","D":"意象"},"a":"C","e":"商標（branding）賦予產品與服務品牌之力量，目的在於創造差異。"},{"n":88,"cat":"產品策略","q":"國內某家餐飲連鎖集團旗下擁有眾多不同品牌，此為____之實例。","o":{"A":"品牌權益","B":"品牌承諾","C":"個別品牌","D":"聯合品牌"},"a":"C","e":"個別品牌（multi-branding）係為集團之內擁有不同品牌運作，因此，此例即為多品牌之實例。"},{"n":89,"cat":"產品策略","q":"國內某家旅遊集團與某家海外知名之渡假村與旅遊機構合作，彼此結合形塑形象店面，此為____之實例。","o":{"A":"品牌權益","B":"品牌承諾","C":"個別品牌","D":"聯合品牌"},"a":"D","e":"聯合品牌（co-branding）之概念與多品牌類似，惟於聯合品牌多非單一業主經營。"},{"n":90,"cat":"產品策略","q":"下列何項敘述係屬導入期？","o":{"A":"產品生命週期第一個階段","B":"產品快速為市場接受，利潤亦有顯著之增加","C":"為求對抗競爭增加行銷費用","D":"產品利潤趨於穩定"},"a":"A","e":"導入期（introduction）係為產品導入市場之後，銷售成長呈現緩慢之時期。"},{"n":91,"cat":"產品策略","q":"下列何者非為成熟期階段之特徵？","o":{"A":"銷售成長緩慢","B":"產品業已獲得多數潛在購買者接受","C":"產品快速獲得市場接受","D":"為求對抗競爭增加行銷費用"},"a":"C","e":"成熟期（maturity）係為產品銷售成長緩慢之時期。由於，產品業已獲得多數潛在購買者接受，產品利潤趨於穩定，惟復可能為求對抗競爭增加行銷費用，導致利潤降低。"},{"n":92,"cat":"產品策略","q":"下列何項敘述係屬成長期？","o":{"A":"產品生命週期第一個階段","B":"產品快速為市場接受，利潤亦有顯著之增加","C":"為求對抗競爭增加行銷費用","D":"產品利潤趨於穩定"},"a":"B","e":"成長期（growth）階段產品快速為市場接受，利潤亦有顯著之增加。"},{"n":93,"cat":"產品策略","q":"下列何者係為衰退期階段之特徵？","o":{"A":"銷售成長緩慢","B":"利潤顯著增加","C":"產品利潤趨於穩定","D":"產品銷售急遽下降，利潤亦同大幅下滑"},"a":"D","e":"衰退期（decline）階段產品銷售急遽下降，利潤亦同大幅下滑。"},{"n":94,"cat":"產品策略","q":"無人機飛行教學與體驗活動正值發展初期，國人從事前述活動之人口略低。此為_____的典型特徵。","o":{"A":"導入期","B":"成長期","C":"成熟期","D":"衰退期"},"a":"A","e":"導入期（introduction）係為產品導入市場之後，銷售成長呈現緩慢之時期。此例係屬產品進入市場初期，銷售成長尚顯緩慢之時期，因此，係屬導入期。"},{"n":95,"cat":"產品策略","q":"國內平價旅館精緻之設計感與合宜之價格，滿足大量經濟型旅客之住宿需求，多數傳統旅館業者紛紛轉型投入平價旅館經營。此為____的典型特徵。","o":{"A":"導入期","B":"成長期","C":"成熟期","D":"衰退期"},"a":"B","e":"成長期（growth）階段產品快速為市場接受，利潤亦有顯著之增加。此例呈現產品廣為市場接受，銷售成長快速吸引業者加入之特徵，因此，係屬成長期。"},{"n":96,"cat":"產品策略","q":"國內觀光遊樂產業市場漸趨飽和，業者開始藉由提供各式優惠價格的門票促銷方案與增加廣告曝光進行市場競爭。此為_____的典型特徵。","o":{"A":"導入期","B":"成長期","C":"成熟期","D":"衰退期"},"a":"C","e":"成熟期（maturity）係為產品銷售成長緩慢之時期。由於，產品業已獲得多數潛在購買者接受，產品利潤趨於穩定，惟復可能為求對抗競爭增加行銷費用，導致利潤降低。此例符合市場飽和、成長不易之特徵，因此，係屬成熟期。"},{"n":97,"cat":"產品策略","q":"國內部份觀光遊樂業者昔日結合戶外挑戰節目之拍攝，經歷一段遊客如織之時光，惟今遊客偏好改變，遊園人數大幅下降，營收大幅減少。此為____的典型特徵。","o":{"A":"導入期","B":"成長期","C":"成熟期","D":"衰退期"},"a":"D","e":"衰退期（decline）階段產品銷售急遽下降，利潤亦同大幅下滑。此例產品銷售與營收急遽下降之特徵，因此，係屬衰退期。"},{"n":98,"cat":"產品策略","q":"_____係為運用高價策略進行產品之銷售，目的在於企盼可以快速回收投資之成本，並使消費者認為該項產品具備較高之品質，願意採取較高之價格購買該項產品。","o":{"A":"吸脂策略","B":"滲透策略","C":"市場修正策略","D":"產品修正策略"},"a":"A","e":"吸脂策略（skimming strategy）係為運用高價策略進行產品之銷售，目的在於企盼可以快速回收投資之成本，並使消費者認為該項產品具備較高之品質，願意採取較高之價格購買該項產品。"},{"n":99,"cat":"產品策略","q":"_____係指採取低價策略進入市場，利用消費者對於價格之高敏感度，進一步提高市場之佔有率。","o":{"A":"吸脂策略","B":"滲透策略","C":"市場修正策略","D":"產品修正策略"},"a":"B","e":"滲透策略（penetration strategy）係指採取低價策略滲透市場，利用消費者對於價格之高敏感度，進一步提高市場之佔有率。"},{"n":100,"cat":"產品策略","q":"旅館業者在於寬廣之大廳裝設巨大水晶吊燈，閃亮地板之上鋪設華麗地毯，並以豪華高貴之氣派迎接客人蒞臨，此種景象容易在於消費者心中營造高級之象徵。此即觀光產品之何種特殊性？","o":{"A":"需求彈性大","B":"資本密集且固定成本高","C":"服務時間短暫","D":"強調服務「證據」管理"},"a":"D","e":"此例強調實體服務環境之營造，因此，係屬強調服務「證據」管理。"},{"n":101,"cat":"產品策略","q":"餐廳的核心產品是餐飲，而高級餐廳有能力讓顧客願意付高價金額，其主要的的原因，下列何者為非?","o":{"A":"產品品質與形象","B":"服務品質","C":"體驗品質","D":"創新品質"},"a":"D","e":"創新品質，產品的價值中，不包括創新品質。"},{"n":102,"cat":"產品策略","q":"某家汽車租賃業者為使租用車輛維持較佳狀態，依據車輛使用年分依序淘汰租用車輛，此為何種淘汰選項？","o":{"A":"繼續回到產品線","B":"分階段淘汰","C":"用盡存量","D":"立即終止"},"a":"B","e":"分階段淘汰（phase-out）係依產品先後順序淘汰。此一案例係依產品使用或者導入之先後順序，依序進行淘汰，因此，應採分階段淘汰之決策。"},{"n":103,"cat":"產品策略","q":"遭逢經濟環境衝擊之時，諸如：金融風暴、外匯波動與股市低迷，觀光活動熱潮均能敏銳且迅速反應於需求層面。此外，觀光需求易受其他外在環境，諸如：政治動盪、國際情勢與航運便捷等因素影響。此即觀光產品之何種特殊性？","o":{"A":"需求彈性大","B":"資本密集且固定成本高","C":"服務時間短暫","D":"強調服務「證據」管理"},"a":"A","e":"此例強調需求易受外在因素影響，因此，係屬需求彈性大。"},{"n":104,"cat":"產品策略","q":"王品集團旗下有多不同連鎖的餐廳，其策略為____________。","o":{"A":"滲透策略","B":"量多策略","C":"平行整合策略","D":"定位策略"},"a":"D","e":"定位策略，不同的定位行銷，以吸引不同的客層。"},{"n":105,"cat":"產品策略","q":"旅行社的佣金來源，下列何者為非？","o":{"A":"旅客","B":"航空公司","C":"飯店","D":"租車公司"},"a":"A","e":"旅客為顧客，不在供應商之列。"},{"n":106,"cat":"產品策略","q":"航空公司簽訂代碼共用（code-sharing），屬於哪一種策略？","o":{"A":"服務一致性策略","B":"滲透性行銷策略","C":"策略聯盟","D":"定位行銷策略"},"a":"C","e":"策略聯盟（strategic alliances）。"},{"n":107,"cat":"產品策略","q":"主題樂園經營成本涵蓋：土地費用、景觀設計、遊樂設施、人事費用、訓練培育與研究等多項支出，因此，固定資產比率較高，業者經常承擔極大經營風險。此即觀光產品之何種特殊性？","o":{"A":"需求彈性大","B":"資本密集且固定成本高","C":"服務時間短暫","D":"強調服務「證據」管理"},"a":"B","e":"此例強調經營成本甚高，且以固定資本比例尤高，因此，係屬資本密集且固定成本高。"},{"n":108,"cat":"產品策略","q":"對於已經不再覺得新奇的觀光旅客潮，新加坡觀光局開始推廣醫療觀光，其策略稱之為____________。","o":{"A":"8P 行銷策略","B":"產品生命週期策略","C":"吸脂策略","D":"垂直整合策略"},"a":"B","e":"產品生命週期策略，導入新產品-醫療。"},{"n":109,"cat":"產品策略","q":"某家五星級旅館推出美國安格斯頂級丁骨牛排精緻套餐，時逢美國狂牛症肆虐，進口肉商無法提出食用安全無虞之證明文件，亦乏相關文件證明此批肉品確實有害健康。試問此一旅館之經營管理者應該如何進行後續處置？","o":{"A":"繼續回到產品線","B":"分階段淘汰","C":"用盡存量","D":"立即終止"},"a":"D","e":"立即終止（drop）通常係於產品可能造成危害或抱怨之時，最好立即淘汰此項產品。此一案例存在產品可能造成危害之虞，因此，應採立即終止之決策。"},{"n":110,"cat":"其他議題","q":"下列何者違背生態旅遊的發展原則？","o":{"A":"應為當地社區及自然生態，帶來長期的環境、社會及經濟利益","B":"應事先規劃完整的區域觀光及遊客管理計畫","C":"重視發展規模，強調經濟效益","D":"將觀光收益，用於保育及管理當地自然生態"},"a":"C","e":"生態旅遊發展中，經濟效益並非主要的重點。"},{"n":111,"cat":"其他議題","q":"國內上市的餐飲集團王品集團旗下有：台塑牛排、西堤牛排、陶板屋、原燒、聚北海道昆布鍋、夏慕尼等多個品牌餐廳，這是屬於下列何種發展策略？","o":{"A":"集中型多角化策略","B":"國際化策略","C":"低成本策略","D":"整合發展策略"},"a":"A","e":"若是新產品之開發技術與現有產業科技有關聯，或新產品的行銷系統與現有產業行銷系統有關聯，那不論在科技上或行銷系統上均較集中力量，稱之為集中式多角化策略。王品集團各品牌均利用相近之營運模式，故為集中式多角化。"},{"n":112,"cat":"其他議題","q":"目的地之概念要素中，以下何者並不包括？","o":{"A":"available packages","B":"accessibility","C":"activities","D":"attention"},"a":"D","e":"目的地之概念 6A 要素：available packages 可供選擇之套裝行程：accessibility 可接近性 （或稱通路如交通網路及基礎設施）；attractions 景點；amenities 康樂設施 （如住宿設施、餐飲業、娛樂設施、零售業等）；activities 活動；ancillary services 相關附屬服務 （如地方組織）。"},{"n":113,"cat":"其他議題","q":"某組織其主要任務之一是在行銷範疇上，提升特定旅遊觀光目的地的市場能見度，此種組織稱之為？","o":{"A":"旅行社","B":"目的地行銷組織","C":"公會組織","D":"財團法人"},"a":"B","e":"目的地行銷組織主要任務之一是在行銷範疇上，提升特定旅遊觀光目的地的市場能見度。"},{"n":114,"cat":"其他議題","q":"如果許多愛騎自行車的外國人一想到臺灣，就會聯想到「自行車環島」、「自行車王國」，進而來臺參加自行車觀光，請問這是利用何種因素？","o":{"A":"樂活（LOHAS）","B":"贊助","C":"異業結盟","D":"意象（image）"},"a":"D","e":"目的地之意象塑造，是目的地行銷成功之重要因素。觀光旅遊行銷人員應善用意象規劃相關產品。"},{"n":115,"cat":"其他議題","q":"承上題，政府及企業善用此種聯想，在臺灣舉辦「臺北國際自行車展」，以吸引國際觀光客前來，請問此種觀光類型叫做：","o":{"A":"運動觀光","B":"會展觀光","C":"購物觀光","D":"文化觀光"},"a":"B","e":"藉由會議、展覽之舉辦，吸引國際觀光客造訪，稱之為會展觀光。A 與 C 選項從字面上乍看可選，但如確實瞭解三者之定義與精神，應能比較出正確答案。"},{"n":116,"cat":"其他議題","q":"紐西蘭的自然景觀及運動文化，使其成為全球知名的「冒險性運動天堂」，其他地區極難模仿。此種現象稱為：","o":{"A":"月暈效應","B":"運動行銷","C":"集客效應","D":"目的地品牌"},"a":"D","e":"當建立目的地品牌後，觀光客便可分辨旅遊產品之生產國家（或地區），山寨型產品不易模仿與分食。"},{"n":117,"cat":"其他議題","q":"觀光局觀光政策白皮書在「針對目標市場研擬配套行銷措施」策略中提到：「鎖定 MICE 為目標市場」，其概念不包括下列何者？","o":{"A":"獎勵旅遊 （incentive）","B":"大眾觀光 （mass Tourism）","C":"大型會議 （conference）","D":"展演 （exhibition）"},"a":"B","e":"MICE 並不包括大眾觀光，而是包括獎勵旅遊、大型會議、展演與一般會議。"},{"n":118,"cat":"其他議題","q":"下列何者並非 MICE 產業之一環？","o":{"A":"meeting","B":"incentive","C":"convention","D":"eco-tourism"},"a":"D","e":"MICE 係指：一般會議（meetings），獎勵旅遊（ incentives），大型會議（ conventions），亦有作conferences），展覽（ exhibitions），亦有作賽會活動（events） 。"},{"n":119,"cat":"其他議題","q":"為了增加賽會活動內涵與經濟效益，世界大學運動會籌辦委員會，預計在大會舉辦期間，舉辦大型國際學術研討會，請問這是 MICE中的哪一項？","o":{"A":"M","B":"I","C":"C","D":"E"},"a":"C","e":"MICE 係指：一般會議（meetings），獎勵旅遊（ incentives），大型會議（ conventions），亦有作conferences），展覽（ exhibitions），亦有作賽會活動（events） 。"},{"n":120,"cat":"其他議題","q":"臺灣某些運動產品為世界頂尖，因此當在世貿中心舉辦運動用品展覽時，往往吸引許多國外業者與同好前來參展或訂購，請問這是MICE 中的哪一項？","o":{"A":"M","B":"I","C":"C","D":"E"},"a":"D","e":"MICE 係指：一般會議（meetings），獎勵旅遊（ incentives），大型會議（ conventions），亦有作conferences），展覽（ exhibitions），亦有作賽會活動（events） 。"},{"n":121,"cat":"其他議題","q":"臺灣如要辦好會展觀光，其成功的重要關鍵在於：","o":{"A":"參與人數之多寡","B":"會議中心及展館氣派新穎","C":"相關目標設定之正確性","D":"門票的價格及配銷管道"},"a":"C","e":"根據《休閒事業行銷管理》一書（王俊人、高俊雄、劉吉川，2010，頁 296）。其成功關鍵除相關目標設定之正確性外，尚有能否有效提高與會者生意成交之機會，以及得到預期之資訊。（A）、（B）、（D）三項並非絕對重要。"},{"n":122,"cat":"其他議題","q":"運動休閒產業在歐美等先進經濟體佔有極高產值，如臺灣欲發展以運動休閒為主的 MICE 產業，下列何者非相關專業人才的必要條件？","o":{"A":"會展相關運動技術能力","B":"會展產業行銷能力","C":"會展服務公關能力","D":"會展活動企劃能力"},"a":"A","e":"如欲發展運動休閒 MICE 產業，實務規劃、操作與接待能力極為必要，因此（B）、（C）、（D）三項能力極為重要。如能具備相關運動技術固然更佳，但並非欲發展該產業之必要條件。"},{"n":123,"cat":"其他議題","q":"行政院正積極推動會議展覽（MICE）產業，並由經濟部商業司主管。如你是被公司指派推動 MICE 業務的旅行業行銷人員，下列何者並非重點？","o":{"A":"爭取國外直銷、保險業的頂級業務團來臺獎勵旅遊","B":"對於來臺貴賓，應將重心放在安排精緻旅遊行程","C":"找會議顧問公司、專業展覽公司與行銷整合公司合作執行","D":"瞭解經濟部及行政院觀光發展推動委員會之相關法規與補助規定"},"a":"B","e":"對 MICE 產業之訪客而言，其之觀光僅是順道觀光。故應以原本之會展活動為重，旅遊為輔。始能長久經營。"},{"n":124,"cat":"其他議題","q":"臺東辦理馬卡巴嗨原住民系列活動多年，如果想將此節慶觀光活動，增加 MICE 的元素，請問下列何種活動最適合？","o":{"A":"原住民傳統祭典與狩獵活動","B":"南島文化國際研討會及手工藝展覽","C":"部落深度文化體驗","D":"縣內各族原住民歌曲及舞蹈比賽"},"a":"B","e":"只有（B）符合 MICE 產業的意義。"},{"n":125,"cat":"定價策略","q":"某日發現前往歐美旅遊的團體套裝行程價格變貴，試問下列何者相對較不可能為原因之一？","o":{"A":"國際原物料漲聲四起","B":"消費者偏好歐美旅遊","C":"代理國外旅遊的旅行社增加","D":"新臺幣貶值"},"a":"C","e":"供給增加，售價降低。"},{"n":126,"cat":"定價策略","q":"藉由特別高價的行程吸引消費者的目光，亦或使消費者覺得此產品應具有較高的品質或服務，是屬於？","o":{"A":"畸零定價","B":"名望定價","C":"習慣型定價","D":"心理定價"},"a":"B","e":"名望定價係指企業特意提高產品的價格，以彰顯其聲望與地位，且足以襯托出產品擁有者的格調與身分。"},{"n":127,"cat":"定價策略","q":"航空公司的座艙等級應為何種定價策略？","o":{"A":"加成定價法","B":"競爭導向定價","C":"市場滲透定價","D":"差別定價"},"a":"D","e":"差別定價係指同一產品卻呈現不同價格，且價格差異與成本並無直接關聯。"},{"n":128,"cat":"定價策略","q":"中華航空於夜間時段有一班飛往東京的「紅眼航班」（red-eye flight），其機票價格相對於其他時段是較為低廉的。以下對中華航空定價策略的描述，何者為是？","o":{"A":"係依地理區域的不同而劃分","B":"屬特殊事件定價","C":"屬差別定價","D":"單純為中華航空給乘客的一種回饋方式"},"a":"C","e":"差別定價係指同一產品或服務以不同的價格（二種或以上）售予顧客，並且價格差異與成本並無直接關聯。「紅眼航班」（red-eye flight）係指在深夜至凌晨時段飛行，並於翌日清晨至早上抵達飛航目的地。"},{"n":129,"cat":"定價策略","q":"某旅行社推出「十二天法國深度之旅行程」，其價格明顯高於其他家旅行社，下列何者較不可能為其當初的定價目的？","o":{"A":"創新策略","B":"維持企業永續經營","C":"差異化","D":"品質導向"},"a":"B","e":"當產品有特色、有差異，且難以被替代時，定價自然提升。"},{"n":130,"cat":"定價策略","q":"臺北亞都麗緻大飯店有以下幾種房型：卓越客房（TWD8000+10%）、豪華客房（TWD10000+10%）、行政套房（TWD12000+10%）、景隅套房（TWD14000+10%），定價依房間型態而有所差異；試問上述內容係說明哪一種定價策略？","o":{"A":"差別定價","B":"按顧客知覺價值定價","C":"產品包裹定價","D":"產品線定價"},"a":"D","e":"產品線訂價時，企業常會精心設計幾個價格點，然後以價格點與價格點所連結之價格帶為基礎，思考產品線旗下的不同產品應置於哪個價格帶上。"},{"n":131,"cat":"定價策略","q":"由一陽旅行社所推出的瑞士深度旅遊，其售價往往明顯高於市場上其他競爭者所推出之產品，依然造成搶購。試問一陽旅行社所採用之定價策略為何？","o":{"A":"現行價格定價","B":"吸脂定價","C":"促銷定價","D":"產品包裹定價"},"a":"B","e":"吸脂定價係指當產品品質及形象能夠支持較高價格時，企業可使用吸脂定價，取得較高利潤。"},{"n":132,"cat":"定價策略","q":"雄獅旅行社推出限量精緻的「環球六十天超值行程」，並且訂定極高的售價，試問此係採何種定價策略？","o":{"A":"知覺價值","B":"最大化利潤","C":"最大化市場成長","D":"促銷定價"},"a":"A","e":"知覺價值定價其關鍵為購買者的價值知覺，非銷售者的成本；也就是在顧客的認知裡，究竟願意花多少錢購買產品。"},{"n":133,"cat":"定價策略","q":"7-ELEVEN 舉辦「CITY CAFÉ 咖啡集點活動：集滿 9 點免費兌換任一中杯飲品」，試問此乃何種促銷方式？","o":{"A":"功能性折扣","B":"促銷折扣","C":"累積式數量折扣","D":"特殊事件折扣"},"a":"C","e":"累積式數量折扣並不強制規定消費者要一次購足某數量，消費者可於一定期間內對於特定商品累積購買至廠商規定之數量標準，即可享有優惠；此種促銷方式旨在增強消費者之忠誠度。"},{"n":134,"cat":"定價策略","q":"「某餐廳認為降價對提高銷售是有正面助益的功能」，試問此項敘述是基於？","o":{"A":"價格彈性低","B":"價格彈性高","C":"供給彈性低","D":"供給彈性高"},"a":"B","e":"市場需求為產品價格之外部影響因素，當市場需求價格彈性高時，採取降價措施將對銷售成長較有利。"},{"n":135,"cat":"定價策略","q":"歐洲廉價航空 RYANAIR 新推出一條東歐二線城市的航線，為增加銷售，初期甚至強打超低價 1 歐元機票進行銷售；此種作法應屬何種定價策略？","o":{"A":"最低價格保證定價","B":"心理定價","C":"滲透定價","D":"吸脂定價"},"a":"C","e":"滲透定價是在新產品的導入期，盡量以低價銷售，目的是盡速搶佔市場佔有率。"},{"n":136,"cat":"定價策略","q":"旅遊商品價格結構應包含哪幾個項目？","o":{"A":"「消費者」、「產品」與「人性」","B":"「硬體」、「軟體」與「人性」","C":"「消費者」、「軟體」與「概念」","D":"「硬體」、「軟體」與「消費者」"},"a":"B","e":"旅遊商品價格結構是「硬體」、「軟體」與「人性」的銷售技術。"},{"n":137,"cat":"定價策略","q":"將「處變」視為「處常」，而能以平常心面對問題或危機的係指？","o":{"A":"交叉策略","B":"聯盟策略","C":"造鐘策略","D":"攻擊策略"},"a":"C","e":"造鐘策略（make clock strategy）係建構一有制度、能持續運作之機制，而非問題來臨時才敲鐘的公司；此即新加坡航空所採取策略之一。"},{"n":138,"cat":"定價策略","q":"「誠品書店」以銷售書籍為主軸，結合百貨、餐飲和精品等，形成新型態的購物中心，成功獲得回響。根據上述敘述，可知誠品書店係採何種策略？","o":{"A":"複合式策略","B":"領先策略","C":"個人化策略","D":"扭轉策略"},"a":"A","e":"所謂「複合式策略」，由字義上看應有「多元化」、「多角化」、「多樣化」等意，是相較於「單一」或「焦點策略」而言。"},{"n":139,"cat":"定價策略","q":"「旅行社多會預購大量的飛機票或遊輪票，並且以較優的折扣購得」，根據此行為描述，應屬於何種策略？","o":{"A":"量價策略","B":"價量策略","C":"滲透策略","D":"聯盟策略"},"a":"A","e":"「量價策略」（measure-price strategy），指的是「大量進貨、降低成本」，也就是「以量制價」之意。"},{"n":140,"cat":"定價策略","q":"陽明山櫻花季通常於農曆過年期間開始，但若消費者急想於三月下旬至五月中旬出國賞櫻，就得付上較高的旅遊成本，為此業者也將提高商品價格來抑制需求；根據此段描述，可得知應為？","o":{"A":"量價策略","B":"價量策略","C":"簡單策略","D":"低風險策略"},"a":"B","e":"「價量策略」（price-measure strategy）多半運用在「求過於供」時，以提高價格來抑制需求。"},{"n":141,"cat":"定價策略","q":"多數旅行社之「主題旅遊」皆有賴於創新及技術的研發，使產品或服務既獨特且具有價值，如雄獅旅行社近期所推出的「南美最古老慶典•印加帝國太陽祭」，其售價逼近 TWD300,000；根據上述描述，此種策略應為？","o":{"A":"滲透策略","B":"複合式策略","C":"差異化策略","D":"公益策略"},"a":"C","e":"差異化策略係一種「獨一無二」的產品或服務，競爭者無法在短期內「模仿」（imitate）或「複製」（copy），自然可以較高的價格賺取更多的利潤。"},{"n":142,"cat":"定價策略","q":"在旅行業本業毛利微薄的情況下，可以創造業外收入的最佳管道，但相對風險也提高，上述所指的是以下哪一項？","o":{"A":"人資管理","B":"營收管理","C":"財務管理","D":"資料管理"},"a":"B","e":"營收管理（revenue management）：在供給容量限制下，找到營收最大化的組合客戶的需求，追求企業最大之利潤與收益。"},{"n":143,"cat":"定價策略","q":"以盡量將價格壓低，採低價位吸引多數的消費者，取得市場優勢，此為何種策略？","o":{"A":"滲透策略","B":"公益策略","C":"造鐘策略","D":"聯盟策略"},"a":"A","e":"滲透策略：在現有產品和現有市場的基礎上，努力增加銷售，維持和提高市場佔有率，如加大促銷、提供優惠產品，吸引現有顧客重複、多樣購買，以爭取潛在顧客。"},{"n":144,"cat":"定價策略","q":"以現有的客戶為基礎，運用相關資料及縱橫交錯的人際關係，藉之尋找新客戶、開拓新市場或銷售新產品，是指哪一項策略？","o":{"A":"量價策略","B":"價量策略","C":"交叉策略","D":"扭轉策略"},"a":"C","e":"「交叉策略」（cross strategy）也被稱為「關係策略」（relationship）；另一種意義則是引誘客戶在同一品牌家族中購買數種產品，或是在一家旅行社購買數個不同部門的產品。"},{"n":145,"cat":"定價策略","q":"關於網路銷售對於旅行社擴張市場之成效，下列選項何者為非？","o":{"A":"提高搜尋的成本","B":"增加顧客的購買傾向","C":"加強目標銷售的能力","D":"提高產品和服務的個別化"},"a":"A","e":"應改為降低搜尋的成本。"},{"n":146,"cat":"定價策略","q":"分析臺灣旅行社產業變遷趨勢中｢大型旅行業｣的競爭策略，下列何者為非？","o":{"A":"定位為社區型通路","B":"發展全省連鎖加盟店","C":"積極塑造公司專業形象","D":"專屬個人化旅遊商品"},"a":"A","e":"定位為社區型通路應屬｢小型旅行業｣的競爭策略。"},{"n":147,"cat":"定價策略","q":"降價無法解決價錢競爭的問題，下列對於降價之描述何者較不適宜？","o":{"A":"容易被同業以相同手法作為號召","B":"當恢復正常價錢時消費者可能就不再光顧了","C":"不一定資本雄厚的旅行業者才能運用此一策略","D":"容易導致旅遊商品的偷工減料"},"a":"C","e":"只有資本雄厚的旅行業者才能夠在廉價競爭中維持生存下去。"},{"n":148,"cat":"定價策略","q":"臺灣知名旅遊網站在經營模式上有許多共通特點，下列何者為非？","o":{"A":"大型知名旅遊網站不一定具有較大的生存空間","B":"旅遊資訊的品質數量應準確豐富","C":"客製化的個人服務","D":"進入品牌競爭階段"},"a":"A","e":"大型知名旅遊網站具有較大的生存空間；在網際網路裡，如果流量過少，則無法搶佔較多的市場佔有率，而這也就是為什麼大型知名旅遊網站往往投入大量資金於其中的緣故。"},{"n":149,"cat":"定價策略","q":"陳先生報名參加甲旅行社之新加坡 4 天團，費用 15,000 元，但是出發後發現已被轉至乙旅行社出團，試問此時陳先生至少可向甲旅行社請求多少賠償金？","o":{"A":"15,000 元","B":"2,250 元","C":"1,500 元","D":"750 元"},"a":"D","e":"旅遊消費者於出發後始發覺或被告知本契約已轉讓其他旅行社，旅行業者應賠償旅遊消費者全部團費 5%之違約金。"},{"n":150,"cat":"定價策略","q":"通常臺灣至歐洲的旅行團所採取旅館計價方式為何？","o":{"A":"歐式計價","B":"美式計價","C":"修正的美式計價","D":"歐陸式計價"},"a":"D","e":"歐陸式計價（continental plan， CP）房租包含早餐在內。"},{"n":151,"cat":"定價策略","q":"泰國五天四夜的套裝旅遊原價 25200 元，優惠價 18000 元，因此原價 25200 就是一種:","o":{"A":"預期價格","B":"外部參考價格","C":"內部參考價格","D":"目標價格"},"a":"B","e":"外部參考價格是消費者根據現場觀測到的價格而形成一種應付價格的參考點，而內部參考價格則是消費者因為過去自身經驗，記憶形成的參考價格。企業在進行折扣促銷時，常會利用外部參考價格刺激購買，使得優惠價格看起來更便宜且短暫，進而會加速消費者的購買決策。"},{"n":152,"cat":"定價策略","q":"哈根達斯冰淇淋專賣店都選在時尚繁華路段，店面也常投入鉅資由設計師精心設計，用溫馨、輕鬆、時尚、浪漫的氣氛包圍每一位上門的顧客，讓顧客在品嘗冰淇淋的同時，體會優雅的「哈根達斯一刻」。由此可知，哈根達斯的訂價目標是：","o":{"A":"提高市場佔有率","B":"牽制競爭者","C":"鞏固高品質的形象","D":"追求財務績效"},"a":"C","e":"哈根達斯號稱是冰淇淋界的勞斯萊斯，一向重視品質遠超出成本的考量，因此哈根達斯的定價通常是為了建立高品質形象。"},{"n":153,"cat":"定價策略","q":"王先生在學校附近開了一家餐廳，考量顧客多為年輕學生族群，因此提供便宜又份量大的餐點，請問影響他定價的因素主要為何？","o":{"A":"消費者認知","B":"回本與生存","C":"品質形象","D":"競爭因素"},"a":"A","e":"學生族群對於價格極為敏感，因此王先生以消費者認知導向的低價策略吸引學生上門。"},{"n":154,"cat":"定價策略","q":"林太包子店將包子成本乘上 1.2 倍後訂定包子的單價，請問這是哪種定價法？","o":{"A":"成本加成法（markup on cost）","B":"售價加成法（markup on selling price）","C":"利潤訂價法（target profit pricing）","D":"目標報酬訂價法（target return pricing）"},"a":"A","e":"成本加成法是將產品單位成本加上該成本的某個百分比而得出售價。"},{"n":155,"cat":"定價策略","q":"Tasty 牛排的定價是以當時一般中價位牛排店的售價（700～800 元）打七折後設定為 490 元左右的售價，請問這是哪一種定價策略？","o":{"A":"成本加成法（markup on cost）","B":"售價加成法（markup on selling price）","C":"現行費率定價法（going-rate pricing）","D":"目標報酬訂價法（target return pricing）"},"a":"C","e":"現行費率定價法是業者訂定與主要競爭者相同、較高或較低的價格，是一種以競爭者為基礎的定價法。"},{"n":156,"cat":"定價策略","q":"旅行社門口張貼「機+酒東京自由行 5 日遊只要$16,900」的宣傳海報，請問這是採用哪種定價手法？","o":{"A":"互補定價（complementary pricing）","B":"價格結構化（price framing）","C":"差別定價（discriminatory pricing）","D":"配套式定價（bundle pricing）"},"a":"D","e":"配套式定價是以較低的整體價格吸引消費者購買，美化核心產品的價值，或聯合促銷相關產品。"},{"n":157,"cat":"定價策略","q":"肯德基的哈辣雞翅餐售價 119 元，勁辣雞腿堡套餐 199 元，請問這採取了哪種心理定價？","o":{"A":"畸零定價（odd-even pricing）","B":"習慣定價（customary pricing）","C":"價格線定價 （price lining）","D":"聲望定價（prestige pricing）"},"a":"A","e":"畸零定價法不用整數，而是以畸零的數字（如 7 或 9）來定價，主要目的是讓消費者在心理上將價格歸類在比較便宜的區隔之內。"},{"n":158,"cat":"定價策略","q":"下列何者不屬於差別訂價（discriminatory pricing）?","o":{"A":"主題樂園分為成人票、軍警票與學生票","B":"墾丁休閒飯店的面海房較貴","C":"麥當勞點套餐另付 59 元可加購麥香雞塊","D":"機票提早訂位較便宜，臨櫃現買則較貴"},"a":"C","e":"差別定價是針對同一產品，依顧客特性、消費地點與時間等因素訂定不同價格的定價法，而 （ C ） 則屬於組合定價法。"},{"n":159,"cat":"定價策略","q":"下列何者屬於功能性折扣（functional discount）？","o":{"A":"住宿四人同行一人免費","B":"60 歲以上老年人搭高鐵半價","C":"超值住房不含早餐 2999 元","D":"旅行社團體訂機票 15 人以上第 16 人免費"},"a":"D","e":"功能性折扣又稱促銷折讓（promotional allowances）是上游廠商提供折扣給執行銷售、廣告、售後服務等功能的中間商。"},{"n":160,"cat":"定價策略","q":"平價咖啡連鎖店因應成本將咖啡從 45 元調漲到 55 元，平日只喝平價咖啡的顧客無奈指出：「以後會少在外面買咖啡，盡量在家裡自己煮咖啡」，這是因為哪種心理定價所致:","o":{"A":"畸零定價（odd-even pricing）","B":"習慣定價（customary pricing）","C":"價格線定價 （price lining）","D":"聲望定價（prestige pricing）"},"a":"B","e":"習慣定價是根據消費者對某個產品長期的、根深蒂固的認知價格進行定價，因此業者調漲時必須盡量壓低漲幅。"},{"n":161,"cat":"定價策略","q":"最後一刻定價法（last minute pricing）的目的在於克服服務產品的哪一種特性？","o":{"A":"無形性","B":"不可分割性","C":"不可儲存性","D":"易變性"},"a":"C","e":"最後一刻定價法主要是因 應服務產品會隨時間消逝的特性而發展出的定價法。"},{"n":162,"cat":"定價策略","q":"如果有一家新開幕的簡餐店，鄰近一所大學，客群多是學生，附近已有許多餐廳，且老闆想要盡快獲利回本，請問您會建議他應該採用何種定價策略?","o":{"A":"吸脂定價 （market-skimming pricing）","B":"滲透定價（market-penetration pricing）","C":"配套式定價（bundle pricing）","D":"互補定價（complementary pricing）"},"a":"B","e":"滲透定價是在導入期以低價銷售，目的是在短期內加速市場成長，犧牲毛利率以獲得較高的銷售量及市場佔有率"},{"n":163,"cat":"定價策略","q":"在法國買 LV 名牌包比臺灣便宜許多，但臺灣觀光客到法國LV 皮包店時，店家規定只有一件商品可以開立退稅證明，以避免觀光客回臺後轉賣套利，這項規定與哪種定價法有關？","o":{"A":"互補定價（ｃomplementary pricing）","B":"價格結構化（price framing）","C":"差別定價（discriminatory pricing）","D":"配套式定價（bundle pricing）"},"a":"C","e":"差別定價應避免「轉賣套利」，例如甲地定價高而乙地較低價，如果在乙地買甲地賣還有餘利，則會有轉賣套利的機會，那差別訂價法便可能失效。"},{"n":164,"cat":"定價策略","q":"在實務上，下列哪一項最難以操作加成定價法（markup pricing）？","o":{"A":"飯店管家的價格","B":"一杯咖啡的定價","C":"餐廳一道菜的定價","D":"團體旅遊的遊覽車資"},"a":"A","e":"飯店管家必須 24 小時隨身照料客人在飯店的一切大小事情，付出的精神與勞力很難計算，很難以小時計算其薪資成本。"},{"n":165,"cat":"定價策略","q":"星巴克咖啡面對 7-ELEVEN、85 度 C、麥當勞等平價咖啡的競爭後，不定期運用好友分享日買一送一的折扣，此促銷的最主要目的在於：","o":{"A":"留住原有顧客","B":"開發新的顧客","C":"提高顧客滿意度","D":"擴大市場佔有率"},"a":"A","e":"星巴克為維護高價高品質的形象，不願以直接降價促銷損及價值感，但又怕原有顧客流失，因此利用好友分享日讓原有顧客能夠回籠而不致流失。"},{"n":166,"cat":"定價策略","q":"當供給大於需求時，飯店業者在定價上可以如何因應？","o":{"A":"提高房價以價制量","B":"預約時要求收取全額房價","C":"為了確保利潤，超額訂房","D":"住房附加旅遊行程"},"a":"D","e":"供過於求時飯店常以優惠房價或附加價值作為誘因，吸引消費者入住。（A）、（B）、（C）則用於求過於供時。"},{"n":167,"cat":"定價策略","q":"飯店在網頁上標示行政豪華套房一間定價$13,000 元（不含任何餐食），請問這是哪種房間定價法？","o":{"A":"美式計價法","B":"歐式計價法","C":"百慕達式計價法","D":"歐陸式計價法"},"a":"B","e":"歐洲計價法：僅以房間費用計算，不包括餐食費用，我國觀光飯店大多採用此種方式。"},{"n":168,"cat":"定價策略","q":"下列何者不屬於旅行社國民旅遊估價的變動成本？","o":{"A":"飯店費用","B":"門票費用","C":"領團人員費用","D":"廣告費用"},"a":"D","e":"團體行程估價的變動成本常以隨著人數變動而變動的成本，因此（D）屬於固定成本"},{"n":169,"cat":"定價策略","q":"下列哪種操作方式較可能讓打折促銷不賺反賠？","o":{"A":"歡度週年慶限量 500 杯咖啡買一送一","B":"泰國旅遊團降價為 12，000，5 月 1 日後立即調回原價","C":"所有漢堡通通「多一元加一件」「天天不限時段」","D":"春假期間持軍公教人員證件，就可享有兩人同行、每人 1150 元的優惠住宿"},"a":"C","e":"多一元加一件是個相當吸引人的優惠促銷方案，但沒有限定產品、時間、數量或特定對象，可能導致消費者反應過熱、銷售量暴增造成缺貨引客怨，或最終不堪虧損早早收場的窘境。"},{"n":170,"cat":"通路策略","q":"_____係為一群獨立之組織參與產品或服務之製造過程，使得消費者或企業用戶能夠順利取得產品或服務。","o":{"A":"產品開發","B":"價格制定","C":"配銷通路","D":"促銷推廣"},"a":"C","e":"配銷通路（distribution channel）係為一群獨立之組織參與產品或服務之製造過程，使得消費者或企業用戶能夠順利取得產品或服務。"},{"n":171,"cat":"通路策略","q":"對於消費者而言，三階行銷通路之中，何者直接接觸消費者？","o":{"A":"製造商","B":"批發商","C":"中盤商","D":"零售商"},"a":"D","e":"零階通路之外，消費者均與零售商接觸。"},{"n":172,"cat":"通路策略","q":"針對聯盟（alliance）之敘述何者為非？","o":{"A":"一種契約協定形式","B":"可使兩家機構藉由彼此優勢獲致利益","C":"二者具有絕對之主從關係","D":"經常見於旅行業者與航空業者之配銷形式"},"a":"C","e":"聯盟（alliance）係為一種契約協定形式，聯盟可使兩家機構藉由彼此優勢獲致利益。聯盟成員之間多數均為對等之關係，而非主從關係。"},{"n":173,"cat":"通路策略","q":"下列針對企業式垂直行銷系統（corporate vertical marketing system, Corporate VMS）之敘述何者為真？","o":{"A":"生產與配銷之連續階段均於單一所有權之下","B":"協調生產與配銷之連續階段之時主要透過某一方之規模與權利","C":"不同階層之生產與配銷個別公司組成","D":"同一通路階層之兩個或兩個以上之通路成員結合成為一個聯盟共同開拓行銷之機會"},"a":"A","e":"企業式垂直行銷系統（corporate vertical marketing system, Corporate VMS）係為生產與配銷之連續階段均於單一所有權之下。所有生產與配銷之連續階段均於單一所有權之下係為此一行銷系統之特徵。"},{"n":174,"cat":"通路策略","q":"下列針對管理式垂直行銷系統（administered vertical marketing system, administered VMS）之敘述何者為非？","o":{"A":"行銷系統之內所有權各自獨立","B":"藉由合約約束彼此關係","C":"可能藉由規模與權利決定何者係為生產與配銷之協調者","D":"成員彼此分別係處生產與配銷連續帶之前後位置"},"a":"B","e":"管理式垂直行銷系統（administered vertical marketing system, administered VMS）係為協調生產與配銷之連續階段之時，並非透過共同所有權或合約約束，而係透過某一方之規模與權利。管理式垂直行銷系統並無合約之約束，此為契約型垂直行銷系統之特徵。"},{"n":175,"cat":"通路策略","q":"下列針對契約型垂直行銷系統（contractual vertical marketing system, contractual VMS）之敘述何者為真？","o":{"A":"成員之間係屬相同通路階層","B":"所有生產與配銷之連續階段均於單一所有權之下","C":"合約規範與約束成員關係","D":"通常係以行銷策略聯盟稱呼此一關係"},"a":"C","e":"契約型垂直行銷系統（contractual vertical marketing system, contractual VMS）係由不同階層之生產與配銷個別公司組成，彼此藉由合約獲得規模經濟或銷售影響力。合約與契約係為此一行銷系統之主要特徵。"},{"n":176,"cat":"通路策略","q":"某家餐飲加盟系統的加盟店抱怨其他的加盟店使用次級食材，影響餐飲加盟系統的整體形象，此為____。","o":{"A":"水平衝突","B":"垂直衝突","C":"人際衝突","D":"形象衝突"},"a":"A","e":"水平衝突（horizontal conflict）係指，同一通路階層成員之間之衝突。此例係屬同一通路階層之衝突，因此，係屬水平衝突。"},{"n":177,"cat":"通路策略","q":"航空公司降低旅行業者機票銷售佣金金額，致使旅行業者心生不悅，降低推薦該家航空公司航班與機位之意願，此為?","o":{"A":"水平衝突","B":"垂直衝突","C":"人際衝突","D":"形象衝突"},"a":"B","e":"垂直衝突（vertical conflict）係指同一通路之中，不同階層之間之衝突。此例係屬不同通路階層之衝突，因此，係屬垂直衝突。"},{"n":178,"cat":"通路策略","q":"國內若干旅館業者藉由簽約成為國際旅館品牌之成員，藉以運用合作體系之訂房系統進行銷售。此屬何種通路組織？","o":{"A":"企業式垂直行銷系統","B":"管理式垂直行銷系統","C":"契約型垂直行銷系統","D":"水平型行銷通路系統"},"a":"C","e":"契約型垂直行銷系統（contractual vertical marketing system, contractual VMS）係由不同階層之生產與配銷個別公司組成，彼此藉由合約獲得規模經濟或銷售影響力。此例生產與配銷之關係係由契約規範，因此，係屬契約型垂直行銷系統。"},{"n":179,"cat":"通路策略","q":"針對加盟（franchising）之敘述何者為非？","o":{"A":"加盟涵蓋一個加盟總部與至少一個以上之加盟店","B":"加盟總部與加盟店二者具有相同且單一之所有權","C":"加盟店獲得權利可以從事加盟總部設計行銷方式之供給、銷售或配銷產品或服務","D":"加盟總部允許加盟店使用商標、名稱與廣告"},"a":"B","e":"加盟（franchising）係為加盟店（franchisee）獲得權利可以從事加盟總部（franchisor）設計行銷方式之供給、銷售或配銷產品或服務。加盟總部允許加盟店使用商標、名稱與廣告。惟於二者不具相同且單一之所有權。"},{"n":180,"cat":"通路策略","q":"_____係指通路成員中之供應商或中間商，產生領導者組織通路成員，並由領導者設定通路政策、協調行銷組合策略，並對通路成員之績效加以獎懲與控制。","o":{"A":"產品整合","B":"通路整合","C":"價格整合","D":"促銷整合"},"a":"B","e":"通路整合（channel integration）係指通路成員之中之供應商或中間商，產生領導者組織通路成員，並由領導者設定通路政策、協調行銷組合策略，並對通路成員之績效加以獎懲與控制。"},{"n":181,"cat":"通路策略","q":"航空公司透過旅行業者銷售機票給消費者。此為下述何種通路類型？","o":{"A":"零階通路","B":"一階通路","C":"二階通路","D":"三階通路"},"a":"B","e":"此例具有一個中間商階層，因此，係為一階通路。"},{"n":182,"cat":"通路策略","q":"某位消費者欲訂海外某家旅館之豪華客房，此項旅遊服務係由某家零售旅行業者承接，零售旅行業者接單之後，轉由旅館訂房中心訂妥並且開立住宿票券，轉由零售旅行業者交付消費者。此為下述何種通路類型？","o":{"A":"零階通路","B":"一階通路","C":"二階通路","D":"三階通路"},"a":"C","e":"此例具有兩個中間商階層，因此，係為二階通路。"},{"n":183,"cat":"通路策略","q":"下列針對水平行銷通路系統（horizontal channel integration）之敘述何者為非？","o":{"A":"行銷系統之內所有權各自獨立","B":"成員之間係屬相同通路階層","C":"通常係以行銷策略聯盟稱呼此一關係","D":"成員彼此分別係處生產與配銷連續帶之前後位置"},"a":"D","e":"水平型行銷通路系統（horizontal channel integration）係將屬於同一通路階層之兩個或兩個以上之通路成員，結合成為一個聯盟共同開拓行銷之機會。"},{"n":184,"cat":"通路策略","q":"對於觀光餐旅產業之配銷通路而言，下列何者為非？","o":{"A":"通路衝突妨礙通路運作","B":"企業與中間商必須同意通路成員之條件與責任","C":"企業必須持續激勵通路成員","D":"配銷通路最為重要之部份係為營業地點"},"a":"A","e":"通路衝突（channel conflict）並非全然無益，部份通路衝突係為有益之競爭形式，若非如此，通路勢將變得被動與毫無創新。"},{"n":185,"cat":"通路策略","q":"旅行業者與航空業者最為常見之配銷形式為何？","o":{"A":"連鎖","B":"加盟","C":"聯盟","D":"合資"},"a":"C","e":"聯盟（alliance）係為旅行業者與航空業者最為常見之配銷形式。"},{"n":186,"cat":"通路策略","q":"復興航空公司成立國盛旅行社經營票務代理。此屬何種通路組織？","o":{"A":"企業式垂直行銷系統","B":"管理式垂直行銷系統","C":"契約型垂直行銷系統","D":"水平型行銷通路系統"},"a":"A","e":"企業式垂直行銷系統（corporate vertical marketing system, Corporate VMS）係為生產與配銷之連續階段均於單一所有權之下。此例生產與配銷均由單一業者掌控，因此，係屬企業式垂直行銷系統。"},{"n":187,"cat":"通路策略","q":"某家專營票務代理之旅行業者負責某家外籍航空公司絕大部份之機位銷售，此時此一旅行業者對於航空公司之機位票價、推廣策略均具偌大之影響能力。此屬何種通路組織？","o":{"A":"企業式垂直行銷系統","B":"管理式垂直行銷系統","C":"契約型垂直行銷系統","D":"水平型行銷通路系統"},"a":"B","e":"管理式垂直行銷系統（administered vertical marketing system, administered VMS）係為協調生產與配銷之連續階段之時，並非透過共同所有權或合約約束，而係透過某一方之規模與權利。此例生產與配銷均由一方掌控，因此，係屬管理式垂直行銷系統。"},{"n":188,"cat":"通路策略","q":"大量出團之躉售旅行業者選擇銷售通路之時，多以全省各地之零售旅行業者為其通路成員。此即通路分配強度之_______。","o":{"A":"直接銷售","B":"獨家分配","C":"選擇性分配","D":"密集式分配"},"a":"D","e":"密集式分配係為盡可能地將通路置於所有可能之銷售據點，以期能夠接觸更多之消費者。此例即為密集鋪設通路之案例，因此，係屬密集式分配。"},{"n":189,"cat":"通路策略","q":"某家航空公司依據出團數量做為考量因素，選擇數家旅行業者做為主要代理商。此即通路分配強度之____。","o":{"A":"直接銷售","B":"獨家分配","C":"選擇性分配","D":"密集式分配"},"a":"C","e":"選擇性分配係以選擇一家以上之中間商經銷產品，然而，此一數目遠較所有願意經銷此一產品之中間商數目為低。此例即為選擇數家中間商授權之案例，因此，係屬選擇性分配。"},{"n":190,"cat":"通路策略","q":"若以旅遊產業為例，下列何者非為旅遊中介機構之功能？","o":{"A":"尋找與溝通潛在購買者","B":"調整產品或服務符合顧客需求","C":"蒐集與傳送有關行銷環境之行銷研究與情報資訊","D":"提高產品與服務售價"},"a":"D","e":"旅遊產業之中介機構可以發揮資訊（蒐集與傳送有關行銷環境之行銷研究與情報資訊）、宣傳、聯繫（尋找與溝通潛在購買者）、搭配（調整產品或服務符合顧客需求）、協議、實物分配、融資，以及風險。惟於產品與服務售價方面，為求提高消費者選擇通路之意願，旅遊中介機構提供之旅遊產品多數選較消費者直接購買供應商產品之價格為低。"},{"n":191,"cat":"通路策略","q":"時下眾多旅行業者藉由同業合團之方式招攬旅客出國，並且成立所謂之「出團中心」，採取利潤中心之方式經營。此屬何種通路組織？","o":{"A":"企業式垂直行銷系統","B":"管理式垂直行銷系統","C":"契約型垂直行銷系統","D":"水平型行銷通路系統"},"a":"D","e":"水平型行銷通路系統（horizontal channel integration）係將屬於同一通路階層之兩個或兩個以上之通路成員，結合成為一個聯盟共同開拓行銷之機會。此例係由同一通路階層彼此合作，因此，係屬水平型行銷通路系統。"},{"n":192,"cat":"通路策略","q":"直效行銷通路亦稱______。","o":{"A":"零階通路","B":"一階通路","C":"二階通路","D":"三階通路"},"a":"A","e":"直效行銷通路並無中間商階層，係由製造商直接銷售產品給消費者，亦稱零階通路。"},{"n":193,"cat":"通路策略","q":"某家低成本航空公司並未委由任何中間商進行代理，消費者必須直接透過官方網站進行線上購買。此即通路分配之_____。","o":{"A":"直接銷售","B":"獨家分配","C":"選擇性分配","D":"密集式分配"},"a":"A","e":"直接銷售並無中間商階層，係由生產者直接銷售產品給消費者。此例即為缺乏中介機構之案例，因此，係屬直接銷售。"},{"n":194,"cat":"通路策略","q":"國內航空業者積極加入國際航空公司所組的航空聯盟，諸如：華航加入天合聯盟（SkyTeam Alliance），下列何者非為加入航空聯盟的優點？","o":{"A":"擴大客戶來源","B":"提供旅客更多航點選擇","C":"提高機票價格","D":"增加優惠酬賓內容"},"a":"C","e":"加入航空聯盟未必影響機票價格。"},{"n":195,"cat":"通路策略","q":"某家外籍航空公司於國內選擇某家旅行業者獨家代理機票販售，其他旅行業者或消費者欲購該家航空公司之機票即須透過此一代理旅行業者購買。此即通路分配強度之_____。","o":{"A":"直接銷售","B":"獨家分配","C":"選擇性分配","D":"密集式分配"},"a":"B","e":"獨家代理係為通路分配強度最為極端之狀況，亦即僅僅授權某一中間商享有獨家經銷之權利。此例即為單一授權之案例，因此，係屬獨家分配。"},{"n":196,"cat":"通路策略","q":"在競爭激烈的市場環境中，許多企業採用多元通路來傳遞產品及服務，這些多元通路被稱之為？","o":{"A":"混合型通路","B":"垂直行銷通路","C":"水平行銷通路","D":"網路行銷"},"a":"A","e":"混合型通路（Hybrid Channels）綜合直接與間接的多元通路配銷系統，用來增加市場涵蓋率，回應不同市場區隔的偏好，降低成本以及利用科技的改變（Ujma, 2001; Pearce & Tan, 2006）。"},{"n":197,"cat":"通路策略","q":"過去當旅遊市場越來越蓬勃發展，旅行社為了將資訊更快速的傳遞給消費者，遂採用「廣播電台」或「報章雜誌」的方式；下列對此兩種通路描述，何者為是？","o":{"A":"「廣播電台」行銷為高涉入和理性涉入","B":"「報章雜誌」行銷為低涉入和理性涉入","C":"「廣播電台」行銷為低涉入和情感涉入","D":"「報章雜誌」行銷為高涉入和情感涉入"},"a":"C","e":"「廣播電台」行銷為低涉入和情感涉入，但「報章雜誌」一般則為高涉入和理性涉入之通路（Chaudhuri & Buck, 1995）。"},{"n":198,"cat":"通路策略","q":"「透過多媒體的整合能夠使旅遊產品有形化，因而降低消費者對旅遊產品所感受的無形性」，根據此段描述，可得知應為何種通路？","o":{"A":"報章雜誌","B":"零售旅行社","C":"直售","D":"電視購物"},"a":"D","e":"電視購物為新興配銷通路，改變傳統旅行業的行銷通路。"},{"n":199,"cat":"通路策略","q":"下列何者非為旅行業「傳統行銷通路」？","o":{"A":"廣播電台","B":"報章雜誌","C":"電視購物","D":"零售旅行社"},"a":"C","e":"旅行業之傳統通路包括直售、報章雜誌、策略聯盟、零售旅行社和廣播電台；新興通路則包括電視購物、電子商務。"},{"n":200,"cat":"通路策略","q":"現今許多企業必須採取傳統通路與新興通路並進的方式經營，例如雄獅旅行社除零售店面外，也是市場上首先使用電子商務者；據此，最不可能成為採用新興通路動機的是哪一項？","o":{"A":"降低成本","B":"擴大市場","C":"改變消費者行為","D":"增加銷售量"},"a":"C","e":"應為改善消費者滿意度；以上動機也顯示出採用多元行銷通路與企業經營的策略與目標環環相扣。"},{"n":201,"cat":"通路策略","q":"「旅客不必出門，在家就可以購買旅遊產品」，指出電視購物的便利性，並且也打破了時空的限制；對於越來越多的消費者願意透過電視購物的原因，何者最為不可能的因素？","o":{"A":"消費者查覺傳統購物害怕與危險的經驗越來越少","B":"電視購物提供的產品很吸引人","C":"現今消費者對於購物資訊的大量需求","D":"消費者對科技的適應越來越高"},"a":"A","e":"消費者查覺傳統購物害怕與危險的經驗越來越多；例如在購物時可能有被偷竊的風險，使顧客倍感威脅，然而，電視購物則是提供一個舒適安全的購物環境，讓顧客安心選購。"},{"n":202,"cat":"通路策略","q":"關於電視購物的定義，下列何者不正確？","o":{"A":"分為「信息廣告」（Informercials）和「電視購物」（TV Shopping）兩種","B":"為零售通路的一種","C":"內容兼具商業化性質與娛樂性質","D":"在有線電視播放"},"a":"C","e":"內容是以商業化性質節目播出，並非娛樂性質之節目，目的為銷售產品，獲取利潤。"},{"n":203,"cat":"通路策略","q":"打開電視，會發現購物頻道常以旅遊電視購物作為旅遊產品銷售與展示平台，且比例越來越高；對此現象，我們可得知？","o":{"A":"跟到實體店面去購買並無差別","B":"對「鼓吹消費者購買旅遊產品」無實質幫助","C":"與旅行業者屬競爭關係","D":"結合影像與聲音來創造符合旅遊產品特性之氛圍"},"a":"D","e":"不像到實體店面去購買旅遊產品，電視購物僅能單憑目錄或電視購物台之內容決定購買其產品；（B）對「鼓吹消費者購買旅遊產品」有實質幫助，電視購物是不打烊的行銷媒體，是 24 小時不休不眠的向你銷售；（C）可促進旅行業者的知名度，電視購物不僅可以增加消費者對於旅遊產品的了解與認知，更可提高產品曝光度和旅行業者的知名度。"},{"n":204,"cat":"通路策略","q":"一般而言，國內旅行業者與異業合作夥伴的合作型態以╴╴╴為首，最主要動機都是在促銷彼此間的產品。","o":{"A":"促銷活動的配合","B":"代為促銷產品","C":"新市場的開發與交流","D":"開發新產品"},"a":"A","e":"國內旅行業者與異業合作型態以「促銷活動的配合」為首，最主要動機都是在促銷彼此間的產品。再則「代為促銷產品」也常發生在垂直合作產業中的航空公司、遊樂區、飯店等行業。至於「新市場的開發與交流」，大多與同業或航空公司增闢新航線合作開發新旅遊路線較為多見。"},{"n":205,"cat":"通路策略","q":"中華航空成立關係企業—華旅網際旅行社後，陸續推出線上交易旅遊網站 YesTrip.com，產品包括華航、華信航空國內外機票、套裝旅遊行程、電子旅遊平安險與各國旅遊及班機資訊等；此種通路整合方式稱為？","o":{"A":"傳統行銷系統","B":"直接行銷系統","C":"垂直行銷系統","D":"水平行銷系統"},"a":"C","e":"垂直行銷系統（Vertical Marketing System, VMS）整合上中下游的廠商，並且透過規模、談判力以及避免重複作業等達到經濟性。"},{"n":206,"cat":"通路策略","q":"在旅行同業中企圖分散風險，擴大出團規模，共享規模經濟利益之聯營（PAK）型態，應屬於何種系統？","o":{"A":"傳統行銷系統","B":"直接行銷系統","C":"垂直行銷系統","D":"水平行銷系統"},"a":"D","e":"水平行銷系統（Horizontal Marketing System, HMS）係在同一層次上兩家或兩家以上的公司聯合共同開拓新的市場機會，以完成獨家經營所不能達到的效果。"},{"n":207,"cat":"通路策略","q":"傳統╴╴╴的機票銷售已隨著網際網路的蓬勃發展，以及╴╴╴的有效推廣，破除了傳統的機票配銷模式，原本╴╴╴具備的通路功能，亦由資訊軟體所取而代之，顧客可直接透過網路購買機票。空格應填入？","o":{"A":"旅行業；航空公司；中間商","B":"航空公司；電子機票；中間商","C":"航空公司；電子商務；中間商","D":"航空公司；電子商務；批發商"},"a":"B","e":"由於航空公司減少了佣金的支出，以及部分的成本費用，致使獲利提升，因而有越來越多的航空公司正積極將原來通路朝網路售票邁進。"},{"n":208,"cat":"通路策略","q":"下列有關旅行業通路的敘述，何者有誤？","o":{"A":"在台灣，尚無達到全球化、集團化的旅遊業","B":"旅行業電子商務發展結果降低不確定性","C":"旅行業電子商務發展結果提高交易率","D":"旅行業發展線上服務並不能完全取代傳統旅行業的全部功能"},"a":"A","e":"雄獅旅遊集團旗下除海內外旅行社外，也經營車公司、行銷公司、傳媒公司、資訊公司等。"},{"n":209,"cat":"通路策略","q":"旅行社相對於旅遊上游供應商是具有中間商功能的角色，下列選項何者為非？","o":{"A":"提供資訊服務","B":"增加銷售服務","C":"增加交易成本","D":"促進產品研發"},"a":"C","e":"降低交易成本；旅行社可減少通路系統中的交易次數與成本。"},{"n":210,"cat":"通路策略","q":"電子商務為未來重要的競爭要素之一，就連旅行業者也不容忽視，它除了可以廣泛地接觸不同層級的消費者外，亦可以增加產品之競爭力；以下就「電子商務之優勢」的相關描述，何者有誤？","o":{"A":"旅遊上游供應商可以直接與顧客連結","B":"免除存在於消費者與上游供應商之間不公平的障礙","C":"加速公平性競爭","D":"增加價格歧視的機會"},"a":"D","e":"減少價格歧視的機會；價格歧視（Price discrimination）係獨佔者指對同一物品向某些消費者收取較高的價格，或者對少量購買者所收取的價格高於對大量購買者所收取的價格。因此透過電子商務，消費者可對商品之訂價有較高掌握度，減少價格歧視的機會。"},{"n":211,"cat":"通路策略","q":"電子商務的經營將使旅行業原本以╴╴╴為收入的經營導向轉為以收取╴╴╴的經營方式。上述空格處應分別填入？","o":{"A":"佣金；佣金","B":"服務費；服務費","C":"佣金；服務費","D":"服務費；佣金"},"a":"C","e":"由於電子商務的興起，旅行業者的佣金（commission）逐漸降低，完全衡量旅行業者個別之績效表現而給予不同比率的佣金；亦或反過來向旅遊消費者酌收服務費（service fees），未來此種交易模式將為旅行業之常規。"},{"n":212,"cat":"通路策略","q":"定期舉辦之台北國際旅展（ITF）總會吸引成千上萬人次前往觀展，且年年刷新觀展人次記錄，因此，被各大旅遊業者視為是重要的宣傳通路之一；以下對台北國際旅展的描述，何者為非？","o":{"A":"媒體曝光率高","B":"展前官方網站並不會先行開放","C":"提升國際競爭力","D":"只純粹做觀光旅遊推廣"},"a":"B","e":"展前於官方網站開放線上旅展，吸引大量網路使用者先行點閱。"},{"n":213,"cat":"通路策略","q":"以下對於航空公司自行建置網路，建立電子商務者，哪一項敘述有誤？","o":{"A":"可省去旅行社代售佣金部分","B":"可從網路訂購資料中分析消費行為","C":"無時間與地域之限制","D":"成本無明顯縮減"},"a":"D","e":"成本明顯縮減；如人事成本、租金及設備等費用。"},{"n":214,"cat":"通路策略","q":"「航空公司網路售票」係屬於哪一種通路階層？","o":{"A":"零階通路","B":"一階通路","C":"二階通路","D":"三階通路"},"a":"A","e":"零階通路，又稱為直接銷售通路；係由製造商直接將商品售予消費者，中間沒有其他中間商，如傳銷業、航空公司等網路售票皆屬之。"},{"n":215,"cat":"通路策略","q":"以下對配銷通路衝突產生原因之描述，何者有誤？","o":{"A":"通路成員目標不一","B":"通路成員於背景、經驗，價值觀等的差異","C":"通路成員職能劃分明確","D":"通路成員間存有利益矛盾"},"a":"C","e":"通路成員職能劃分不夠明確，產生衝突。"},{"n":216,"cat":"通路策略","q":"「商務旅遊」（Business Travel）為近年頗受國內外旅遊業者關注的旅行方式之一，分析其原因，最不可能為？","o":{"A":"涉及層面廣，除交通、食宿外，可能還有體育賽事、文化和宴會等","B":"食宿費用通常由公家支付，因此遊客本身於休閒方面可能花費較多","C":"為國外旅行社的主業務之一","D":"商務旅客所佔比例仍低"},"a":"D","e":"商務旅客具有量大且沒有季節性因素影響的特點。"},{"n":217,"cat":"銷售推廣策略","q":"針對旅行社銷售通路的選擇標準，何者為非？","o":{"A":"客源市場的集中程度","B":"旅行社同競爭市場的距離","C":"旅行社自身條件","D":"經濟效益"},"a":"B","e":"應改成旅行社同目標市場的距離。"},{"n":218,"cat":"銷售推廣策略","q":"何者非為「選擇性通路策略」之優點？","o":{"A":"銷售成本低","B":"市場覆蓋面廣","C":"合作關係穩定","D":"實行難度小"},"a":"D","e":"選擇性通路策略通常實行難度較大，且具有一定風險。"},{"n":219,"cat":"銷售推廣策略","q":"促銷具有說服消費者的功能，這一項功能用來提高消費者的興趣、刺激消費的知覺以及購買、消費產品或服務的慾望，我們稱這項功能為？","o":{"A":"溝通功能","B":"刺激功能","C":"定位功能","D":"規劃功能"},"a":"A","e":"促銷主要目的是希望將訊息傳遞給消費者，並期待能打動消費者接受該訊息，是屬一種溝通功能。"},{"n":220,"cat":"銷售推廣策略","q":"企業願意花費大筆權利金取得奧運官方贊助商的資格，下列哪一項不是他們的主要目的？","o":{"A":"公司形象提升","B":"招待禮遇機會取得","C":"取得產品試用或銷售機會","D":"平衡公司收支"},"a":"D","e":"企業在採取贊助策略時，其效益包括企業或產品知名度的提升、企業或產品形象的強化、獲得產品試用或銷售機會，以及禮遇機會的取得等。"},{"n":221,"cat":"銷售推廣策略","q":"臺灣一年一度的臺北國際馬拉松，從 ING 臺北國際馬拉松更名為臺北富邦國際馬拉松，這是運動贊助類型中的哪一種贊助型態？","o":{"A":"排他贊助","B":"掛名贊助","C":"金牌贊助","D":"指定贊助"},"a":"B","e":"運動贊助可分為以下四種類型：掛名贊助商、指定贊助商、官方贊助商、官方供應商等。"},{"n":222,"cat":"銷售推廣策略","q":"NBA 紐約尼克隊，將每日賽事資訊上傳至官方網站，藉此吸引球迷注意，這是哪一種策略？","o":{"A":"吸脂定價策略","B":"網路行銷策略","C":"藍海策略","D":"伙伴策略"},"a":"B","e":"網路對於運動組織的功能，包括提供資訊、協助溝通、進行交易、刊登廣告訊息、建立資訊系統、提供娛樂內容等，皆可稱之為網路行銷。"},{"n":223,"cat":"銷售推廣策略","q":"中華職棒舉辦進場看球送客場球隊明星徽章之活動，這是希望獲得哪一種促銷功能？","o":{"A":"刺激商品銷售","B":"降低產品成本","C":"刺激消費需求","D":"提升知名度"},"a":"A","e":"促進銷售功能包含刺激商品銷售、提升知名度、培養顧客關係、服務贊助企業、降低生產成本、帶動現場氣氛、刺激消費需求等，題目中的促銷活動，主要是希望透過贈送禮品或紀念品來吸引消費者購買門票，刺激門票的銷售量，增加進場看球觀眾的人數。"},{"n":224,"cat":"銷售推廣策略","q":"林書豪在 NBA 竄紅後，引發「林來瘋」話題，各大企業廠商都希望重金邀請林書豪來為其企業產品拍攝廣告，企業廠商是想採取何種策略？","o":{"A":"網路行銷策略","B":"選擇權策略","C":"代言人","D":"品牌策略"},"a":"C","e":"對廣告主來說，很重要的一件事是如何吸引消費者，並讓消費者相信他們所接受到的訊息，而透過消費者耳熟能詳的公眾人士來傳達訊息就是一個很有效的方式，稱之為代言人。"},{"n":225,"cat":"銷售推廣策略","q":"下列針對運動贊助理論的描述，何者有誤？","o":{"A":"贊助世界盃足球賽的主要贊助商會獲得熱門球賽的門票，這是招待禮遇機會的取得。","B":"為了提升贊助效益，除了付出贊助權利金獲得基本贊助權益之外，必須規劃搭配賽事的行銷活動，稱之為贊助活化策略。","C":"衡量媒體曝光，是贊助效益評估的方法之一。","D":"在運動員球衣上秀出贊助企業的標誌，稱之為掛名贊助。"},"a":"D","e":"在運動員球衣上秀出贊助企業的標誌，有助於贊助企業與其產品的知名度提升，但掛名贊助指企業透過支付贊助權利金，將企業名稱直接冠於活動、比賽或球隊名稱之上，而享受最高等級的贊助權利。"},{"n":226,"cat":"銷售推廣策略","q":"現今熟悉旅遊已成為新式行銷工具之一，且為各機構所重視；以下對於「熟悉旅遊」的敘述，何者有誤？","o":{"A":"英文是 fair tour，縮寫為 far tour","B":"指熟悉行程的旅行團，專為旅行業者舉辦","C":"可體驗較新的旅遊路線或旅遊目的地","D":"舉辦策劃者的角色亦有可能由旅遊目的地或當地公部門所扮演"},"a":"A","e":"英文是 Familiarization tour，縮寫為 Fam tour。"},{"n":227,"cat":"銷售推廣策略","q":"Philip Kotler 視哪三者為顧客價值組成之要素？","o":{"A":"標準、銷售及價格","B":"效率、產能及及時性","C":"品質、服務及價格","D":"信念、成本及效用"},"a":"C","e":"Philip Kotler 將品質（quality）、服務（service），及價格（price）視為顧客價值組成之要素，簡稱 QSP。"},{"n":228,"cat":"銷售推廣策略","q":"「STP 分析」是用以確認目標市場之工具，其中 P 指的是？","o":{"A":"positioning","B":"price","C":"process","D":"providing"},"a":"A","e":"「STP 分析」（STP analysis）是用以確認目標市場之工具，亦為行銷策略之起始；其中 S 表的是 Segmentation，T 表的是targeting，P 表的是 positioning。"},{"n":229,"cat":"銷售推廣策略","q":"「缺口分析模式」最適用於何者之分析？","o":{"A":"顧客關係管理","B":"價格定位","C":"服務行銷","D":"企業方向"},"a":"C","e":"「缺口分析模式」又稱為 PZB Model，係由 A. Parasuraman、Valarie Zeithaml and Leonard Berry （1985）所提出的五大服務缺口；此即組織未來服務方面應改進之方向，和衡量顧客對服務品質之工具。"},{"n":230,"cat":"銷售推廣策略","q":"「藉由廣告讓消費者得知春季旅展的消息」可視為何種行銷方式？","o":{"A":"口碑行銷","B":"產業行銷","C":"廣告行銷","D":"關係行銷"},"a":"C","e":"Philip Kotler （2003）認為，財貨、勞務、經驗、事件、人物、地點、所有物、組織、資訊、理念等，皆可為行銷之商品範疇；而春季旅展的消息屬一資訊，故可利用廣告行銷之"},{"n":231,"cat":"銷售推廣策略","q":"下列何者為非？","o":{"A":"品質係顧客現在及未來之需求","B":"廣告一般被視為較公共報導更具可信度的方式","C":"公共關係屬大行銷策略（Mega Marketing）之一","D":"潛在顧客即指具付費能力，並想了解產品資訊者"},"a":"B","e":"公共報導具第三者之身分，因此公信力更勝廣告，故本選項敘述錯誤。"},{"n":232,"cat":"銷售推廣策略","q":"正因為觀光產品的「╴╴╴」特性，所以「口耳相傳（words of mouth， WOM）」就成為顧客認識商品一個相當重要的方法。","o":{"A":"不可分割性","B":"無形性","C":"易滅性","D":"異質性"},"a":"B","e":"不同於一般的商品，觀光的商品並無法予以具體化，因此口耳相傳便成為一個讓顧客認識商品的重要的方法。"},{"n":233,"cat":"銷售推廣策略","q":"以下就觀光產業特性的描述，何者正確？","o":{"A":"觀光產品強調口碑（WOM）","B":"資本密集且固定成本低","C":"仲介商的影響小","D":"觀光產業彼此相互倚賴，服務時間比一般服務業長"},"a":"A","e":"觀光產業的特性：觀光產品強調口碑，資本密集且固定成本高，仲介商的影響大，觀光產業彼此相互倚賴，服務時間比一般服務業短。"},{"n":234,"cat":"銷售推廣策略","q":"美國的東部與西部各有一座迪士尼樂園，在美東的主要是為吸引東岸旅客及歐洲旅客；而美西的則以吸引西岸及亞洲旅客為主。根據上述描述，應為何種市場區隔方式？","o":{"A":"依旅遊目的做市場區隔","B":"依旅客的地理區位做市場區隔","C":"依人口統計特徵做市場區隔","D":"依心理區隔做市場區隔"},"a":"B","e":"根據觀光理論中的距離衰退效應（distance-decay effect），觀光產品都會先界定自己主要的顧客來源，找出其居住地離目的地的合理最遠距離，再根據此距離去調查範圍內主要的客源居住地。"},{"n":235,"cat":"銷售推廣策略","q":"「某項觀光產品促銷方式可能在短期內搶攻到一部分市場，提高市場佔有率；然而消費者日後卻不見得會對品牌產生忠誠度」，根據此段敘述，我們可推知最有可能為何種方式？","o":{"A":"折價券","B":"特價商品","C":"抽獎","D":"銷售競賽"},"a":"B","e":"特價商品係藉由廣告的強打，讓顧客感受到比起其他類似商品便宜許多，進而購買，是故其也許於短期內可有效提高市佔率，但商品一旦下市，消費者可能又轉而尋求其它類觀光產品，而不會對原品牌忠誠。"},{"n":236,"cat":"銷售推廣策略","q":"在實務推廣上下列何者不屬於直效行銷（Direct Marketing）?","o":{"A":"飯店與信用卡合作，在寄給卡友的郵購型錄中提供住宿的優惠折扣","B":"臺南新化農會利用線上團購販售冰烤番薯","C":"業務人員直接到公司福利部門接洽獎勵旅遊行程","D":"NEWS98 藉由廣播節目銷售遊學團"},"a":"C","e":"直效行銷是針對個別消費者以非面對面方式進行雙向溝通以期能獲得消費者立即回應與訂購的銷售方式，主要有郵購和型錄行銷、電話行銷、電視和傳播行銷、網路行銷等。答案 C 是人員銷售，是透過人員溝通，以便說服他人購買的過程，是面對面的銷售方式。"},{"n":237,"cat":"銷售推廣策略","q":"對中間商的促銷方式中，下列何者屬於購買折讓的方式？","o":{"A":"旅行社向航空公司如一次購買 50 個機位，可享 9 折，如購買 100 個機位則可再享 8 折","B":"航空公司在旅行社週年慶時提供贈品","C":"旅行社的機位訂購達到一定數量即可從航空公司免費獲得若干周邊產品","D":"航空公司補貼旅行社的推廣費用"},"a":"A","e":"購買折讓是指中間商在一定期間內購買某些特定產品時給予的減價優待，主要是鼓勵中間商多購買原來可能不會購買的，或只想少量購買的產品。"},{"n":238,"cat":"銷售推廣策略","q":"哈根達斯（Haagen-Dazs）會針對不同節日推出新產品，例如在中秋節推出冰淇淋月餅，此種推廣手法稱為","o":{"A":"事件行銷","B":"置入性行銷","C":"理念行銷","D":"套裝行銷"},"a":"A","e":"事件行銷是企業借勢熱門話題或故事性的人物、事件與節日，吸引媒體和消費者的興趣與關注。"},{"n":239,"cat":"銷售推廣策略","q":"澳洲以每月新臺幣 58 萬元的高薪徵聘一位島主，每天利用網誌與照片宣傳大堡礁的美，此種宣傳是利用","o":{"A":"名人代言","B":"專家代言","C":"消費者見證","D":"感情訴求"},"a":"C","e":"此種宣傳是採現身說法，現身說法通常利用知名人物代言或使用者見證"},{"n":240,"cat":"銷售推廣策略","q":"旅行社經常利用「一生一定要去一次」 的廣告詞推銷旅遊行程， 這種廣告屬於：","o":{"A":"功能訴求","B":"理性訴求","C":"道德訴求","D":"感性訴求"},"a":"D","e":"感性訴求的廣告經常試圖打動消費者的心，誘發他們潛在的欲望與情緒。"},{"n":241,"cat":"銷售推廣策略","q":"「賞櫻專家、口碑最佳、吃好住好、預購倒數」，請問這是屬於哪種廣告？","o":{"A":"機構廣告（institutional advertising）","B":"告知式廣告（informative advertising）","C":"說服式廣告（persuasive advertising）","D":"開創式廣告（pioneering advertising）"},"a":"C","e":"說服式廣告主要在加強品牌偏好，刺激消費者欲望與購買，或勸說品牌轉換等，因此除了指出自己的優點外，也常會企圖說服消費者盡早購買。"},{"n":242,"cat":"銷售推廣策略","q":"下列哪種廣告訊息屬於理性訴求?","o":{"A":"「擺脫都市生活、領略旅遊新體驗」","B":"「一生必訪、世界之最」","C":"「直飛拉斐爾雅典學院，夜泊梵谷隆河星空」","D":"「夜宿五星級飯店，搭乘 25 人舒適小巴」"},"a":"D","e":"廣告的理性訴求重在傳達產品有哪些特點、功能或利益。（A）、（B）、（C）均偏向誘發消費者心中情緒與慾望，而只有（D）較訴求實際的行程優點。"},{"n":243,"cat":"銷售推廣策略","q":"飯店廣告利用ISO 9001 國際品質認證或政府認證的五星級標章當成品質保證，請問這是哪種訊息表現方法？","o":{"A":"科學證據","B":"產品示範","C":"產品個性化","D":"生活型態"},"a":"A","e":"科學證據的廣告訊息常利用產品獲獎證明或公正團體檢驗產品的結果。"},{"n":244,"cat":"銷售推廣策略","q":"摩斯漢堡率先導入生產履歷與契約農場制度，推出有機食材、綠色菜單與環保包裝，確保安心食用、健康與崇尚自然的理念，請問這類宣傳的訴求是提高哪項消費者反應層級？","o":{"A":"瞭解（knowledge）","B":"偏好（preference）","C":"好感（liking）","D":"信念（conviction）"},"a":"D","e":"消費者反應層級（consumers' response stage）指出消費者產生購買行動的一連串心理反應，包含知曉、瞭解、好感、偏好、信念與購買，而這六種反應也構成了企業推廣的各種階段與目標。消費者可能對摩斯有所偏好，但畢竟是速食店，因此摩斯利用生產履歷，確保食材來源與健康自然的概念，不僅去除消費者對速食店不安心與不健康的疑慮，也宣示綠色環保概念，進而堅定消費者的購買信念。"},{"n":245,"cat":"銷售推廣策略","q":"西門町的一家新旅店顛覆一般旅店營造的溫馨與明亮的感覺，卻大膽以紅黑色調創造夜店風，在宣傳上以潮牌旅店自居，請問這是哪種訊息表現方法？","o":{"A":"科學證據","B":"產品示範","C":"產品個性化","D":"生活型態"},"a":"C","e":"產品個性化的訊息傳遞是賦予產品某種個性，以吸引認同此種個性的消費者，因為這家旅店位於西門町，以新潮夜店風格將可能吸引較追求時尚的年輕族群。"},{"n":246,"cat":"銷售推廣策略","q":"雄獅旅遊與合作金庫聯手推出同業商務採購卡，稱為旺來卡，雄獅的經銷商可透過 B2B 平臺直接線上刷卡，且可享延長 45 天付款，6%低循環利率，請問此種中間商促銷的主要目標是:","o":{"A":"形象認知","B":"競爭差異","C":"利益展示","D":"說服購買"},"a":"D","e":"此促銷目標在於說服經銷商使用 B2B 平臺服務，進而大量或定期購買雄獅產品，也確立經銷商的忠誠度。"},{"n":247,"cat":"銷售推廣策略","q":"新開的餐廳在第一星期內每天在街上請路過的民眾試吃現做的料理，其推廣的主要目的是：","o":{"A":"說服","B":"知曉","C":"提醒","D":"偏好"},"a":"B","e":"以知曉為目標的推廣，經常會強力且密集的播放訊息，以及採取生動獨特的表現手法。"},{"n":248,"cat":"銷售推廣策略","q":"水水旅行社推出一個低價套裝行程，但想要說服消費者低價不一定代表低品質，使用哪種廣告可能效果較佳？","o":{"A":"比較性廣告","B":"告知式廣告（informative advertising）","C":"提醒式廣告（reminder advertising）","D":"機構廣告（institutional advertising）"},"a":"A","e":"比較性廣告是屬於說服式廣告（persuasive advertising）的一種，通常會強調產品的優點與特色，且間接或直接指出自己比相類似競爭產品優秀。"},{"n":249,"cat":"銷售推廣策略","q":"航空公司累積里程數兌換免費機票是屬於哪種促銷手段？","o":{"A":"特價品","B":"贈品","C":"折價券","D":"現金折扣"},"a":"B","e":"贈品是廠商為了吸引消費者購買特定產品而免費贈送的商品。"},{"n":250,"cat":"銷售推廣策略","q":"85 度 C 走低價策略，展店也多位於社區巷弄的三角窗，也因此 85 度 C 多採用何種廣告媒體？","o":{"A":"電視媒體","B":"印刷媒體","C":"戶外媒體","D":"網際網路"},"a":"B","e":"85 度 C 主要投資在廣播與雜誌廣告，因為廣播與雜誌媒體具有地域性與分眾化的特性，符合其走入社區的展店策略。"},{"n":251,"cat":"銷售推廣策略","q":"肯德基推出「多一元加一件」的促銷方案，且「天天不限時段」，您認為這促銷活動的主要目的是:","o":{"A":"瞭解（knowledge）","B":"偏好（preference）","C":"購買（purchase）","D":"信念（conviction）"},"a":"C","e":"低價優惠促銷常被用來引發消費者的購買行動。"},{"n":252,"cat":"銷售推廣策略","q":"「土耳其航空推出商務艙「空中主廚」服務，安排主廚進駐為乘客準備精緻餐點」，這活動的推廣目標在於:","o":{"A":"形象認知","B":"競爭差異","C":"利益展示","D":"說服購買"},"a":"B","e":"土耳其航空以商務客為目標，利用主廚現身機槍服務，改良機上一成不變的餐點，主要是創造差異化。"},{"n":253,"cat":"銷售推廣策略","q":"一家商務飯店，每一年會以「秘書之夜」的名義，款待簽約公司的秘書到飯店用餐，請問此種推廣活動是屬於：","o":{"A":"公關活動","B":"人員銷售","C":"直效行銷","D":"促銷活動"},"a":"A","e":"公關常藉由舉辦活動，邀請與公司業務有密切關係的關鍵對象參加，並與之建立關係。而公司秘書常是幫老闆或客人代訂房的關鍵人物。"},{"n":254,"cat":"銷售推廣策略","q":"某家航空公司為了鼓勵旅行社推廣他們的自由行行程，答應回饋銷售金額的 5%給旅行社當成推廣費用，請問這是哪種促銷方式?","o":{"A":"購買折讓","B":"陳列津貼","C":"推銷獎金","D":"經銷商列名廣告"},"a":"C","e":"推銷獎金是提升用來中間商的合作意願，或者感謝中間商執行某些推廣的功能。"},{"n":255,"cat":"銷售推廣策略","q":"某餐廳剛進駐臺灣時，主打自己是臺灣第一家以「鮑魚」為主題的創意餐廳，且標榜用便宜價格就可吃到高檔的鮑魚料理，此種廣告是屬於哪種廣告?","o":{"A":"比較性廣告","B":"告知式廣告（informative advertising）","C":"提醒式廣告（reminder advertising）","D":"機構廣告（institutional advertising）"},"a":"B","e":"告知式廣告通常訴求最新配方、全新、第一家或經過改良的產品，多用於產品導入期，以增進消費者對產品的知曉與瞭解程度。"},{"n":256,"cat":"銷售推廣策略","q":"下列哪種媒體廣告較不利於旅行社想要詳細說明新推出的旅遊套裝行程?","o":{"A":"電視廣告","B":"平面廣告","C":"廣播節目","D":"網際網路"},"a":"A","e":"旅遊套裝行程需要有足夠的資訊告知消費者，但電視廣告有時間限制且成本高，因此電視廣告或許適合旅行社打公司形象廣告，但較不適合推廣旅遊行程。"},{"n":257,"cat":"銷售推廣策略","q":"臺北晶華酒店幾次接待總統、名人或明星入住，如麥可傑克生、女神卡卡，且成功曝光、製造話題，此種宣傳方法是為了:","o":{"A":"形象認知","B":"競爭差異","C":"利益展示","D":"說服購買"},"a":"A","e":"利用名人入住總統套房，不僅增加飯店知名度，也確立飯店的高貴形象。"},{"n":258,"cat":"銷售推廣策略","q":"星巴克推出隨行卡的紅利積點，每儲值一千元可累積一點且換一杯咖啡，請問此種促銷活動的主要目的是：","o":{"A":"留住原有顧客","B":"開發新的顧客","C":"提高顧客忠誠度","D":"擴大市場佔有率"},"a":"C","e":"紅利積點的主要目的在於增加顧客的轉換成本，也強化顧客忠誠度。"},{"n":259,"cat":"銷售推廣策略","q":"王品集團捐 500 萬元認養南亞災童、發起一人一書到蘭嶼，或義賣舊餐具等公益活動，都屬於哪種推廣方式？","o":{"A":"公關活動","B":"人員銷售","C":"直效行銷","D":"促銷活動"},"a":"A","e":"為了建立良好的公司形象，企業常會出錢出力發起或贊助公益活動，以建立良好的公共關係。"},{"n":260,"cat":"銷售推廣策略","q":"為了開拓東南亞市場，觀光局邀請菲律賓旅行業者來臺旅遊，請問這是哪種推廣方式？","o":{"A":"獎勵旅遊","B":"熟悉旅遊","C":"旅遊產品展示","D":"交流旅遊"},"a":"B","e":"熟悉旅遊是旅遊供應商規劃旅遊考察團邀請旅遊業者認識與熟悉供應產品，以提高其銷售意願，也能將產品特色向消費者具體說明與推薦。"},{"n":261,"cat":"銷售推廣策略","q":"旅行社則在店門口貼上宣傳海報，飯店在客房擺放住宿指南、客房服務點菜單，在電梯裡介紹餐廳促銷活動，這種賣點展示（point of purchase display， POP display）的宣傳方式主要是為了克服服務產品的哪種特性？","o":{"A":"不可儲存性","B":"易變性","C":"無形性","D":"不可分割性"},"a":"C","e":"這些宣傳都是為了將無形的服務化為有形，讓顧客可以隨處查覺。"},{"n":262,"cat":"服務人員管理","q":"內部行銷（internal marketing）指的是以下哪兩種對象之間的行銷活動？","o":{"A":"顧客－企業","B":"顧客－員工","C":"企業－員工","D":"企業－企業"},"a":"C","e":"內部行銷定義為：「視員工為內部顧客，具培養具有顧客導向與服務意識員工之策略性目的，所採行以行銷觀點來管理人力資源的哲學。」故為企業與員工之間的互動。"},{"n":263,"cat":"服務人員管理","q":"下列何者不屬於觀光餐旅人員的有效溝通策略？","o":{"A":"仔細傾聽","B":"熟記客人姓名","C":"親切的微笑","D":"只強調自己的優越"},"a":"D","e":"只強調自己的優越表現並無法有效地對顧客傳遞價值，但仔細傾聽，熟記姓名，親切的微笑則有助於服務人員對顧客的溝通。"},{"n":264,"cat":"服務人員管理","q":"「觀光餐旅第一線工作人員的接待與應對」屬於何種類型的服務？","o":{"A":"硬體服務","B":"軟體服務","C":"軟體與硬體服務","D":"非軟體亦非硬體服務"},"a":"B","e":"「觀光餐旅第一線工作人員的接待與應對」係屬於服務類型的軟體服務，重視以人員提供的服務。"},{"n":265,"cat":"服務人員管理","q":"下列何者不是觀光餐旅從業人員應有的服務心態？","o":{"A":"情緒控制","B":"了解自我工作角色","C":"尊重客人","D":"只在乎自我表現"},"a":"D","e":"只在乎自我表現並非服務導向的思維，應以顧客為核心，適當表現情緒，了解自我角色。"},{"n":266,"cat":"服務人員管理","q":"觀光餐旅業的領導者並不需具備以下何種特性？","o":{"A":"重視組織服務文化","B":"所有決策親力親為","C":"誠實正直","D":"重視員工教育訓練"},"a":"B","e":"所有決策親力親為並非良好的領導者應有的特徵，應當適度授權給第一線員工展現具有彈性的服務。"},{"n":267,"cat":"服務人員管理","q":"能明確指出觀光餐旅企業中順利執行某工作的必要能力、技能或特點，其內容包含工作名稱、工作類別、主要負責之任務、與其他工作職務之間的相互關係等，稱之為：","o":{"A":"工作規範（job specification）","B":"工作內容說明（job description）","C":"工作分配（job distribution）","D":"工作分析（job analysis）"},"a":"B","e":"工作內容說明（Job Description）是公司在設立每一個職位（級）時必須先做定義，為什麼需要這個職位，設立目的是什麼、工作內容、具備專長、資格條件，以便做考核控管。工作規範是工作說明書的延伸，描述完成此工作者資格與條件，通常歸納成三類：知識、技術與能力。"},{"n":268,"cat":"服務人員管理","q":"所謂觀光餐旅業從業人員所應該具備的工作能力（job competencies），包含了：","o":{"A":"知識、技巧與態度","B":"態度、技巧及興趣","C":"知識、技巧及儀表","D":"技巧、經驗與興趣"},"a":"A","e":"哈佛大學 McClelland 教授曾對卓越的工作者做了一連串的研究，發現智力並不是決定工作績效好壞的唯一要素。他找出一些帶來卓越績效行為背後的因素，包括態度、知識、以及技巧…等等，稱之為「competency」"},{"n":269,"cat":"服務人員管理","q":"下列何者是說明餐廳在招募特定職位應具備的相對條件，如工作經驗、證照、教育程度？","o":{"A":"job assignment","B":"job description","C":"job specification","D":"job classification"},"a":"C","e":"工作規範是工作說明書的延伸，描述完成此工作者資格與條件，通常歸納成三類：知識、技術與能力。"},{"n":270,"cat":"服務人員管理","q":"以下何種不是觀光餐旅服務人員常見的福利？","o":{"A":"帶薪休假","B":"勞健保","C":"工作獎金","D":"進修補貼"},"a":"B","e":"勞健保為國家規範之基本要件，並非福利。"},{"n":271,"cat":"服務人員管理","q":"下列觀光旅遊從業人員特性中，何者最為重要？","o":{"A":"對客人的同理心","B":"專業能力技巧","C":"與上司的相處能力","D":"觀察環境趨勢的能力"},"a":"A","e":"若缺乏對於客人的同理心，其他特性均無法提升服務品質，故為同理心"},{"n":272,"cat":"服務人員管理","q":"以下何種不是觀光餐旅業界可以用來激勵員工的措施？","o":{"A":"強化行為控制","B":"業績分紅","C":"招待員工出國旅遊","D":"主管對部屬主動關懷"},"a":"A","e":"強化行為控制本身並沒有激勵效果。"},{"n":273,"cat":"服務人員管理","q":"下列何者為激勵理論中，「二元因素理論」（Two-Factor Theory） 的保健因素中之項目？","o":{"A":"職位升遷","B":"主管賞識","C":"薪資待遇","D":"工作發展"},"a":"C","e":"薪資待遇為員工工作所必須獲得之基本報酬，屬於保健因素。"},{"n":274,"cat":"服務人員管理","q":"飯店櫃檯人員因太忙而無法立即回答現場旅客的詢問，此種行為即無法符合服務品質五個構面中的哪一項？","o":{"A":"反應性（responsiveness）","B":"保證性（assurance）","C":"可靠性（reliability）","D":"同理心（empathy）"},"a":"A","e":"反應性 Responsiveness : 意指服務員工樂意幫忙，願意幫助顧客並提供迅速的服務的行為。"},{"n":275,"cat":"服務人員管理","q":"觀光餐旅服務行銷中所謂「互動行銷」（interactive marketing）指的是","o":{"A":"企業高層對員工的觀念溝通","B":"企業與顧客間的行銷溝通","C":"員工和顧客之間的服務過程","D":"企業股東與經理人的溝通"},"a":"C","e":"「互動行銷」（Interactive Marketing）：意指第一線人員與顧客間建立良好的互動關係，所有的臨場反應都能站在顧客的立場來思考，以親切友善的態度，盡可能為顧客解決問題、提供高品質的服務。"},{"n":276,"cat":"服務人員管理","q":"下列何者不屬於『服務金三角』？","o":{"A":"公司企業","B":"仲介商","C":"員工","D":"顧客"},"a":"B","e":"仲介商為行銷管道，不在服務之列。"},{"n":277,"cat":"服務人員管理","q":"今日服務行銷不再是狹隘的顧客服務，包含的範疇，以下何者為誤？","o":{"A":"外部行銷","B":"內部行銷","C":"互動行銷","D":"主動行銷"},"a":"D","e":"主動行銷不在服務行銷之列。"},{"n":278,"cat":"服務人員管理","q":"服務人員能有足夠的權力在第一時間就能立即做出滿足顧客要求的行為，稱此足夠的權限為？","o":{"A":"賦權","B":"事權","C":"越權","D":"跨權"},"a":"A","e":"Empowerment"},{"n":279,"cat":"服務人員管理","q":"公司與員工之間的溝通與管理屬於？","o":{"A":"外部行銷","B":"內部行銷","C":"互動行銷","D":"主動行銷"},"a":"B","e":"屬於公司內部之管理工作"},{"n":280,"cat":"服務人員管理","q":"公司與顧客之間的溝通與行銷活動屬於？","o":{"A":"外部行銷","B":"內部行銷","C":"互動行銷","D":"主動行銷"},"a":"A","e":"顧客對公司而言是對外的。"},{"n":281,"cat":"服務人員管理","q":"員工與顧客之間的溝通與管理屬於？","o":{"A":"外部行銷","B":"內部行銷","C":"互動行銷","D":"主動行銷"},"a":"C","e":"員工與顧客之間屬於互動關係"},{"n":282,"cat":"服務人員管理","q":"服務公司的人員被稱為『跨越疆界者（Boundary spanner）』，對外代表組織，對內代表外在環境，通常係指？","o":{"A":"企業老闆","B":"仲介商","C":"第一線員工","D":"高階主管"},"a":"C","e":"第一線員工"},{"n":283,"cat":"服務人員管理","q":"『跨越疆界者』擔任哪兩方面的聯繫？","o":{"A":"公司與員工","B":"員工與顧客","C":"員工與產業環境","D":"顧客與公司"},"a":"D","e":"顧客與公司"},{"n":284,"cat":"服務人員管理","q":" 服務利潤鏈（service-profit chain）的起始點是？","o":{"A":"員工滿意度","B":"顧客滿意度","C":"員工忠誠度","D":"內部服務品質"},"a":"D","e":"內部服務品質"},{"n":285,"cat":"服務人員管理","q":" 服務利潤鏈（service-profit chain）的終結點是？","o":{"A":"顧客忠誠度","B":"顧客滿意度","C":"員工忠誠度","D":"績效"},"a":"D","e":"績效"},{"n":286,"cat":"服務人員管理","q":" 目前最常被使用來測量服務品質的量表是『服務品質模式 Service Quality Questionnaire』量表，其英文縮寫是？","o":{"A":"SERVQUAL","B":"SVSQLTY","C":"SVISQUAL","D":"SERVIQUAL"},"a":"A","e":"SERVQUAL"},{"n":287,"cat":"服務人員管理","q":"服務業的員工要以合宜的情感表達來為公司謀利，屬於？","o":{"A":"情緒勞務","B":"智能勞務","C":"體能勞務","D":"社交勞務"},"a":"A","e":"情緒勞務"},{"n":288,"cat":"服務人員管理","q":"人員甄選與招募的一般管道，下列何者為非？","o":{"A":"基層員工以人力網站為管道","B":"基層員工以報紙為管道","C":"高階員工以推薦為管道","D":"高階員工以公司網站為管道"},"a":"D","e":"高階員工以公司網站為管道為誤，應以推薦與向其他企業徵才為主。"},{"n":289,"cat":"服務人員管理","q":"許多旅館都將顧客住宿資料保留，其主要原因為何？","o":{"A":"資料將來也許有用","B":"吸引舊顧客比較便宜","C":"員工可以在下一次使用","D":"資料庫存容易且便宜"},"a":"B","e":"吸引舊顧客比較便宜。"},{"n":290,"cat":"服務人員管理","q":"小陳在某家航空公司上班，由於覺得自己在工作上很不如意，經常遭受主管的刁難，因此他常常會在航班中故意對乘客冷漠以對。小陳對顧客冷漠以對的行為是？","o":{"A":"服務傳遞","B":"服務保證","C":"服務破壞","D":"服務接觸"},"a":"C","e":"服務破壞定義為「組織內部員工蓄意以負面的行為來影響組織、內部員工及外部顧客的服務。」"},{"n":291,"cat":"服務人員管理","q":"以下何種不是觀光產業中成功的人力資源管理會見到的現象？","o":{"A":"以較高的薪水吸引應徵者","B":"給予適當的教育訓練","C":"給予員工適當的授權","D":"以「不犯錯」來定義高績效表現"},"a":"D","e":"以「不犯錯」來定義高績效表現乃是屬於平凡的人力資源管理方式，並非成功的人力資源管理作為。"},{"n":292,"cat":"服務人員管理","q":"小楊在飯店擔任櫃檯人員，可是常常被主管指正面對客人時有「皮笑肉不笑」的問題，給住房客人不真誠的感覺，這是因為小楊在服務中展現的是…","o":{"A":"深層演出","B":"表層演出","C":"真誠演出","D":"真實情緒"},"a":"B","e":"「表層演出」（surface acting），指服務工作者藉由改變外在的情緒表達，但未改變內在真實感覺的方式來達成組織所要求的情緒表現。"},{"n":293,"cat":"服務人員管理","q":"某飯店正在舉辦徵才活動，記者採訪該飯店的主管時，主管強調其徵才標準除了解面試者的經驗與個人特質外，更需要面試者有良好的儀態與舉止優雅，外貌也不能輕忽。該主管的說法，反映了觀光餐旅業界中何種常見的特性","o":{"A":"美學勞務","B":"情緒勞務","C":"角色衝突","D":"角色模糊"},"a":"A","e":"組織對第一線員工在外表與聲音上的規範，或提供美學訓練使員工具有美學能力與技能即為為美學勞務之概念。使第一線員工在服務顧客時其外表與聲音必須表現出有利於企業形象的美學體現。"},{"n":294,"cat":"服務人員管理","q":"小沈所在的旅行社，老闆常常透過內部電子郵件向小沈與其他員工宣揚旅行社應該要以客為尊，重視顧客的滿意度，好彰顯自己服務的精神。這位老闆在做的事情其實就是","o":{"A":"內部行銷","B":"外部行銷","C":"互動行銷","D":"直接行銷"},"a":"A","e":"內部行銷定義為：「視員工為內部顧客，具培養具有顧客導向與服務意識員工之策略性目的，所採行以行銷觀點來管理人力資源的哲學。」故為企業與員工之間的互動。"},{"n":295,"cat":"服務人員管理","q":"薛總裁是某家國際飯店集團的總裁，在接受記者訪問如何成功地管理一家跨國企業時，您認為以下何種答案「最不可能」出現？","o":{"A":"能教導員工，激勵員工","B":"嚴苛管教員工","C":"善於溝通協調","D":"以身作則"},"a":"B","e":"嚴苛管教員工係屬於失敗的人力資源循環中才會出現的特徵，將致使員工工作滿意度降低，並損及整體企業服務績效。"},{"n":296,"cat":"服務人員管理","q":"小王任職於某一家旅行社的人事主管，要負責挑選新進員工，下列何者不是小王考慮員工時應該重視的條件？","o":{"A":"是否具有專業證照","B":"外語能力","C":"是否肯吃苦耐勞","D":"是否已婚"},"a":"D","e":"是否已婚並非審核新進員工的基本要件，且以婚姻狀態篩選員工有違就業服務法第五條之規定。"},{"n":297,"cat":"服務人員管理","q":"小玲在某家航空公司上班，主管要求他們，不管自己的心情如何，每天都還是得要笑臉迎人。我們稱小玲所面對的工作特性是？","o":{"A":"角色衝突","B":"情緒勞務","C":"制式化服務","D":"工作自主"},"a":"B","e":"要求要以適當的情緒面對顧客，這是情緒勞務的展現。"},{"n":298,"cat":"服務人員管理","q":"小陳是一家民宿的老闆，他在牆上貼著以下的標語：「規則一：顧客永遠是對的；規則二：如果你覺得顧客錯了，一定是你沒讀懂規則一」這表示小陳具有下列何種心態？","o":{"A":"小陳擔心員工會犯錯","B":"小陳不相信有顧客是錯的","C":"小陳不相信員工會努力工作","D":"小陳覺得員工會偷懶"},"a":"B","e":"小陳的心態代表其相信顧客任何行為都是對的，因此顧客不可能會犯錯。"},{"n":299,"cat":"服務人員管理","q":"張小姐剛進入一家國際旅館工作，該旅館為使新進人員瞭解環境、企業政策與員工福利，須對張小姐先進行下列何項訓練？","o":{"A":"orientation","B":"briefing","C":"emergency training","D":"management training"},"a":"A","e":"Orientation 為新進員工訓練，為實際就職前對於新進員工所提供的政策說明，教育訓練等工作。"},{"n":300,"cat":"服務人員管理","q":"李小姐在航空公司擔任空服人員，最近她經常感覺到工作提不起勁，面帶微笑服務客人變得很痛苦，下了班常常覺得整個人精疲力竭。請問李小姐很可能產生了什麼問題？","o":{"A":"情緒勞務","B":"工作無聊感","C":"情緒耗竭","D":"角色衝突"},"a":"C","e":"學者 Freudenberger （1974）便將情緒耗竭定義為「工作本身對個人的能力、精力及資源的過度要求，致使工作者感到能力耗盡，精疲力竭，而在工作上束手無策以及情緒耗弱的一種狀態。」"},{"n":301,"cat":"服務人員管理","q":"嚴長壽先生認為觀光餐旅業激勵員工有三個面向：待遇、學習與看到新的未來，而其目標並不包括？","o":{"A":"增加員工對企業的向心力","B":"發揮員工最大潛能","C":"增強員工的工作動力","D":"增加對消費者的了解"},"a":"D","e":"激勵員工的目的並不包括增加對消費者的了解，而是為了讓員工提升向心力，發揮潛能，並增強工作動力。"},{"n":302,"cat":"服務人員管理","q":"某旅行社在農曆新年過後接到顧客來信，讚揚該旅行社領隊的服務表現，為了有效的激勵員工，該旅行社應該採取哪一種措施較佳？","o":{"A":"當日透過內部電子郵件或當眾表揚該領隊","B":"讚賞該領隊，並斥責其他所有員工","C":"年底舉辦員工表揚大會時提出","D":"告誡該領隊不得有個人英雄主義"},"a":"A","e":"根據學習理論觀點，鼓勵員工達到激勵效果應該即刻執行，以避免時間經過後降低學習效果。"},{"n":303,"cat":"服務人員管理","q":"麗池卡爾登旅館有名的座右銘：由淑女紳士來服務淑女紳士，其中的主要意涵是？","o":{"A":"公司的陳設與產品都很高級","B":"往來顧客都是上流社會人士","C":"員工都是很尊重地對待員工與客人","D":"公司的服務不可能出錯"},"a":"C","e":"員工都是很尊重地對待員工與客人"},{"n":304,"cat":"服務人員管理","q":"帶動全球旅遊業趨勢的盧森布魯國際旅遊公司執行總裁Hal Rosenbluth 在其所著《顧客第二（The Customer Comes Second）》一書中指出，其企業經營成功的秘訣在於深信_____第一，而非顧客至上。","o":{"A":"公司老闆","B":"股東","C":"員工","D":"供應商"},"a":"C","e":"員工"},{"n":305,"cat":"服務人員管理","q":"美國漢普敦（Hampton Inn）提供「100%滿意保證，不滿意就免費！」這是表示保證______。","o":{"A":"服務品質","B":"設備一流","C":"客群屬於高級人士","D":"不滿意的客人都會受到安撫"},"a":"A","e":"服務品質"},{"n":306,"cat":"服務人員管理","q":"服務業想要到『以客為尊』，其先決條件是要有好的","o":{"A":"員工","B":"基層主管","C":"高階主管","D":"老闆"},"a":"A","e":"員工，希望員工如何待客，也要如何待員工"},{"n":307,"cat":"服務人員管理","q":"麥當勞的組織氣候和組織文化的差異是","o":{"A":"組織氣候為歡樂愉快的氣氛，組織文化則各地不同","B":"組織氣候各地不同，組織文化則為歡樂愉快的氣氛","C":"組織文化與組織氣候皆各地不同","D":"組織文化與組織氣候皆為各地相同"},"a":"B","e":"組織氣候各地不同，組織文化則為歡樂愉快的氣氛。組織文化是跟隨總部，內化於員工心中，各店則又當地對歡樂愉快有不同方式的表現"},{"n":308,"cat":"服務人員管理","q":"顧客到墾丁旅館住宿渡假，其體驗到的服務經驗，核心為","o":{"A":"熱帶度假的氣氛","B":"環境提供的休閒活動","C":"與服務人員的互動","D":"客房品質"},"a":"C","e":"顧客與服務人員的互動。這是服務經驗的核心。"},{"n":309,"cat":"服務人員管理","q":"餐廳裡顧客抱怨茶水費並沒有標明清楚就收費，這種類型的顧客抱怨是屬於哪一種衝突","o":{"A":"員工與顧客的衝突","B":"顧客角色衝突","C":"顧客與組織的衝突","D":"顧客之間的衝突"},"a":"C","e":"顧客與組織的衝突，餐廳（組織）的收費項目沒有達到告知的效果，引起顧客誤解為免費。"},{"n":310,"cat":"服務人員管理","q":" Starbucks 成為全球領導品牌的關鍵之一，在其品牌策略中首先重視的是哪一項核心要素？","o":{"A":"讓顧客喜歡這裡","B":"讓員工喜歡這裡","C":"完美的咖啡拉花","D":"比競爭者好"},"a":"B","e":"讓員工喜歡這裡"},{"n":311,"cat":"實體環境呈現","q":"服務場景模式認為實體環境會促進社會互動，此模型所指的社會互動不包括下列何者?","o":{"A":"員工之間","B":"員工與老闆","C":"顧客之間","D":"員工與顧客"},"a":"B","e":"此模型談的是實體環境如何影響顧客及員工的心理及行為，並未討論組織管理層面。"},{"n":312,"cat":"實體環境呈現","q":"當消費者看到飯店華麗的外觀，便產生了一套「裡面的服務一定很高級」 的想法，此想法即為_______。","o":{"A":"信念","B":"態度","C":"價值","D":"知覺"},"a":"A","e":"消費者這種自己推斷並認為錯不了的想法，即為信念。"},{"n":313,"cat":"實體環境呈現","q":"實體環境構面之三要素為何?","o":{"A":"空間、標誌、裝飾","B":"空間、標誌、周遭環境","C":"周遭環境、顏色、空間","D":"空間、音樂、周遭環境"},"a":"B","e":"周遭環境、空間／功能、標誌為實體環境構面之三要素。"},{"n":314,"cat":"實體環境呈現","q":"賭場為了引發顧客的興奮情緒，而在現場播放節奏明快的音樂，並採用以紅色及金色為主的裝潢，以達到多賭一點的目標，此種作法是為了產生何種效應?","o":{"A":"月暈效果","B":"恩格爾效果","C":"格魯恩轉移效果","D":"刻板印象效應"},"a":"C","e":"格魯恩轉移效果能讓消費者忘記原先的購買目標而產生衝動性的購買。"},{"n":315,"cat":"實體環境呈現","q":"韓國將韓劇的拍攝場景發展為觀光景點，並放置演員的肖像以吸引觀光客，是為了引發何種消費者的內部反應?","o":{"A":"認知","B":"心理","C":"生理","D":"情緒"},"a":"A","e":"符號意義之運用屬於認知反應。"},{"n":316,"cat":"實體環境呈現","q":"迴轉壽司採用小火車運送食物到消費者面前，以創造趣味並增進服務效率，是何種要素的策略性應用?","o":{"A":"通路","B":"實體環境","C":"產品","D":"品牌"},"a":"B","e":"運用實體環境要素能帶來方便服務傳遞之效益，迴轉壽司的小火車設計即是實體環境。"},{"n":317,"cat":"實體環境呈現","q":"下列何者非為 Bitner 服務場景模型的範例?","o":{"A":"香蕉新樂園餐廳採用臺灣古早味的佈置，讓消費者產生懷舊情懷，並覺得新奇","B":"SPA 常用香精及檀香使顧客感到輕鬆愉悅","C":"遊樂園的廣告中一直重複出現「High 到不行」訊息以引發消費者的挑戰慾","D":"麥當勞會在不同的國家採用不同形象的麥當勞叔叔，讓消費者產生親切感"},"a":"C","e":"廣告並非實體環境，且廣告所採用的重複說服為古典制約理論之應用。"},{"n":318,"cat":"實體環境呈現","q":"\"刺激－有機體－反應（SOR）\"模型中的調節變數（moderators）為何?","o":{"A":"美麗的文字與攝影","B":"哀傷或愉悅的心情","C":"員工與顧客的特性","D":"顧客再度光臨的承諾"},"a":"C","e":"員工與顧客的特性為 SOR 模型中的調節變數，會左右實體環境對內在反應的影響。"},{"n":319,"cat":"實體環境呈現","q":"下列何種顏色組合較易激發顧客的強烈情感及活力?","o":{"A":"黑、藍、黃","B":"橘、綠、白","C":"藍、綠、紫","D":"紅、黃、橘"},"a":"D","e":"色彩歸屬於實體環境構面因素中的周遭情境，紅黃橘是觀光餐旅業最常用來激發消費者熱情及強烈情感的暖色系顏色，如麥當勞。"},{"n":320,"cat":"實體環境呈現","q":"若餐廳計畫推出加勒比風味的夏季特餐，下列何項作業是餐廳應先進行的?","o":{"A":"在每張餐桌上放置具熱帶風情的卡片，以宣傳新菜單","B":"發送新聞稿至商業出版品","C":"要求所有員工穿著紅色毛衣","D":"僱用爵士音樂家以娛樂顧客"},"a":"A","e":"全服務的餐廳一般都會推出季節菜單，加勒比是熱帶島嶼，放上帶有熱帶風味符號的卡片讓顧客知道有新菜單是首要之務;雷鬼音樂方是合適的音樂。"},{"n":321,"cat":"實體環境呈現","q":"下列何者非為服務場景設計規劃的正確敘述?","o":{"A":"遠距服務設施的設計應以內部員工的需要和愛好為主","B":"服務場景設計包括外部場景設施及內部空間佈局與功能，內部設計的重要性大於外部場景","C":"與顧客接觸、互動較少的服務，其服務場景的設計應較為簡單、直接","D":"員工穿著合宜的服裝亦為服務場景設計的一部分"},"a":"B","e":"服務場景之內外部設計對消費者而言，是一個整體的概念，會同時影響服務品質之評估。"},{"n":322,"cat":"實體環境呈現","q":"下列何種裝飾將有助於旅行社推廣墨西哥沙灘之旅?","o":{"A":"草帽、Cancun 坎昆、太陽眼鏡、浴巾","B":"太陽眼鏡、浴巾、雅典娜女神像、沙鈴","C":"帆船、艾菲爾鐵塔、防晒乳、草帽","D":"防晒乳、巴哈馬觀光手冊、太陽眼鏡、沙鈴"},"a":"A","e":"草帽、Cancun 坎昆是象徵墨西哥的物品，太陽眼鏡、浴巾則為去海邊之必備物品，以此四樣物件為裝飾便能讓消費者與墨西哥海灘產生連結。"},{"n":323,"cat":"實體環境呈現","q":"下列何者不是對氣氛（atmosphere）的正確描述?","o":{"A":"氣氛可作為傳遞訊息給潛在顧客的媒介","B":"氣氛透過消費者的感官享受去創造體驗","C":"氣氛為非實體環境要素而是一種體驗的呈現","D":"氣氛可作為創造心情的媒介"},"a":"C","e":"氣氛為實體環境構面的要素之一，為創造體要的重要因素。"},{"n":324,"cat":"實體環境呈現","q":"下述何者非為促進顧客之間良好互動的措施?","o":{"A":"經濟艙機票售完時，航空公司地勤人員將候補的建築工人乘客安排在頭等艙，以獲取最大利潤","B":"旅館業者在相同地方建構三棟不同建築物，以將一般散客、團客及VIP 客人分開","C":"旅館於傍晚某個時段免費提供客人酒和乳酪以提供交流","D":"汽車旅館在交誼廳放置舒適的家具及咖啡桌"},"a":"A","e":"支付高價的頭等艙客人並不樂於與建築工人毗鄰而坐，因而會造成顧客之負向的互動。"},{"n":325,"cat":"實體環境呈現","q":"文化觀光之消費群具有被特定文化元素吸引之特質，因此下述何種旅客特徵能得到較高文化觀光體驗?","o":{"A":"收入高、教育程度高、年齡層較低","B":"教育程度高、年齡層低、男性","C":"收入高、教育程度高、年齡層較高","D":"教育程度高、年齡層低、女性"},"a":"C","e":"文化觀光需要進行大量的資訊蒐集，具有豐富的人生閱歷且講求精緻消費，因此消費者的收入、教育程度及年齡層均偏高。"},{"n":326,"cat":"實體環境呈現","q":"關於體驗行銷的描述，何者為非?","o":{"A":"在體驗媒介中，相較於服務功能，實體環境與服務人員較與大腦的潛意識層面運作相關","B":"購買決策模型中少了傳統理性消費者決策模式中的資訊蒐集，多了消費願景","C":"消費者極少回顧或評估整個購買過程，強調經歷勝過一切","D":"「想要吃大餐」為體驗動機，「食物美味」為預期體驗，前者會影響後者"},"a":"B","e":"體驗行銷中的消費者仍會進行資訊蒐集，但較為有彈性且採探索式的。"},{"n":327,"cat":"實體環境呈現","q":"新加坡樟宜機場內設有供旅客使用的游泳池、電影院、睡房與溜滑梯等設施，這些設施的目的是為了？","o":{"A":"幫助顧客正確地使用服務","B":"提高整體價值感","C":"幫助員工提高生產力與服務品質","D":"加速服務流程"},"a":"B","e":"在機場內提供額外的設施，可以提升旅客在機場內之整體價值感受。"},{"n":328,"cat":"實體環境呈現","q":"桃園機場新引進的「入出國自動查驗通關系統」，其主要目的是為了？","o":{"A":"幫助顧客正確地使用服務","B":"提高整體價值感","C":"提升桃園機場形象","D":"加速服務流程"},"a":"D","e":"自動查驗通關系統是採用電腦自動化的方式 ，結合生物辨識科技，讓旅客可以自助、快速、便捷的出入國，可以疏解查驗櫃檯等候時間，加快通關速度。"},{"n":329,"cat":"實體環境呈現","q":"小康第一次來到美國的舊金山機場，發現機場證照查驗的地方有多架大型液晶電視，反覆播放通關時應該注意的事項，這些影片的主要目的是為了？","o":{"A":"幫助顧客正確地使用服務","B":"提高整體價值感","C":"提升舊金山機場形象","D":"幫助員工提高生產力"},"a":"A","e":"通關注意事項透過電視螢幕公告可以幫助顧客預期之後的服務流程所需進行的活動，故主要是在幫助顧客正確使用服務。"},{"n":330,"cat":"實體環境呈現","q":"雄獅旅遊斥資百萬裝潢設計費，邀請來建築師規劃，將「旅行」與「設計」兩個專業結合所創造的都市空間，呈現在臺北市中心的旗艦店，其目的是為了？","o":{"A":"幫助顧客正確地使用服務","B":"加速服務流程","C":"提升雄獅旅遊的品牌形象","D":"幫助員工提高生產力"},"a":"C","e":"雄獅旅行社之主要目的在於營造新的雄獅旅遊品牌形象。"},{"n":331,"cat":"實體環境呈現","q":"下列有關觀光景點擁擠感受的描述，何者錯誤？","o":{"A":"擁擠會使得遊客感到不滿意","B":"擁擠是正常的，不必管它","C":"擁擠會使得遊客減少停留時間","D":"擁擠是因為沒有做好環境的流量管制"},"a":"B","e":"擁擠為不正常現象，會使得遊客滿意度下降，減少停留時間，往往肇因於流量管制不當。"},{"n":332,"cat":"實體環境呈現","q":"分析顧客與觀光環境的互動時所使用的 S-O-R 模式，以下何者並非其要素？","o":{"A":"stimuli","B":"organism","C":"responses","D":"organization"},"a":"D","e":"S 代表外界刺激（stimuli），O 代表內在反應（organism），R 代表外在行為反應（responses）。"},{"n":333,"cat":"實體環境呈現","q":"服務場景（services cape）模式中，顧客可能產生的內在反應不包括？","o":{"A":"情緒反應","B":"趨近或迴避反應","C":"認知反應","D":"身心反應"},"a":"B","e":"趨近或迴避反應為行為反應（behavioral responses）"},{"n":334,"cat":"實體環境呈現","q":"王先生是一家專營高價位歐洲旅行團的旅行社老闆，他決定聘請專業的美工設計與網頁設計師，幫自己的旅行社打造一個高度視覺美感的網站，其目的主要是為了？","o":{"A":"幫助顧客正確地使用服務","B":"加速服務流程","C":"提升旅行社的品牌形象","D":"幫助員工提高生產力"},"a":"C","e":"注意網站美學品質乃是為了要創造適當的形象。"},{"n":335,"cat":"實體環境呈現","q":"旅行社在網站的行程說明上展現景點的照片、住宿飯店的裝潢、甚至是之前旅客的照片，這些實體證據無助於達成以下哪個目標？","o":{"A":"降低消費者的知覺風險","B":"加速服務流程","C":"刺激消費者的想像","D":"明確化產品內容"},"a":"B","e":"旅行社在網站的行程說明上展現景點的照片、住宿飯店的裝潢、甚至是之前旅客的照片並無法加速服務流程之進展。"},{"n":336,"cat":"實體環境呈現","q":"機場往往設置有許多自助式報到機器，可以提供顧客自行選擇座位、辦理行李託運以及列印登機證等等服務。以下何者不是此種服務設施的好處？","o":{"A":"提供客製化機會","B":"降低服務人力需求","C":"提升服務品質的穩定性","D":"增加人員與顧客互動的機會"},"a":"D","e":"自助式報到機器減少了服務人員與顧客互動的機會，而非增加。"},{"n":337,"cat":"實體環境呈現","q":"日本東京迪士尼樂園中，幾乎所有設備與設施都會出現米老鼠的圖樣或符號，這樣的作法是為了？","o":{"A":"傳遞一致性的迪士尼品牌形象","B":"加速服務流程","C":"幫助顧客正確地使用服務","D":"幫助員工提高生產力"},"a":"A","e":"透過廣泛地使用米老鼠的圖案與形象，可以促使迪士尼傳遞更一致的品牌形象。"},{"n":338,"cat":"服務流程","q":"以觀光產品而言，銷售人員常使用於發掘客戶的方式中，何者不適當？","o":{"A":"與互補性的觀光產業交換客戶名單","B":"參與各種公眾活動","C":"向既有客戶徵詢推薦名單","D":"與競爭者時有互動"},"a":"D","e":"應是要接觸所有潛在客戶可能參與的協會和組織，例如扶輪社、獅子會等，以擴大銷售的利基。"},{"n":339,"cat":"服務流程","q":"下列項目皆為銷售人員的工作重點，請依序排出最適合的順序。甲、商品展示與解說；乙、充實銷售前的準備工作；丙、因應客戶的要求和協調異議；丁、主動發掘客戶；戊、完成交易及後續追蹤。","o":{"A":"丁乙甲丙戊","B":"乙丁丙甲戊","C":"丙丁乙甲戊","D":"乙甲丁戊丙"},"a":"A","e":"銷售人員的工作重點：主動發掘客戶→充實銷售前的準備工作→商品展示與解說→因應客戶的要求和協調異議→完成交易及後續追蹤。"},{"n":340,"cat":"服務流程","q":"服務品質的好壞有兩項重要的觀察指標，分別為何？","o":{"A":"服務的一致性與服務的效率","B":"服務的水準與品質的一致性","C":"服務的一致性與人員的態度","D":"品質的水準與服務的即時性"},"a":"B","e":"兩項品質優劣的重要觀察指標：一為服務的水準（levels of service），另一為品質的一致性（consistency）。"},{"n":341,"cat":"服務流程","q":"何者不是對關係行銷的正確認識？","o":{"A":"形成因素可能因利益或是因人情和社交","B":"優質評價對於關係行銷有正面助益","C":"短期的經營即可獲得成效","D":"定期寄出商品資訊或報章雜誌是關係行銷的作法"},"a
