":"C","e":"關係行銷有賴於長期的經營，非短時間內即可達成；且銷售人員需十分細膩，投顧客所好。"},{"n":342,"cat":"服務流程","q":"何謂「破水桶理論」？","o":{"A":"指服務業中，沒有做好服務的服務人員","B":"指服務業服務品質未保有一致性","C":"指公司應將有限資源集中給值得培養關係的老客戶","D":"指不適任的服務人員應適時被淘汰"},"a":"C","e":"此理論為萊斯特偉門（Lester Wunderman）在其著作《直打正著（Being Direct: Making Advertising Pay）》中所提出的理論，指出觀光產業應定期整理客戶的資料庫，對於不活躍的客戶（如久無消費者）應停止寄送商品訊息，節省成本。"},{"n":343,"cat":"服務流程","q":"下列何種員工態度有助於增加顧客忠誠度？","o":{"A":"對顧客的抱怨感到無所謂的","B":"正向積極的","C":"隨和的","D":"不具威脅性的"},"a":"B","e":"在乎服務品質的公司知道滿足員工即能滿足顧客這一概念，因此擁有具正向積極態度的員工對滿足其顧客忠誠度必有推波助瀾之效。"},{"n":344,"cat":"服務流程","q":"「要求學員針對真實工作中可能遭遇之問題處理回應，而非單純聽從授課者的講解」稱為：","o":{"A":"角色扮演","B":"籃內訓練","C":"始業訓練","D":"職前訓練"},"a":"A","e":"角色扮演（role playing）：要求學員針對真實工作中遭遇之問題回應，而非聽他人講解、討論如何處理問題；例如客訴處理即為此種活動之訓練。"},{"n":345,"cat":"服務流程","q":"正確的訓練程序四步驟依序為：","o":{"A":"決策，設計，執行，評估","B":"評估，設計，決策，執行","C":"設計，評估，管理，執行","D":"管理，評估，設計，執行"},"a":"A","e":"根據 Samuel Certo and S. Trevis Certo （2006）所著之《現代管理學（Modern Management）》一書所提及，訓練程序四步驟應為決策（determining），設計（designing），執行（administering）和評估（evaluating）。"},{"n":346,"cat":"服務流程","q":"下列選項中何者非為餐廳營運的關鍵成功因素？","o":{"A":"正確的理念","B":"執行力","C":"滿足員工的期待","D":"服務"},"a":"C","e":"應改成滿足消費者的期待（Meet customer's expectation）。"},{"n":347,"cat":"服務流程","q":"以下對於現今顧客行為的認知，何者有誤？","o":{"A":"顧客要求完美，對於服務水準更加注重細節部分","B":"期待更多元的選擇與服務","C":"重視價格勝於價值","D":"對於所處的環境願意表達其意見"},"a":"C","e":"應改為重視價值勝於價格；消費者期望被感動以及個別化的服務、更難忘的消費體驗。"},{"n":348,"cat":"服務流程","q":"臺北鼎泰豐，曾登上《The New York Times》「世界十大餐廳」排名榜，並在全球擁有多家分店；對日本人而言，它更是臺灣美食的代表。以下對鼎泰豐的相關敘述，何者有誤？","o":{"A":"餐廳會依國籍決定出菜順序","B":"在臺灣採半加盟方式經營；國外則採直營連鎖","C":"係臺灣美食國際化的成功例子","D":"以販售小籠包揚名"},"a":"B","e":"在臺灣採直營連鎖方式經營；國外則採半加盟。"},{"n":349,"cat":"服務流程","q":"失敗的服務常導致許多負面的結果，除了客人私底下的抱怨外，嚴重者可能還會尋求法律途徑，對業者名譽影響極大。以下對於解決服務失敗的辦法中，何者較不適當？","o":{"A":"了解顧客的需求","B":"給予顧客補償措施","C":"承認錯誤，快速反應","D":"如顧客有錯，應與其爭論，並請主管代為處理"},"a":"D","e":"第一步都應先承認錯誤，不和顧客爭論，再請主管代為處理後續事項。"},{"n":350,"cat":"服務流程","q":"SERVQUAL 量表係由美國教授 A. Parasuraman， Valarie A. Zeithaml and Leonard L. Berry 三人所提出的「服務品質概念模式」中的服務品質的十種屬性演化而來，並整合為五項構面。何者不包括其中？","o":{"A":"可靠性","B":"反應性","C":"同理性","D":"無形性"},"a":"D","e":"SERVQUAL （service quality）: 有形性（tangibles）、可靠性（reliability）、反應性（responsiveness）、保證（assurance）、同理心（empathy）。"},{"n":351,"cat":"服務流程","q":"「林小姐是一位餐廳主管，每當她看見一位生氣的客人，就讓她感到失去一位寶貴的顧客」此種論述同何項理論？","o":{"A":"顧客忠誠度","B":"顧客終身價值","C":"市場評估","D":"市場佔有率"},"a":"B","e":"顧客終身價值（customer lifetime value）指的是每個購買者在未來可能為企業帶來的收益總和；並且每個客戶的價值都由三部分構成：歷史價值、當前價值和潛在價值。"},{"n":352,"cat":"服務流程","q":"會展產業為具三高三大特性之「火車頭型服務業」，並且能夠大幅帶動周邊經濟效益。以下對我國會展產業面臨之問題描述，何者為非？","o":{"A":"展覽場地不足","B":"國內參展規模受限","C":"國外競爭壓力大","D":"南北發展均衡"},"a":"D","e":"南部地區無適當展場，廠商多前往臺北參展，臺北為發展重鎮。"},{"n":353,"cat":"服務流程","q":"連鎖餐廳為統一專業化管理與規劃的經營方式，能使其達到最佳的經濟效益與最大的衝擊力。下列針對該餐廳「一般特性」的敘述何者有誤？","o":{"A":"應具備的餐飲專業技術層次較低","B":"原料大部分採用半成品","C":"食譜標準化、分量一致化","D":"業主可主導整個作業"},"a":"D","e":"業主無法自己親自主導整個作業，甚至有時不能過問經營者之決策。"},{"n":354,"cat":"服務流程","q":"為求縮短旅客抵達飯店時登記作業時間，並減少發生錯誤的機會，櫃檯多於已訂房旅客到達前，將房間妥善做好安排。關於排房之原則，下列何者有誤？","o":{"A":"散客在高樓，團體在低樓","B":"散客遠離電梯，團體靠近電梯","C":"先排重要客人，再排一般旅客","D":"先排短期住客，後排長期住客"},"a":"D","e":"先排長期住客，後排短期住客。"},{"n":355,"cat":"服務流程","q":"若一家線上旅行代辦中心寄給它的顧客一封 e-mail，以告知一個關於加勒比遊艇之旅的優惠訊息，此例最能解釋下列何種概念?","o":{"A":"配銷","B":"作業管理","C":"推廣","D":"產品／服務管理"},"a":"C","e":"推廣包含與顧客進行溝通並寄送能以說服及提醒消費者購買之訊息等行動；產品／服務管理為行銷之功能，旨於改進產品／服務以取得市場機會"},{"n":356,"cat":"服務流程","q":"若雄獅旅行社要為大公司設計具獨特性的專門服務，下列哪個方案是他們應該考慮的?","o":{"A":"優先劃位","B":"渡假俱樂部","C":"旅遊考察團","D":"保證最低票價"},"a":"B","e":"提供特別的渡假套裝行程或優惠的渡假行程較能吸引公司員工，保證最低票價及優先劃位是所有旅行社均會用的行銷手法，旅遊考察團則為會議規劃型客戶的需求"},{"n":357,"cat":"服務流程","q":"當銷售人員發現另一個產品比原先推薦給顧客的產品更能滿足顧客需求，下列何者為最佳作法?","o":{"A":"進行產品展示","B":"建議替代方案","C":"回應顧客抱怨","D":"詢問更多資訊"},"a":"B","e":"因為銷售人員已知道另一產品更能滿足消費者的需求，故應直接提出替代方案建議，然後才進行產品之展示"},{"n":358,"cat":"服務流程","q":"遊樂園若欲為家庭客群打造一個具歡樂、親切氛圍的娛樂環境，第一線員工應該採取何種行動以維持此形象?","o":{"A":"發展能強化園區對社區之承諾的公關活動","B":"清楚了解園區配置以能合宜地回答顧客的問題","C":"先早到一個小時以確保園區的清潔並達到最佳營運狀態","D":"印製在門口發放宣傳園區日常活動及表演的傳單"},"a":"B","e":"只有清楚了解園區配置以協助顧客到達顧客想去的地方是第一線員工之職責所在，其他三項均非第一線員工之責"},{"n":359,"cat":"服務流程","q":"為了確保資料之安全，櫃檯人員應如何服務前來櫃檯詢問住房顧客之房號的人?","o":{"A":"直接表明並無職權透露房客資訊","B":"將房號寫於紙上以防止周圍的人聽到","C":"邀請詢問者使用電話與房客聯繫","D":"給詢問者中央預約系統的電話號碼，並請其自行前去取得房號"},"a":"C","e":"櫃檯人員有責保護房客的隱私及安全，因此絕對不能把房號給他人，但亦應協助取得聯繫，以協助創造新客戶"},{"n":360,"cat":"服務流程","q":"在觀光與接待業中，消費者參與於服務傳遞系統之過程可區分為哪三個階段?","o":{"A":"導入－消費－成熟","B":"導入－消費－離開","C":"投入－消費－離開","D":"導入－消費－衰退"},"a":"C","e":"投入－消費－離開為觀光與接待業中，消費者於服務傳遞系統之參與過程。"},{"n":361,"cat":"服務流程","q":"下列何敘述中，何者屬於服務業中的[消費階段 ]?","o":{"A":"顧客開始詢問接觸","B":"顧客開始參與產品試用","C":"顧客上網反應消費意見","D":"顧客開始用餐"},"a":"D","e":"顧客開始使用服務時就進入了消費階段。"},{"n":362,"cat":"服務流程","q":"觀光產業與傳統產業於顧客價值傳遞過程中最大的差異處在於?","o":{"A":"員工與顧客互動與否","B":"顧客參與與否","C":"仲介商之存在與否","D":"服務時間之長度"},"a":"B","e":"服務業具有消費與生產不可分割之特性，因此顧客的參與是傳遞顧客價值的關鍵。"},{"n":363,"cat":"服務流程","q":"下列何者為行銷一項旅行或觀光服務之最佳範例?","o":{"A":"旅行袋紀念品","B":"景點明信片","C":"四星級餐廳的晚餐","D":"巴士導覧外加住宿"},"a":"D","e":"行銷一項旅行或觀光服務，指行銷無形的產品而非有形的產品，通常指體驗、旅行袋、明信片及晚餐都是有形的產品；巴士導覧及住宿是屬於服務。"},{"n":364,"cat":"服務流程","q":"飯店的行銷人員在顧客離店前，給予小紀念品或值得回憶的照片，是因為觀光產品具有何種特質?","o":{"A":"易變性、易滅性","B":"無形性、缺乏所有權","C":"無形性、不可分割性","D":"不可分割性、易滅性"},"a":"B","e":"飯店中的服務或設施都不能帶回，故為無形性，即缺乏所有權。"},{"n":365,"cat":"服務流程","q":"在觀光產業中，消費者容易產生不確定感與知覺風險，此現象說明服務相較於實體產品具有較多的何種屬性?","o":{"A":"信任、經驗","B":"搜尋、經驗","C":"搜尋、信任","D":"搜尋、信任、經驗"},"a":"A","e":"無形的服務有較多的經驗及信任屬性，實體產品則具有搜尋屬性。"},{"n":366,"cat":"服務流程","q":"面對觀光產品之不可分割性的因應之道中，哪一個不正確?","o":{"A":"進行產品元素之考量時，應包括餐點、服務生態度及其他消費者","B":"主動提供資訊，讓消費者了解消費流程與適切行為","C":"組織遴選、聘僱及訓練顧客以提高服務價值","D":"進行服務品質之評估時，應考量服務場所的設備等實體環境"},"a":"C","e":"訓練員工以提升服務品質是因為服務具多變性。"},{"n":367,"cat":"服務流程","q":"關於服務藍圖（service blue print）的敘述，哪一個不正確?","o":{"A":"主要是以業者的觀點出發設計而成的服務傳遞系統","B":"互動線代表房客與旅館員工進行接觸","C":"內部互動線是代表用來服務房客的內部支援系統","D":"是作為降低服務多變性、創造一致性的有效工具"},"a":"A","e":"服務藍圖中包含從顧客觀點看到的服務證據。"},{"n":368,"cat":"服務流程","q":"關於服務利潤鏈的敘述，哪一個不正確?","o":{"A":"內部行銷必優先於外部行銷","B":"互動行銷指認知的服務品質取決於服務接觸時，員工與顧客互動之品質","C":"包含員工能力迴圈、員工滿意度迴圈、顧客忠誠度迴圈、企業盈利迴圈，以顧客忠誠度迴圈為主軸","D":"互動行銷中，服務成果及服務人員對消費者而言同等重要"},"a":"C","e":"以企業盈利迴圈為主軸。"},{"n":369,"cat":"服務流程","q":"下列關於服務類別之敘述，何者為非?","o":{"A":"自助型服務優勢在於降低成本，劣勢為顧客回饋回收困難","B":"套裝式服務著重於以較低的價格吸引顧客","C":"遠距教學屬於直接型服務","D":"事前服務型的顧客需花較多的時間蒐集資訊並對服務效率要求高"},"a":"B","e":"套裝式服務主要在於增高每單位服務之使用，並創造能提高價格的機會。"},{"n":370,"cat":"服務流程","q":"下列關於產能管理與需求管理的敘述，哪一個是正確的?","o":{"A":"晶華酒店在母親節推出自助餐是產能管理","B":"法國旅館無法供餐時安排團客至塞納河上的郵輪用餐是需求管理","C":"金沙賭場在淡季時舉辦吃角子老虎大賽是產能管理","D":"涵碧樓提供公司價給不會隨商業需求波動的顧客是產能管理"},"a":"A","e":"自助服務科技讓顧客成為服務員工能減少員工工作負荷量，故屬於產能管理。"},{"n":371,"cat":"服務流程","q":"在服務過程中，產生有利行為意圖可能性之顧客型態，依可能性由大至小之排列為何?","o":{"A":"問題被有效解決>未遭遇問題>問題未能被解決","B":"問題被有效解決>問題未能被解決>未遭遇問題","C":"問題未能被解決>未遭遇問題>問題被有效解決","D":"未遭遇問題>問題被有效解決>問題未能被解決"},"a":"D","e":"無服務失誤之產生，便無服務補救無效之風險，故未遭遇問題的顧客的有利行為意圖高。"},{"n":372,"cat":"服務流程","q":"服務補償之程序為何?","o":{"A":"確認服務缺失、補償顧客、進行服務缺失溝通及分類、改善整體服務","B":"確認服務缺失、進行服務缺失溝通及分類、補償顧客、改善整體服務","C":"進行服務缺失溝通及分類、確認服務缺失、補償顧客、改善整體服務","D":"確認服務缺失、進行服務缺失溝通及分類、改善整體服務、補償顧客"},"a":"A","e":"服務補救程序為：確認服務缺失、補償顧客、進行服務缺失溝通及分類、改善整體服務。"},{"n":373,"cat":"服務流程","q":"市場調查研究之改善、組織扁平化及管理者與員工間培養較佳的溝通模式，可以縮小哪一個品質缺口?","o":{"A":"缺口一:顧客期望與管理者認知間的缺口","B":"缺口二:管理者認知與服務品質規格間的缺口","C":"缺口三:服務品質規格與服務傳遞間的缺口","D":"缺口四:服務傳遞與外部溝通間的缺口"},"a":"A","e":"上述這些作法可縮小顧客期望與管理者認知間的缺口。"},{"n":374,"cat":"異業結盟","q":"下列何者不是行銷人員在執行異業結盟時，應優先考量之因素？","o":{"A":"整合並運用不同企業間有限的資源","B":"可先以極小成本瞭解另一產業，奠定未來跨入該產業之基礎","C":"可專業分工，讓企業更專注於核心競爭力","D":"讓企業維持生存、創造成長"},"a":"B","e":"並非異業結盟應優先考量因素，且不合乎職業道德。"},{"n":375,"cat":"異業結盟","q":"針對異業結盟之描述，下列何者有誤？","o":{"A":"適用於大企業，甚至是跨國企業","B":"個人工作室並不適用","C":"彼此的顧客群的互補性很重要","D":"所找之合作對象，可以水平結合，亦可垂直結合"},"a":"B","e":"異業結盟小至個人，大至跨國企業，均可適用。其合作對象通常為水平結合，但亦可以垂直結合。"},{"n":376,"cat":"異業結盟","q":"執行異業結盟時，因彼此屬性與層次或有不同，產生不同的異業結盟類型。下列何者並非常見的異業結盟類型？","o":{"A":"將異業結盟之目標對象，透過併購取得主導權。","B":"利用彼此資源，舉辦促銷活動","C":"「聯合次要敵人、打擊主要敵人」","D":"從上游研發到下游促銷都共同合作"},"a":"A","e":"併購並非異業結盟之主要類型。"},{"n":377,"cat":"異業結盟","q":"下列何者不是企業進行異業結盟之主因？","o":{"A":"開發新市場或新客群","B":"打擊或圍堵競爭者","C":"無須研發新產品","D":"降低成本或分散風險"},"a":"C","e":"並非企業進行異業結盟之主因。"},{"n":378,"cat":"異業結盟","q":"關於異業結盟的描述，何者為非?","o":{"A":"將不同的生產者集結於同一個行銷通路中","B":"結盟夥伴間須具有互補的組織文化","C":"將同一生產者的商品結合不同的行銷通路","D":"異業結盟可發揮垂直整合的優勢"},"a":"B","e":"結盟夥伴間須有一致的組織文化而非互補的組織文化。"},{"n":379,"cat":"異業結盟","q":"下列關於異業結盟特質之敘述，何者為非?","o":{"A":"策略性的合作目標","B":"時間有時效性","C":"契約式的合作基礎","D":"皆為技術交換式的利益交換"},"a":"D","e":"技術交換只是其中一種型式，亦可為行銷，服務等資源之交換。"},{"n":380,"cat":"異業結盟","q":"下列何者非水平式異業結盟關係之敘述?","o":{"A":"保險公司和旅行社之合作","B":"百貨公司內之內衣專櫃與化妝品專櫃之合作","C":"飯店和租車公司之合作","D":"La New 公司下的國民旅遊卡門市"},"a":"D","e":"La New 下的國民旅遊卡門市為垂直式行銷系統之實例。"},{"n":381,"cat":"異業結盟","q":"下列何者為同業態之間透過多角化進行整合或是企業透過連鎖方式佔有市場的概念？","o":{"A":"異業結盟","B":"水平整合","C":"垂直整合","D":"企業 e 化"},"a":"B","e":"連鎖方式是最標準的水平整合之多角化。"},{"n":382,"cat":"異業結盟","q":"下列何者非為異業結盟之選擇原則?","o":{"A":"消費目的不同","B":"商品略同價格一致","C":"企業形象相近","D":"目標客層相近"},"a":"B","e":"異業合作之考量與對方的商品類別及價格無關。"},{"n":383,"cat":"異業結盟","q":"下列何者非為異業結盟具有的優勢?","o":{"A":"達到經濟規模","B":"創造綜效","C":"提升組織學習效果","D":"提高進入障礙"},"a":"A","e":"異業合作之優勢為創造綜效、降低風險、提升組織學習效果、提高進入障礙。"},{"n":384,"cat":"異業結盟","q":"下列何者較不是廠商進行異業結盟中所欲追求的特定資源?","o":{"A":"品牌資產與行銷能力","B":"市場知名度","C":"關鍵性技術能力","D":"創意人才"},"a":"D","e":"創意人才是否為有益的資源，得視雙方是否均以創意／創新為策略目標並具有創新的組織文化而定。"},{"n":385,"cat":"異業結盟","q":"多元的策略聯盟可彌補產業資源的不足，提高其附加價值，何者不是異業結盟一開始簽訂時的首要考量？","o":{"A":"創新或品味","B":"互補性","C":"長期性績效","D":"增加核心競爭力"},"a":"C","e":"異業聯盟初期應如能提升階段性績效，即可達成目標，長期績效並非首要考量。"},{"n":386,"cat":"異業結盟","q":"下列何項結盟關係中，何者不屬於行銷資源之交換?","o":{"A":"中心衛星工廠","B":"產品及售後服務代理","C":"區域共同行銷","D":"加盟體系"},"a":"A","e":"中心衛星工廠為生產後勤資源之交換。"},{"n":387,"cat":"異業結盟","q":"下列何者並非異業結盟？","o":{"A":"華碩電腦（ASUS）與統一超商（7-ELEVEN）的合作（i-bon 的雲端列印服務）","B":"宏碁電腦與職棒大聯盟球星（企業形象廣告）的合作","C":"中華航空與吳寶春麵包店（機上麵包）的合作","D":"統一超商與中國信託（提款服務）的合作"},"a":"B","e":"本題目測驗異業結盟之意義。（B）為代言之概念。"},{"n":388,"cat":"異業結盟","q":"Roy 在花蓮經營運動休閒俱樂部，為了開拓客源，他和鄰近的民宿合作，讓入住民宿的旅客也如住五星級旅館一般，可以使用俱樂部設施，增加俱樂部的收入，也讓民宿更有競爭力。此種策略是：","o":{"A":"贊助策略","B":"廣告策略","C":"運動觀光","D":"異業結盟"},"a":"D","e":"異業結盟係指兩種以上不同業種，為彼此共同的目標而相互結合，使得雙方資源在共同之下發揮最大的營運效益。"},{"n":389,"cat":"異業結盟","q":"John 在臺北市經營運動休閒俱樂部，為了開拓客源，他和另一區的運動休閒俱樂部的合作，讓彼此的會員可以使用兩間俱樂部的設施。此種行銷策略是：","o":{"A":"贊助策略","B":"廣告策略","C":"策略聯盟","D":"異業結盟"},"a":"C","e":"兩者非異業間之結盟，故屬策略聯盟。"},{"n":390,"cat":"異業結盟","q":"國立故宮博物院與義大利生活精品設計品牌 ALESSI 合作，推出「The Chin Family 清宮家族」及「Orientales—東方傳說」兩次合作案，請問下列何者不正確？","o":{"A":"此案在簽訂合作意向書後，便可推出產品","B":"這是異業結盟的行銷策略","C":"故宮想借重 ALESSI 的西方觀點與時尚設計感與歐美通路","D":"ALESSI 想借重故宮的中華文物及文化價值"},"a":"A","e":"兩個差異甚大的異業結盟主體，在簽訂合作意向書後，必須經過多次溝通、討論，才能創造出成功作品。本題在實際上，根據故宮人員表示，亦是多次不斷的溝通始能成功。"},{"n":391,"cat":"異業結盟","q":"Jeremy 想幫自己位於臺北市的運動休閒俱樂部創造全新的競爭力，使顧客能以差不多的花費，享受到更多元的產品，又不致傷害到自己的俱樂部。下列何者是他最適合結盟的對象？","o":{"A":"市民運動中心","B":"臺北市的重量訓練俱樂部","C":"信義區五星級飯店的健身俱樂部","D":"透過雲端合作的健檢中心"},"a":"D","e":"健檢中心與運動休閒俱樂部所提供之產品功能具有互補性，故（ D ）為最適合結盟之對象"},{"n":392,"cat":"異業結盟","q":"若您是一位旅行社的行銷人員，公司業務主軸為自行車旅遊。當公司要您執行異業結盟計畫，尋找可能合作對象時，需首先應考慮之因素為：","o":{"A":"確認目標客群之需求","B":"擬定一份異業結盟企畫書","C":"搜尋企業形象良好的合作對象","D":"合作對象應符合公司層級與屬性"},"a":"A","e":"確認目標客群之需求，為執行異業結盟時最先考慮之因素。"},{"n":393,"cat":"異業結盟","q":"若您是一位自行車跨國大企業行銷人員，當公司要您執行以樂活（LOHAS）為主題的異業結盟計畫時，尋找可能合作對象時，下列何者較適宜？","o":{"A":"健康飲品（燕麥、優酪乳等）公司","B":"日系汽車公司","C":"大型國際購物中心或百貨公司","D":"信義區的夜店"},"a":"A","e":"依題意，應選擇與樂活（lifestyle of health and sustainability）主軸相符之合作對象。"},{"n":394,"cat":"異業結盟","q":"消費者可至統一或全家超商提取高鐵票，是因為業者間具有何種合作關係?","o":{"A":"特許加盟","B":"連鎖加盟","C":"異業結盟","D":"同業結盟"},"a":"C","e":"超商及高鐵屬異業，為運輸業與通路業者的合作"},{"n":395,"cat":"異業結盟","q":"觀光相關系所的學生至飯店實習，此種合作方式屬於何種結盟類型?","o":{"A":"生產型結盟","B":"銷售型結盟","C":"後勤型結盟","D":"人力資源型結盟"},"a":"D","e":"此種合作目的為取得足夠的人力資源；飯店獲得人力，學校為學生取得在業界實習的機會"},{"n":396,"cat":"異業結盟","q":"下列何者不是「製販同盟」之實例?","o":{"A":"王品與花旗銀行合作，推出優惠方案以回饋忠誠顧客並吸引新客群","B":"資生堂與統一超商合作，由日本引進 neuve 品牌之彩妝，主打少女客群","C":"星巴克咖啡在統一超商販賣星巴克發現系列","D":"COSCO 推出自有品牌 Kirkland"},"a":"A","e":"是異業合作，但非製販同盟，花旗並非通路業者"},{"n":397,"cat":"異業結盟","q":"下列何者為垂直異業結盟的實例?","o":{"A":"觀光業者透過「花蓮飯店聯合行銷網」進行花蓮觀光產業之推廣","B":"指將不同功能、不同產業的廠商結合在一起，共同進行促銷活動","C":"廠商委託其他研發廠商進行新產品研發，並由廠商自行負責後續的生產、行銷","D":"天仁喫茶趣以茶餐帶動茶具的銷售"},"a":"C","e":"為同產業但不同功能，以達成共同目標，具產業鏈上下游之關係的合作模式"},{"n":398,"cat":"異業結盟","q":"下列何者非為「垂直式行銷系統」的實例?","o":{"A":"美國運通因其強大的旅遊網絡而在旅遊市場擁有強大影響力","B":"復興航空之於復興空廚及中英電腦訂位系統的運作模式","C":"85 度 C 的特許加盟","D":"燦星旅遊與婚紗業者、飯店共同推出海外婚禮方案"},"a":"D","e":"燦星旅遊與婚紗業者、飯店之合作模式應為水平式行銷系統"},{"n":399,"cat":"異業結盟","q":"臺灣旅行業者較不易與商業銀行合作以「聯名卡」或「認同卡」的方式合作的原因中，哪一個不正確?","o":{"A":"旅行業消費者單次消費額低","B":"旅行業產品被替代性高","C":"二產業接觸客群完全不同","D":"旅行業消費者消費頻率低"},"a": },"a":"C","e":"萬達集團曾以高額資金收購 IRONMAN 主辦單位（世界鐵人公司 WTC），取得全球賽事經營權。這是典型的跨國企業透過併購方式，快速進入國際體育市場的策略，屬於全球運動品牌併購行為"},{"n":30,"cat":"運動產業概況","q":"根據美國運動經濟學者之「運動核心與週邊產業」概念，哪些行業非屬於運動核心產業？","o":{"A":"參與性運動","B":"觀賞性運動","C":"運動製造業","D":"以上皆是"},"a":"C","e":"若沒有核心的運動事件（Event）及參與或觀賞者，便不會衍生出其他子產業"},{"n":31,"cat":"運動產業概況","q":"學者 Meek 提出運動產值的計算公式，不包含以下哪項數據？","o":{"A":"運動投資","B":"運動人口數","C":"運動消費","D":"運動淨出口"},"a":"B","e":"學者米克（Meek, 1997）認為在界定運動產業時，應是由「運動消費」（Sports Consumption）、「運動投資」（Sports Investment）以及「運動淨出口」（Sports Net Exports）等三個部分所組成。在計算運動產業的產值時，米克以「國內運動產業生產毛額」（Gross Domestic Sport Product， GDSP）來做為指標，以方程式「GDSP =運動消費+運動投資–運動淨出口」為工具"},{"n":32,"cat":"運動產業概況","q":"下列哪一項不是 Meek（1997）在運動消費上的分類？","o":{"A":"運動服務類","B":"運動娛樂類","C":"運動產品類","D":"運動支援組織類"},"a":"A","e":"米克提出運動消費的分類為運動娛樂業、運動產品類、運動支援組織類。"},{"n":33,"cat":"運動產業概況","q":"李明認為 Meek 的運動產業分類不夠明確，另提出一個運動產業的模型架構，是以何者為運動產業的核心，其他支援性的運動產品服務則環繞在外？","o":{"A":"運動傳播業","B":"運動製造業","C":"運動活動","D":"參與性運動"},"a":"C","e":"李明等人（Li, Hofarce&Mahony, 2001）則認為米克的運動產業分類難以明確分割且無法各自獨立，以致無法詳細描述其定義下的運動產業所包含的產品及服務，造成重複或難以歸類的問題。因此，提出另外一個運動產業的模型架構，以運動活動（Sport Activities）為運動產業中的核心，其他支援性的運動產品服務則環繞在外，可以明顯區分出和其他產業不同的地方，"},{"n":34,"cat":"運動產業概況","q":"運動經紀公司依規模性質、服務對象不同可分為四類，下列哪一項不在分類中？","o":{"A":"個人一對一服務","B":"全方位服務","C":"綜合性服務","D":"企業內部附屬的運動行銷服務"},"a":"A","e":"運動經紀公司，提供運動管理暨行銷的專業服務。依規模性質服務對象等不同，可分為：（1）全方位服務（Full-service）；（2）綜合性服務（General）；（3）專項服務（Specialty）；（4）企業內部附屬的運動行銷服務（In-house）等類型。"},{"n":35,"cat":"運動產業概況","q":"目前我國負責國內運動產業發展的最高行政組織為？","o":{"A":"教育部體育司","B":"交通部觀光局","C":"行政院體育委員會","D":"運動部"},"a":"D","e":"我國負責國內運動產業發展的最高行政組織為運動部"},{"n":36,"cat":"市場區隔與定位","q":"美國運動用品公司 Under Armour（UA）以生產極佳透氣和吸汗功能的緊身內衣起家。請問 UA 創辦人 Kevin Plank 當時企圖使用以下何種行為變數來區隔消費者市場？","o":{"A":"時機","B":"使用者狀態","C":"效益","D":"態度"},"a":"C","e":"運用效益之行為特徵來建構市場區隔"},{"n":37,"cat":"市場區隔與定位","q":"台灣每年要舉辦數百場路跑賽，請問下列何者不可能成為路跑賽定位的基礎？","o":{"A":"品牌屬性","B":"目標市場","C":"專業","D":"廣告訴求"},"a":"D","e":"廣告訴求是凸顯定位的手段"},{"n":38,"cat":"市場區隔與定位","q":"以下哪一種類型的運動產業存在差異化的機會？","o":{"A":"自有運動品牌器材","B":"運動用品代工","C":"球鞋零售商","D":"以上皆是"},"a":"A","e":"專業型產業較能透過差異化取得競爭優勢。"},{"n":39,"cat":"市場區隔與定位","q":"喬山健康科技公司（Johnson）從代工走向品牌，其致勝關鍵在於能夠製造價格合理且品質穩定的運動器材，滿足當時正迅速成長的健身市場。此種讓企業獲利的主要核心能力可稱為什麼？","o":{"A":"長尾理論（The Long Tail Theory）","B":"甜蜜點（Sweet Spot）","C":"光環效應（Halo Effect）","D":"長鞭效應（The Bullwhip Effect）"},"a":"B","e":"甜蜜點（Sweet Spot）原是高爾夫球專業術語，本意是意指打擊點最佳的一個球點，在此引伸為是讓企業獲利的主要核心能力所在。"},{"n":40,"cat":"市場區隔與定位","q":"「新科國民運動中心訂出游泳池全票 100 元、學生票70 元及老人優惠票 50 元之收費方式。」以上敘述是利用何種市場區隔方式？","o":{"A":"地理區隔","B":"人口統計區隔","C":"心理區隔","D":"行為區隔"},"a":"B","e":"依據不同消費對象因素將市場做區隔稱為人口統計區隔。"},{"n":41,"cat":"市場區隔與定位","q":"依照 Barbara Bryant （1987）的研究，下列何者不是美國成人參加運動和休閒活動的類型區隔？","o":{"A":"健康意識型","B":"無動機目的型","C":"尋求剌激競爭型","D":"以上皆是"},"a":"D","e":"上述類型加上渡假性質型及體適能型均為運動參與原因之區隔"},{"n":42,"cat":"市場區隔與定位","q":"歐都納（Atunas）因資源有限，所以只生產 EVA 發泡海綿相關水上器材為主要業務，如救生衣、衝浪板及海灘鞋與蛙鏡等項。此乃何種類型之行銷策略？","o":{"A":"個體行銷（Micro Marketing）","B":"差異化行銷（Differentiated Marketing）","C":"大眾行銷（Mass Marketing）","D":"集中行銷（Concentrated Marketing）"},"a":"D","e":"集中行銷指公司資源有限，所以針對單獨或少數市場專注用一種行銷組合的策略。"},{"n":43,"cat":"市場區隔與定位","q":"銳跑（Reebok）生產第一雙專為女性設計的運動鞋，因此帶動有氧運動的風潮，並成功改變運動市場型態。請問銳跑當初是以什麼變項來區隔市場？","o":{"A":"人口統計變數","B":"興趣","C":"利益需求","D":"價值觀"},"a":"A","e":"性別為人口統計變項其中一個指標"},{"n":44,"cat":"市場區隔與定位","q":"耐吉（Nike）為了能夠「有效接觸和服務臺灣的女性運動市場」，因此 2011 年首度舉辦女子路跑運動。請問上述指的是臺灣女性運動市場區隔具備什麼性質？","o":{"A":"可衡量性","B":"可接近性","C":"足量性","D":"穩定性"},"a":"B","e":"市場區隔能被有效接觸和服務的程度指的是市場區隔的可接近性。"},{"n":45,"cat":"市場區隔與定位","q":"「臺灣紡織業因高工資與勞動力短缺等轉變而景氣低迷，但近年所建立起的運動機能性布料差異，已成為運動服飾競爭的主力優勢。」以上敘述是指何種類型的差異化？","o":{"A":"產品差異化","B":"通路差異化","C":"人員差異化","D":"形象差異化"},"a":"A","e":"公司藉由機能性布料的創造，使運動機能衣脫穎而出而讓顧客對產品本身有不同於其他運動服飾的認知。"},{"n":46,"cat":"市場區隔與定位","q":"GoPro 集中生產各種運動攝影相關產品，並同時在幾個區隔市場裡銷售，這種目標市場的選擇型態是？","o":{"A":"單一市場集中","B":"選擇性專業化","C":"市場專業化","D":"產品專業化"},"a":"D","e":"產品專業化型態指的是公司集中生產特定產品，同時在幾個區隔市場裡銷售。"},{"n":47,"cat":"市場區隔與定位","q":"「台中市潛立方旅館提供潛水有關的任何服務，從潛水設備提供、課程訓練、認證考試，甚至到後期國內外潛水體驗行程安排都有專人服務。」上述企業是以何種方式為定位提供給顧客服務？","o":{"A":"競爭者定位","B":"整合者定位","C":"技術定位","D":"重新定位策略"},"a":"B","e":"有些廠商希望藉由提供所有消費者在特別產品類別、產業的產品或服務，以滿足消費者一次購足的需求，此定位稱為「整合者定位」。"},{"n":48,"cat":"市場區隔與定位","q":"位在彰化縣的田中鎮，開辦「田中馬」馬拉松，每年賽事為小鎮帶來數千萬觀光商機。下列何者是主辦單位最可能設定的參與性市場區隔？","o":{"A":"尋找刺激的競爭者","B":"無壓力動機者","C":"注重健康的社交聚會者","D":"追求體適能者"},"a":"C","e":"注重健康的社交聚會者會去尋找讓自己更健康的活動，以積極心態進行無危險或壓力的活動。"},{"n":49,"cat":"市場區隔與定位","q":"近年來高中籃球聯賽（HBL）受到囑目的程度遠超過大專籃球聯賽（UBA）或超級籃球聯賽（SBL）。請問目前應將 HBL 定位於哪一種產品類型？","o":{"A":"觀賞性運動","B":"參與性運動","C":"運動商品、服飾、鞋和相關產品","D":"以上皆是"},"a":"D","e":"高中學生參與賽事，FOX 提供電視轉播觀賞機會，Nike 則贊助並販售參賽學校紀念球衣。"},{"n":50,"cat":"市場區隔與定位","q":"岱宇國際（Dyaco）公司努力開發各種專業健身器材，身為一名運動行銷人員在為其制定定位策略的時候，以下何者最不適宜？","o":{"A":"強調一個或多個產品屬性","B":"強調產品適合特別的使用情境","C":"使用 BCG 矩陣評估旗下現有產品的投資組合策略","D":"針對某一種類型的消費者來定位"},"a":"C","e":"BCG 矩陣只是用來評估自家產品的投資組合，而定位策略則必須強調自家產品與競爭品牌的差異"},{"n":51,"cat":"市場區隔與定位","q":"健身器業者想引進「無人健身艙」，因目前尚未有任何業者在臺經營提供此項服務，故欲透過消費者問卷調查收集資料，以進行市場區隔與定位分析，下列什麼資料比較難收集？","o":{"A":"實際購買行為","B":"社會階層","C":"居住地區","D":"偏好"},"a":"A","e":"因為新的產品上市前無法產生實際購買行為"},{"n":52,"cat":"市場區隔與定位","q":"Pitts， Fielding， & Miller （1994） 將運動產業分為三種區隔，以下何者並非運動產業區隔？","o":{"A":"運動表現區隔","B":"運動消費區隔","C":"運動生產區隔","D":"運動促銷區隔"},"a":"B","e":"Pitts, Fielding & Miller 將運動產業分為運動表現區隔、運動生產區隔及運動促銷區隔。"},{"n":53,"cat":"市場區隔與定位","q":"「Ptt 球鞋版上集結了來自各地的球鞋同好，使用者分享各式各樣的球鞋資訊、使用測評、製鞋分析等資訊。」此種集結具有共同興趣與目標的社群是利用何種市場區隔方式？","o":{"A":"地理區隔","B":"人口統計區隔","C":"心理區隔","D":"行為區隔"},"a":"C","e":"心理區隔是按照購買者的心理與人格特質、價值觀與生活型態為基礎，來將其劃分成不同的群體"},{"n":54,"cat":"市場區隔與定位","q":"「近來車市吹起運動風，知名桌球選手教練為 Toyota站臺，職棒打擊手則為 Grand Lancer 代言。」以上敘述是汽車品牌公司所進行的何種差異化？","o":{"A":"產品差異化","B":"通路差異化","C":"人員差異化","D":"形象差異化"},"a":"D","e":"形象差異化是由於產品的核心部分與競爭者雷同下，企業塑造不同的產品形象以獲得差別優勢"},{"n":55,"cat":"市場區隔與定位","q":"「限量版、聯名款球鞋與功能型球鞋，擁有不同的獲利型態，其相對應的行銷活動不大相同。」前面所言是訴求下列何者的不同？","o":{"A":"市場區隔","B":"產品品質","C":"產品價格","D":"產品通路"},"a":"A","e":"市場區隔包括一群擁有類似慾望的顧客，他們會對想要的球鞋有不同的想法。"},{"n":56,"cat":"市場區隔與定位","q":"近年球鞋市場裡掀起一股炒鞋文化，廠商透過少量生產，後續改款的作法，哄抬產品的價值。顯然是比大量生產，原價賣出還要有利。有不少人利用這些空間，收購鞋子，再高價轉賣出去，改變了原本球鞋的買賣。你認為這種產品定位策略是？","o":{"A":"產品功能屬性定位","B":"產品線定位","C":"產品外觀定位","D":"產品價格定位"},"a":"A","e":"產品功能屬性定位主要是滿足消費者的需求"},{"n":57,"cat":"市場區隔與定位","q":"某消費者在接受市場調查時說：「我總認為 A 健身房只提供高價位的服務，沒想到也有比較平價的租借使用方式！」試問 A 健身房在定位策略上犯了何種錯誤？","o":{"A":"困惑定位（Confused Positioning）","B":"過度定位（Overpositioning）","C":"缺乏定位（Underpositioning）","D":"無定位（Non-positioning）"},"a":"B","e":"過度定位（Overpositioning）把目標客戶群設定太窄，造成目標客戶購買後便沒有客戶了"},{"n":58,"cat":"市場區隔與定位","q":"某運動品牌在以往的市調顯示，總是找來體壇巨星作為代言人，難以獲得女性族群的青睞，於是重新找來部落客、時尚名流或網紅。這些人可能是愛運動的女性，但不是職業選手。此乃屬於何種行銷策略？","o":{"A":"重新定位","B":"功能調整","C":"樣式調整","D":"產品一致性"},"a":"A","e":"重新定位是以改變產品、商店或組織本身在顧客心目中既有形象或定位，所擬定的新行銷策略"},{"n":59,"cat":"市場區隔與定位","q":"愛迪達（Adidas）曾打出一個廣告口號是「all in for#mygirls」。你認為愛迪達試圖使用何種變數以區隔市場？","o":{"A":"地理","B":"社會階層","C":"性別","D":"心理"},"a":"C","e":"以 girl 變數區隔性別"},{"n":60,"cat":"市場區隔與定位","q":"運動產業採取以下何種市場區隔基礎，行銷策略的執行效率最高？","o":{"A":"運動品牌鎖定女性市場","B":"健身房鎖定高所得市場","C":"游泳池鎖定年輕人市場","D":"運動用品廠商鎖定籃球愛好者市場"},"a":"D","e":"以利益、動機等作為區隔基礎，有助於廠商預測消費者行為，所訂定行銷策略最能有效滿足消費者的需求"},{"n":61,"cat":"市場區隔與定位","q":"請問目前耐吉（Nike）的經營模式屬於下列何種？","o":{"A":"純實體經營（Pure Physical）","B":"純線上經營（Pure Play）","C":"虛實合一（Click and Mortar）","D":"以上皆非"},"a":"C","e":"虛實合一指的是同時有網站及實體店面的公司。"},{"n":62,"cat":"市場區隔與定位","q":"甜蜜點（Sweet Spot）是讓企業獲利的主要核心能力所在，試問下列何者可能是未來運動用品的甜蜜點？","o":{"A":"企業組織內部擁有最完善的知識管理系統","B":"提供顧客在線上客製化自己的運動用品","C":"運動品牌中合作廠商最多","D":"擁有完整的中間商、配銷商供應鏈"},"a":"B","e":"甜蜜點是指讓企業獲利的主要核心能力，提供顧客在線上客製化自己的鞋子、衣服、褲子等等。"},{"n":63,"cat":"市場區隔與定位","q":"目前多數運動產業公司都會利用粉絲專頁的資訊來建立數據以訂定其行銷策略。請問，運動產業透過粉絲專頁的經營可以得到下列何種資料？","o":{"A":"覆蓋範圍的內容","B":"說讚的內容","C":"談論這個內容","D":"以上皆是"},"a":"D","e":"粉絲專頁精準行銷具有下列類別數據資料：說讚的內容、覆蓋範圍的內容及談論這個內容"},{"n":64,"cat":"市場區隔與定位","q":"「桃源戶外」運動用品連鎖店只提供戶外休閒活動登山露營等相關用品，力求專業，以與微笑、摩曼頓等對手公司產生差異化。以上敘述是何種類型的差異化？","o":{"A":"產品差異化","B":"通路形象化","C":"人員差異化","D":"形象差異化"},"a":"A","e":"產品差異化是依據自身產品所擁有而競爭者缺少的產品特色或組合來定位"},{"n":65,"cat":"消費者行為","q":"挑戰超級馬拉松的選手，應屬於馬斯洛需求層級理論中的哪一個層次？","o":{"A":"安全需求","B":"社會需求","C":"生理需求","D":"自我實現"},"a":"D","e":"馬斯洛需求層級理論中自我實現之定義。"},{"n":66,"cat":"消費者行為","q":"關於個體參與運動活動之動機，下列敘述何者為真？","o":{"A":"從運動中獲得生理效益","B":"享受從事運動之樂趣","C":"增進運動技能","D":"以上皆是"},"a":"D","e":"參與運動動機包含生理、社交與個人等因素。"},{"n":67,"cat":"消費者行為","q":"NBA 球星被邀請出席兒童籃球訓練營，凸顯參與籃球運動的效益。主要是運用下列哪一種學習機制。","o":{"A":"行為學習","B":"認知學習","C":"社會學習","D":"以上皆非"},"a":"C","e":"社會學習乃指從仿效他人之行為學習。"},{"n":68,"cat":"消費者行為","q":"市面上的體重減重班之操作方式為提供一個理想的體重，接著提供續練菜單以及健康飲食須知。主要是運用下列哪一種學習機制。","o":{"A":"行為學習","B":"認知學習","C":"社會學習","D":"以上皆非"},"a":"B","e":"認知學習乃指透過問題解決之學習。"},{"n":69,"cat":"消費者行為","q":"下列何者是描述個體對於某一運動組織之心理承諾或情感連結？","o":{"A":"認同感","B":"知覺風險","C":"滿意度","D":"涉入程度"},"a":"A","e":"認同感乃指個體對於某一運動組織之心理承諾或情感連結。"},{"n":70,"cat":"消費者行為","q":"迪卡儂在銷售現場設置高爾夫球具試用場地供消費者試用。此作法符合下列哪一個描述？","o":{"A":"測試行銷（Test Marketing）","B":"體驗行銷（Experiential Marketing）","C":"病毒行銷（Viral Marketing）","D":"以上皆非"},"a":"B","e":"體驗行銷意旨提供消費者體驗產品或服務。"},{"n":71,"cat":"消費者行為","q":"一家球棒製造商提供新開發之球棒供數個大學棒球校隊使用，在球季結束後，該製造商從試用該球棒之球員蒐集使用意見。此作法稱為___________。","o":{"A":"測試行銷（Test Marketing）","B":"體驗行銷（Experiential Marketing）","C":"病毒行銷（Viral Marketing）","D":"以上皆非"},"a":"A","e":"測試行銷意旨在實際場域的實驗或測試。"},{"n":72,"cat":"消費者行為","q":"關於運動賽會獨特性之描述，下列何者正確？","o":{"A":"高度仰賴產品延伸","B":"生產與消費同時發生","C":"賽會結果的不確定性","D":"以上皆是"},"a":"D","e":"運動賽會獨特性包含高度仰賴產品延伸、生產與消費同時發生、賽會結果的不確定性。"},{"n":73,"cat":"消費者行為","q":"約翰現有的慢跑鞋已經磨損的很嚴重，想要買一雙最新型的 Nike 慢跑鞋。所描述的是下列何者？","o":{"A":"消費","B":"資訊搜尋","C":"需求確認","D":"以上皆是"},"a":"C","e":"需求確認意旨在現有狀態與理想狀態的差距。"},{"n":74,"cat":"消費者行為","q":"馬克在選購運動鞋時，每次都是直接購買 New Balance 的鞋。其購買決策行為是下列何者？","o":{"A":"廣泛決策行為","B":"習慣決策行為","C":"有限決策行為","D":"以上皆是"},"a":"B","e":"習慣決策行為意旨根據過去的使用經驗而進行隻購買決策。"},{"n":75,"cat":"消費者行為","q":"由於時間或空間所造成無法參與運動的阻礙因素稱為________。","o":{"A":"文化阻礙","B":"社會阻礙","C":"個人阻礙","D":"結構阻礙"},"a":"D","e":"結構性阻礙意旨由於時間或空間所造成無法參與運動的阻礙因素。"},{"n":76,"cat":"消費者行為","q":"NBA 的標語「This Is Why We Play!」傳遞其品牌價值，是利用下列何者因素吸引球迷觀賞？","o":{"A":"社會階層","B":"年齡","C":"產品生命週期","D":"價值觀"},"a":"D","e":"NBA 欲利用此標語吸引認同此價值觀之球迷。"},{"n":77,"cat":"消費者行為","q":"大明認為美國職棒大聯盟的比賽具有優異的競賽品質，相當精彩。上述描述是指下列哪一種概念？","o":{"A":"態度","B":"動機","C":"信念","D":"價值觀"},"a":"C","e":"信念意旨個體對事物所抱持之描述性想法。"},{"n":78,"cat":"消費者行為","q":"下列哪些描述是指老陳對臺灣運動彩券的態度?（1）臺灣運動彩券不容易贏錢。（2）我最喜歡臺灣運動彩券。（3）臺灣運動彩券是全世界最棒的彩券。","o":{"A":"（1）（2）","B":"（2）（3）","C":"（1）（3）","D":"（1）（2）（3）"},"a":"B","e":"態度是指對事物之感受與評價。（2）（3）即為態度。"},{"n":79,"cat":"消費者行為","q":"傑克周末喜歡觀賞運動賽事，有空閒時間也會逛運動用品店，在運動相關的網站上發表其對運動賽事之看法。以上描述是反映下列何者？","o":{"A":"價值觀","B":"人格特質","C":"生活型態","D":"個人知覺"},"a":"C","e":"生活型態是描述活動（Activity）、興趣（Interest）與意見（Opinion）。"},{"n":80,"cat":"消費者行為","q":"超級籃球聯賽（SBL）的籃球隊使用\"勇不止息\"傳遞其品牌價值，是利用下列何者因素吸引球迷觀賞？","o":{"A":"價值觀","B":"年齡","C":"產品生命週期","D":"社會階層"},"a":"A","e":"SBL 欲利用此標語吸引認同此價值觀之球迷。"},{"n":81,"cat":"消費者行為","q":"美國職棒大聯盟（MLB）某一球隊贏得世界冠軍時，在該球季不乏球迷；然而隔年成為聯盟的墊底球隊，門票滯銷且電視收視率大幅下滑。下列何者可以描述此現象？","o":{"A":"切割反映的失敗（Cutting off reflected failure）","B":"沉浸在反應的榮耀（Basking in reflected glory）","C":"認同感（Identification）","D":"阻礙因素（Constraints）"},"a":"A","e":"切割反映的失敗是描述觀眾不想要跟表現不佳的運動團隊有聯結的現象。"},{"n":82,"cat":"消費者行為","q":"花蓮的球迷抱怨：｢SBL 大部分的比賽都在台北進行，我們想到現場看都很麻煩。」這是何種阻礙因素？","o":{"A":"文化阻礙","B":"行銷阻礙","C":"個人阻礙","D":"結構阻礙"},"a":"B","e":"行銷阻礙意旨由於產品與消費者需求之間出現落差所產生的阻礙因素。"},{"n":83,"cat":"消費者行為","q":"下列何者阻礙因素是最可能被控制或改善的？","o":{"A":"文化阻礙","B":"結構阻礙","C":"個人阻礙","D":"行銷阻礙"},"a":"D","e":"相較之下，行銷阻礙應是阻礙因素中相對容易克服的阻礙因素。"},{"n":84,"cat":"消費者行為","q":"下列何者是描述因為社會規範或價值觀的原因，所造成無法或不願意參與運動的阻礙？","o":{"A":"文化阻礙","B":"結構阻礙","C":"個人阻礙","D":"行銷阻礙"},"a":"A","e":"文化阻礙是描述因為社會規範或價值觀的原因，所造成無法或不願意參與運動的阻礙。"},{"n":85,"cat":"消費者行為","q":"因沒有重要他人陪伴，而不參與運動的情況，是下列哪一種阻礙因素?","o":{"A":"文化阻礙","B":"結構阻礙","C":"個人阻礙","D":"社會阻礙"},"a":"D","e":"社會阻礙是因參考群體或同儕陪伴等的影響所造成之阻礙。"},{"n":86,"cat":"消費者行為","q":"史黛西：「我要照顧小孩，今晚的球賽我無法去了。」是描述哪一種阻礙因素？","o":{"A":"文化阻礙","B":"行銷阻礙","C":"個人阻礙","D":"社會阻礙"},"a":"C","e":"個人阻礙意旨因生活型態的緣故所形成之阻礙因素。"},{"n":87,"cat":"消費者行為","q":"「到現場看球賽，可以讓我遠離每天的例行生活，增添一點生活樂趣。」上述描述是哪一種動機？","o":{"A":"社會化","B":"球隊的表現","C":"追求現場氣氛","D":"多樣化"},"a":"D","e":"多樣化動機意旨藉由參與運動賽會逃離日常生活的瑣事。"},{"n":88,"cat":"消費者行為","q":"「因為我的好朋友都去看球賽，我也會跟他們一起去。」上述描述是哪一種動機？","o":{"A":"社會化","B":"球隊的表現","C":"追求現場氣氛","D":"多樣化"},"a":"A","e":"社會化動機是指因與重要他人互動驅使個體想去參與的動機。"},{"n":89,"cat":"消費者行為","q":"小芬常常跟男朋友去看職棒，但其實對棒球不是很懂，下列何者正確？","o":{"A":"高心理投入，低行為投入","B":"高心理投入，高行為投入","C":"低心理投入，高行為 ":"女子高爾夫（LPGA）是屬於________。","o":{"A":"高技術水平，比賽步調快","B":"高技術水平，比賽節奏慢","C":"低技術水平，比賽節奏快","D":"低技術水平，比賽節奏慢"},"a":"B","e":"女子高爾夫為高技術水平，比賽節奏慢。"},{"n":153,"cat":"產品策略","q":"滑雪場出租雪具的服務為下列何者？","o":{"A":"Non-Goods Services","B":"Owned-Goods Services","C":"Rented-Goods Services","D":"以上皆非"},"a":"C","e":"滑雪場出租雪具的服務屬於 Rented-Goods Services。"},{"n":154,"cat":"產品策略","q":"場館命名（Naming Rights） 是屬於哪一種服務？","o":{"A":"Non-Goods Services","B":"Owned-Goods Services","C":"Rented-Goods Services","D":"以上皆非"},"a":"B","e":"場館命名（Naming Rights） 是屬於 Owned-Goods Services。"},{"n":155,"cat":"產品策略","q":"付費上網球課或參加籃球夏令營的服務是？","o":{"A":"Non-Goods Services","B":"Owned-Goods Services","C":"Rented-Goods Services","D":"以上皆非"},"a":"A","e":"付費上網球課或參加籃球夏令營的服務是）Non-Goods Services。"},{"n":156,"cat":"產品策略","q":"「運動彩券發行條例將個人或企業，對個別運動員或運動組織的贊助或捐贈，列為抵稅之用。」行銷的外部環境因素頗多，上述屬於何者？","o":{"A":"科技","B":"法律","C":"政治","D":"以上皆是"},"a":"B","e":"運動彩券發行條例將個人或企業對個別運動員或運動組織的贊助或捐贈列為抵稅之用，屬於外部環境之法律因素。"},{"n":157,"cat":"產品策略","q":"台北富邦路跑賽接受跑者報名，同時也與企業接洽贊助是哪一個特性？","o":{"A":"同時兼具消費性與產業性之特性","B":"競爭又合作","C":"對核心產品缺乏控制","D":"社交促進"},"a":"A","e":"消費性商品是因為接受消費者報名；產業性特性是因為企業贊助屬於 B2B。"},{"n":158,"cat":"產品策略","q":"運動行銷人員對於運動員的健康狀態難以掌握。例如比賽中受傷，這是運動賽會特性中的哪一個？","o":{"A":"同時兼具消費性與產業性之特性","B":"競爭又合作","C":"對核心產品缺乏控制","D":"社交促進"},"a":"C","e":"運動行銷人員對於運動員的健康狀態難以掌握。例如:比賽中受傷，這是運動賽會特性中的對核心產品缺乏控制。"},{"n":159,"cat":"產品策略","q":"NBA 球隊推廣可任選 10 場比賽的球票組合，希望原先買單一場次的消費者可以一次購買多場球賽。行銷人員主要想要的是下列何者？","o":{"A":"將 Light Consumers 轉換成 Heavy Consumers","B":"將 Aware Non Consumer 轉換成 Consumer","C":"將 Medium Consumer 轉換成 Consumers","D":"以上皆非"},"a":"A","e":"此策略是將輕度使用者轉換成重度使用者。"},{"n":160,"cat":"產品策略","q":"以強調消費者間情感連結的行銷策略稱為？","o":{"A":"關係行銷（Relationship Marketing）","B":"病毒行銷（Viral Marketing）","C":"部落行銷（Tribal Marketing）","D":"大眾行銷（Mass Marketing）"},"a":"C","e":"以強調消費者間情感連結的行銷策略稱為部落行銷。"},{"n":161,"cat":"產品策略","q":"保齡球在十五年前風行台灣，但現在卻寥寥無幾，請問就產品生命週期而言，現在是屬於何者？","o":{"A":"導入期","B":"成長期","C":"成熟期","D":"衰退期"},"a":"D","e":"保齡球是市場目前是屬於衰退期。"},{"n":162,"cat":"產品策略","q":"運動產業發展條例中，下列何者屬於運動產業的範疇？","o":{"A":"電競","B":"運動博弈","C":"運動場館","D":"以上皆是"},"a":"D","e":"（A）（B）（C）皆屬於運動產業範疇。"},{"n":163,"cat":"產品策略","q":"迪卡儂運動用品量販店販售籃球服飾、棒球用品、露營用品、游泳用品等多種產品類別。上述符合下列哪一種概念的定義？","o":{"A":"產品組合的深度 （Product Mix Depth ）","B":"產品組合的廣度 （Product Mix Width）","C":"產品組合的長度 （Product Mix Length）","D":"產品組合（Product Mix）"},"a":"B","e":"產品組合的廣度（Width）指產品線的數目。"},{"n":164,"cat":"產品策略","q":"運動鞋、運動服裝、登山用品是下列何者的例子？","o":{"A":"產品類別","B":"產品生命週期","C":"品牌的分類","D":"產品屬性"},"a":"A","e":"產品類別（Product Category）是滿足某特定需要的所有產品。"},{"n":165,"cat":"產品策略","q":"New Balance 運用各國政要或明星行銷其產品，例如在美國有總統歐巴馬、在中國有前總理溫家寶穿著其運動鞋。此產品策略所使用的宣傳概念是運用下列何者？","o":{"A":"產品生命週期","B":"操作制約","C":"意見領袖","D":"以上皆非"},"a":"C","e":"意見領袖們的意見與看法會影響人們的消費決策。"},{"n":166,"cat":"產品策略","q":"小李在主場看棒球賽時，原先並未規劃買球衣，但在現場氣氛鼓舞下決定購買。此球衣為________。","o":{"A":"便利品","B":"選購品","C":"衝動品","D":"忽略品"},"a":"C","e":"衝動品意指消費者在未事先規劃下購買之產品。"},{"n":167,"cat":"產品策略","q":"台北公館一帶有許多運動用品店，集中的狀態方便消費者比較購買。下列何者是符合上述特性？","o":{"A":"便利品","B":"特殊品","C":"選購品","D":"忽略品"},"a":"C","e":"選購品是消費者購買是需要進行比較評估的產品。"},{"n":168,"cat":"產品策略","q":"Jordan 籃球鞋對許多 Jordan 迷而言有獨特意義，即使價格昂貴又要徹夜排隊仍然趨之若鶩。請問 Jordan 籃球鞋為哪一種產品？","o":{"A":"選購品","B":"便利品","C":"特殊品","D":"非主動搜尋品"},"a":"C","e":"特殊品是對消費者具特別意義的商品。"},{"n":169,"cat":"產品策略","q":"大中逛運動用品店，原先想走走看看並未規劃買何種商品，後來看到陳偉殷的大頭公仔，一時興起就決定買了，此大頭公仔對大中而言是下列何者？","o":{"A":"緊急品","B":"選購品","C":"便利品","D":"衝動品"},"a":"D","e":"衝動品是消費者原先並未規劃要購買的產品。"},{"n":170,"cat":"產品策略","q":"阿強每半年買一次慢跑鞋，每次購買時都會仔細比較各品牌的耐久性、品質、價格與設計風格。慢跑鞋對阿強而言，應該是屬於下列何者？","o":{"A":"便利品","B":"選購品","C":"特殊品","D":"衝動品"},"a":"B","e":"此為選購品的定義。"},{"n":171,"cat":"產品策略","q":"小傑原本只打算購買一雙愛迪達的籃球鞋，並無規劃購買其他產品。但在運動用品店結帳時，看到 NBA 球星的搖頭公仔就決定買了。請問，此搖頭公仔對小傑而言是屬於下列何者？","o":{"A":"便利品","B":"選購品","C":"特殊品","D":"衝動品"},"a":"D","e":"此為衝動品的定義。"},{"n":172,"cat":"產品策略","q":"對某些球迷而言，Michael Jordan 球員卡具有特別的情感，即使價格相當昂貴，仍想要購買。此球員卡應屬下列何者？","o":{"A":"選購品","B":"便利品","C":"衝動品","D":"特殊品"},"a":"D","e":"此為特殊品的定義。"},{"n":173,"cat":"產品策略","q":"小琪精通運動彩券的玩法，世界盃足球賽時，親朋好友都紛紛尋求小琪的意見進行下注。在運動彩券的產品上，小琪扮演下列哪一種角色？","o":{"A":"決策者","B":"意見領袖","C":"早期採用者","D":"重度使用者"},"a":"B","e":"意見領袖會影響個體的購買決策。"},{"n":174,"cat":"產品策略","q":"Nike 推出新款籃球鞋，先提供給 SBL 球員在比賽時使用，這些球員在產品行銷策略扮演的角色是下列何者？","o":{"A":"決策者","B":"意見領袖","C":"早期採用者","D":"重度使用者"},"a":"B","e":"試圖以 SBL 球員為意見領袖，影響消費者的購買決策。"},{"n":175,"cat":"品牌策略","q":"運動體適能中心為了強化自身產品或服務的競爭力和差異化，應致力於？","o":{"A":"品牌策略","B":"促銷策略","C":"狙擊行銷","D":"企業社會責任"},"a":"A","e":"品牌策略強調在消費者心中賦予對產品的特殊意義和創造差異化"},{"n":176,"cat":"品牌策略","q":"運動健身房常常使用身材健美之運動代言人來吸引消費者，若使用該體適能課程可達成良好身型的功能，其健身房欲創造消費者之哪項需求","o":{"A":"功能性需求","B":"象徵性需求","C":"體驗性需求","D":"成就感需求"},"a":"B","e":"象徵性需求是指能滿足消費者產生自我價值提高、角色定位的產品。"},{"n":177,"cat":"品牌策略","q":"消費者主觀上對品牌產生理性或情緒性的知覺，消費者透過品牌所傳遞的訊息，在心中產生對該品牌的形象，稱為？","o":{"A":"品牌屬性","B":"品牌形象","C":"品牌意識","D":"品牌知覺"},"a":"B","e":"品牌形象是消費者主觀上對品牌產生理性或情緒性的知覺，消費者在心中塑造出該品牌的形象"},{"n":178,"cat":"品牌策略","q":"游泳選手為了在運動比賽時有更好的運動成績，選擇競速泳衣，強調穩定核心肌群與降低水阻，此產品選擇導向符合下列哪個需求？","o":{"A":"功能性需求","B":"象徵性需求","C":"體驗性需求","D":"綜合性需求"},"a":"A","e":"指產品的設計是為了協助消費者解決外部的功能性需求，強調品牌在產品功能上不同於競爭者。"},{"n":179,"cat":"品牌策略","q":"知名企業贊助世界大學運動會以資金或是實質物資支援賽事活動，希望可以達到商業的效益。企業贊助活動能影響或強化消費者對品牌的哪些面向？","o":{"A":"回憶","B":"知名度","C":"認同感","D":"以上皆是"},"a":"D","e":"品牌以資金或是實質物資支援賽事，希望可以影響消費者對品牌的回憶、強化品牌在消費者心中的知名度 和認同感"},{"n":180,"cat":"品牌策略","q":"麥可喬丹是我的偶像，我在打籃球時會想像喬丹打球比賽的情境，幻想自己就是喬丹，穿著他代言的運動產品，希望能達到像他一樣的球技表現，稱為？","o":{"A":"品牌認同感","B":"歸屬感","C":"成就感","D":"自信心"},"a":"A","e":"品牌與產品所傳達的象徵意義，以建立個體本身定義與滿足需求，個體在追求本身自我目標的過程中，會傾向與品牌建立非常緊密的關係，稱為品牌認同"},{"n":181,"cat":"品牌策略","q":"人們只要想到 Under Armour，便會認為其是高價的、功能性佳的、潮牌的運動服飾品牌，其稱為________。","o":{"A":"聯合促銷","B":"品牌延伸","C":"品牌屬性","D":"垂直延伸"},"a":"C","e":"品牌某些屬性給消費者的第一印象。"},{"n":182,"cat":"品牌策略","q":"提到飛人品牌（Jordan Brand），讓人聯想到「球技高超」、「潮牌」、「有質感」，此策略稱為？","o":{"A":"品牌聯想","B":"品牌延伸","C":"品牌創新","D":"品牌連結"},"a":"A","e":"將有關品牌資訊或概念的記憶連結後形成對於消費者的意義，稱為品牌聯想。"},{"n":183,"cat":"品牌策略","q":"Nike 跑鞋種類繁多，針對不同功能推出新的形式、顏色等跑鞋，稱為________。","o":{"A":"產線延伸","B":"品牌延伸","C":"聯合品牌","D":"策略品牌"},"a":"A","e":"產線延伸意指使用原有品牌去推展一些與原品牌相同種類或等級的商品"},{"n":184,"cat":"品牌策略","q":"Adidas 推出專業健身系列和原創潮流系列；而原創潮流系列（三葉草）之產品價格昂貴，以符合不同消費群的需求，稱為________。","o":{"A":"產線延伸","B":"垂直延伸","C":"品牌延伸","D":"聯合品牌"},"a":"B","e":"企業產出不同價位水準的同一類商品，藉以符合不同消費群之需求稱為垂直延伸"},{"n":185,"cat":"品牌策略","q":"Adidas 從原本一家運動用品製造商起家，到現在也開發嘻哈流行音樂及時尚潮流的相關產品，其所使用之品牌策略稱為__________。","o":{"A":"品牌聯盟","B":"品牌創新","C":"品牌延伸","D":"品牌連結"},"a":"C","e":"其所使用之品牌策略為品牌延伸，有時又稱為種類延伸。"},{"n":186,"cat":"品牌策略","q":"Apple 和 Nike 彼此互相獨立的公司，共同產出 Apple Watch 手錶，並有 Nike 的 LOGO 在手錶上，使得兩方相互加值，這就可以稱為？","o":{"A":"聯合促銷","B":"個別品牌","C":"聯合品牌","D":"品牌合作"},"a":"C","e":"聯合品牌指兩個或更多品牌聯合，使資源達到整合，創造雙贏戰略"},{"n":187,"cat":"品牌策略","q":"何者意旨品牌決策者希望建立及維持並且傳遞企業價值？","o":{"A":"品牌促銷","B":"品牌忠誠","C":"品牌態度","D":"品牌形象"},"a":"D","e":"品牌形象是決策者希望藉由品牌傳遞企業價值"},{"n":188,"cat":"品牌策略","q":"品牌策略牽扯到下列哪些決策？","o":{"A":"品牌定位","B":"品牌名稱選擇","C":"品牌歸屬","D":"以上皆是"},"a":"D","e":"品牌策略包含品牌定位、品牌名稱選擇、品牌歸屬、品牌發展"},{"n":189,"cat":"品牌策略","q":"英特爾公司成為奧運企業贊助夥伴，提高企業的可信度、建立強大且具獲利性顧客連結的基礎，此稱為________。","o":{"A":"品牌權益","B":"品牌發展","C":"品牌歸屬","D":"品牌授權"},"a":"A","e":"品牌權益為品牌的知曉對產品或其行銷的回應所具有的差別性效果"},{"n":190,"cat":"品牌策略","q":"品牌資產評價法在衡量品牌在消費者知覺的強度，未包含下列哪項？","o":{"A":"尊貴","B":"價格","C":"知識","D":"差異化"},"a":"B","e":"品牌資產評價法在衡量品牌在消費者知覺的強度，包含差異化、關聯性、知識和尊貴"},{"n":191,"cat":"品牌策略","q":"品牌的知曉對產品或其行銷的回應所具有的的差別性效果稱為________。","o":{"A":"品牌價值","B":"品牌關係","C":"品牌權益","D":"品牌歸屬"},"a":"C","e":"品牌的知曉對產品或其行銷的回應所具有的的差別性效果稱為品牌權益"},{"n":192,"cat":"品牌策略","q":"Adidas 奠定運動用品服飾市場後，最近陸續推出健身用營養食品，該公司採何種品牌策略？","o":{"A":"品牌延伸","B":"品牌定位","C":"品牌歸屬","D":"品牌差異"},"a":"A","e":"某種已建立的品牌，提供不同類型商品的一種策略"},{"n":193,"cat":"品牌策略","q":"喬山健康科技公司（Johnson）為臺灣健身器材公司，在市場中推出由高價到低價，分別打出 Matrix、Johnson、Vision 及 Horizon 四個品牌，此為採用何種品牌策略？","o":{"A":"家族品牌","B":"個別品牌","C":"重定位","D":"品牌延伸"},"a":"B","e":"企業根據不同利益分別使用不同品牌的品牌策略，細分利益市場，強調各品牌的特點，吸引不同的消費者群體"},{"n":194,"cat":"品牌策略","q":"一個名稱（Name）、專門用語（Term）、標記（Sign）與符號（Symbol）、或設計（Design），或是以上各項的綜合，目的為辨識企業產品或服務，進而差異化與競爭者的產品或服務，稱為？","o":{"A":"品牌","B":"市場","C":"分眾","D":"行銷"},"a":"A","e":"品牌是一個名稱（Name）、專門用語（Term）、標記（Sign）與符號（Symbol）、或設計（Design）等以上元素各項的綜合，用以差異化其他競爭品牌"},{"n":195,"cat":"品牌策略","q":"品牌在未來能為企業所帶來的貨幣價值，稱為___________。","o":{"A":"品牌價值","B":"品牌屬性","C":"品牌權益","D":"品牌策略"},"a":"C","e":"品牌在未來能為企業所帶來的貨幣價值，稱為品牌權益"},{"n":196,"cat":"品牌策略","q":"小王觀看超級籃球聯賽時，不論所支持的球隊輸或贏，都會購買該球隊的比賽門票或周邊商品，稱為___________。","o":{"A":"品牌權益","B":"品牌屬性","C":"品牌形象","D":"品牌忠誠度"},"a":"D","e":"消費者一再購買相同產品的程度，稱為品牌忠誠度"},{"n":197,"cat":"品牌策略","q":"Yonex 與 Mizuno 皆採用相同品牌名稱、相同定位、相同形象行銷全世界，稱為________策略。","o":{"A":"全球品牌","B":"差異化","C":"品牌延伸","D":"品牌知覺"},"a":"A","e":"以相同品牌名稱、相同定位、相同形象行銷全世界稱為全球品牌"},{"n":198,"cat":"品牌策略","q":"參加馬拉松賽事，可在路跑過程中，體驗當地居民熱情歡呼、享用當地民眾提供的食物，參賽者在路跑過程中獲得成就感與愉悅感，滿足參賽者何項需求？","o":{"A":"象徵性需求","B":"功能性需求","C":"經驗性需求","D":"以上皆是"},"a":"C","e":"經驗性需求強調使用該產品之後，滿足消費者追求感官上的刺激、多變性或是愉悅感等內在的經驗性需求"},{"n":199,"cat":"品牌策略","q":"在品牌識別元素中，消費者能夠聽到或說出來的品牌元素，稱為什麼？","o":{"A":"品牌標誌","B":"品牌明顯度","C":"品牌形象","D":"品牌名稱"},"a":"D","e":"品牌中可以發音的部分為品牌名稱"},{"n":200,"cat":"品牌策略","q":"品牌無法發音的部分，如圖案、色彩等，稱為________。","o":{"A":"品牌標誌","B":"品牌名稱","C":"品牌符號","D":"品牌辨識"},"a":"A","e":"品牌無法發音的部分稱為品牌標誌"},{"n":201,"cat":"品牌策略","q":"運動品牌不再只是提供專業運動用品，更逐漸成為消費者追求流行與時尚的趨勢，各家品牌紛紛吸引潮流人士，讓消費者滿足自我認同與身分地位的代表，此類產品想要呈現出哪種品牌形象？","o":{"A":"功能性","B":"經驗性","C":"象徵性","D":"創造性"},"a":"C","e":"品牌象徵性指出使用該品牌象徵身分地位，自我價值提升，讓使用者產生優越感。"},{"n":202,"cat":"品牌策略","q":"商品或服務冠上品牌後，所能產生的額外現金流量及其未來盈餘的折現值稱為？","o":{"A":"品牌盈餘","B":"品牌文化","C":"品牌屬性","D":"品牌權益"},"a":"D","e":"商品或服務冠上品牌後，所能產生的額外現金流量及其未來盈餘的折現值稱為品牌權益"},{"n":203,"cat":"品牌策略","q":"運動用品店迪卡儂，銷售屬於自己的品牌產品、亞馬遜亦創造自己品牌的運動休閒服飾，稱為____________。","o":{"A":"零售品牌","B":"自有品牌","C":"銷售品牌","D":"自我品牌"},"a":"B","e":"零售商獨創自家品牌稱為自有品牌"},{"n":204,"cat":"品牌策略","q":"不同公司的品牌彼此結合，以推動各自的產品或服務，以創造品牌聯想，稱為__________。","o":{"A":"聯名品牌","B":"品牌延伸","C":"品牌權益","D":"品牌價值"},"a":"A","e":"不同公司的品牌彼此結合，以推動各自的產品或服務，以創造品牌聯想，稱為聯名品牌"},{"n":205,"cat":"品牌策略","q":"每年舉辦之台北國際體育用品展（TaiSPO）為全球運動器材採購商的展覽會議，參展廠商如健身器材品牌 JOHNSON 和 Intenza Fitness，分別在展覽上有別於一般傳統產品展覽，邀請專業的健身教練替代 Showgirls，呈現品牌的_______。","o":{"A":"差異化","B":"延伸性","C":"權益","D":"價格"},"a":"A","e":"創造品牌在消費者心中的特殊位置，以區別於競爭品牌稱為品牌差異化"},{"n":206,"cat":"品牌策略","q":"直接以企業名稱當成產品名稱，銷售李寧牌運動鞋，稱為________。","o":{"A":"部門品牌策略","B":"家族品牌策略","C":"個別品牌策略","D":"獨立品牌策略"},"a":"B","e":"直接以企業名稱當成產品名稱為家族品牌策略"},{"n":207,"cat":"品牌策略","q":"產品有其專屬品牌，品牌名稱不揭露企業名稱，稱為________。","o":{"A":"部門品牌策略","B":"混合品牌策略","C":"家族品牌策略","D":"個別品牌策略"},"a":"D","e":"產品有其專屬品牌，品牌名稱不揭露企業名稱為獨立品牌策略"},{"n":208,"cat":"品牌策略","q":"Nike 選擇優秀運動員如 Lebron James， Kobe Bryant 傳奇等級人物代言其品牌，人們一聽到 Nike，直接聯想到高品質的運動品牌，稱為________。","o":{"A":"品牌形象","B":"品牌傘","C":"品牌文化","D":"聯合品牌"},"a":"A","e":"品牌給人的第一印象稱為品牌形象"},{"n":209,"cat":"訂價策略","q":"大型熱門售票賽會常見黃牛票在比賽開始後就以原價或折扣價方式兜售。上述視情況將產品價格變動調整的訂價機制，我們可稱之為？","o":{"A":"動態定價","B":"靜態定價","C":"通路策略","D":"差別定價"},"a":"A","e":"動態定價是指根據市場需求和自身供應能力，以不同的價格將同一產品適時地銷售給不同的消費者或不同的細分市場，以實現收益最大化的策略。"},{"n":210,"cat":"訂價策略","q":"你認為下列何者相對是較不可能成為影響棒球主場門票價格變動的因素？","o":{"A":"打入季後賽","B":"簽下知名球星","C":"嚴格取締黃牛票販售","D":"球員涉嫌放水"},"a":"C","e":"嚴格取締黃牛票販售不會影響門票官方訂價"},{"n":211,"cat":"訂價策略","q":"高價的球鞋買賣，經常在網路拍賣中看到，賣家先行設定底價，再由買方網上喊價，以最高價者得標。請問此種訂價方法為下列哪一種？","o":{"A":"拍賣定價法","B":"成本加乘定價法","C":"知覺價值定價法","D":"目標報酬"},"a":"A","e":"網路拍賣興起後，拍賣訂價法是 B2C 環境中常用的訂價法。"},{"n":212,"cat":"訂價策略","q":"運動服飾店經常在宣傳過季產品時將原始售價刻意標示出來，以顯現目前打折的售價比較便宜，請問此時零售店是將原始售價作為＿＿＿＿。","o":{"A":"知覺價格","B":"內部參考價格","C":"外部參考價格","D":"批發價格"},"a":"C","e":"外部參考價格（External Reference Price）是指零售商透過廣告、型錄等方式，提供消費者參考的價格訊息。"},{"n":213,"cat":"訂價策略","q":"每年 NBA 球季結束，愛迪達（Adidas）總會安排知名球星回台參加造勢活動，此種行銷手法稱為？","o":{"A":"置入行銷","B":"體驗行銷","C":"話題行銷","D":"病毒行銷"},"a":"C","e":"話題行銷是指「企業整合資源，透過企劃或創意，創造大眾關心的話題、議題，因而吸引媒體的報導與消費者的參與，進而達到提升企業形象，以及銷售商品的目的」。"},{"n":214,"cat":"訂價策略","q":"過去的免費資源逐漸式微，中國許多頻道商正以實際行動告訴消費者，想看精彩 F1 賽車或拳擊比賽或節目，使用者必須付費。下列何者並非直播賽事收費的原因？","o":{"A":"增加營收","B":"有效擴大市場佔有率","C":"反應轉播成本","D":"改善轉播技術以提高節目價值"},"a":"B","e":"觀眾已習慣免費收看賽事轉播，採取收費模式並無法擴大市場佔有率"},{"n":215,"cat":"訂價策略","q":"健身俱樂部會針對學生或家庭推出不同的定價服務，請問它是執行下列何種策略？","o":{"A":"畸零訂價","B":"滲透訂價","C":"吸脂訂價","D":"差別訂價"},"a":"D","e":"差別定價指生產者於生產某產品之成本相同的情況下，對不同顧客或不同之購買數量的要價不同。"},{"n":216,"cat":"訂價策略","q":"運動品牌找來球星合作聯名鞋款，讓消費者願意以翻倍的價格購買。他是採用何種定價法？","o":{"A":"成本加成定價法","B":"知覺價值定價法","C":"拍賣定價法","D":"現行水準定價法"},"a":"B","e":"知覺價值定價法是指儘量讓產品的價格反映產品的實際價值，以合理的定價提供合適的質量和良好的服務組合。"},{"n":217,"cat":"訂價策略","q":"對運動行銷人員而言，價格是複雜的行銷因素，所以必須考慮下列哪個因素？","o":{"A":"競爭者","B":"消費者","C":"環境","D":"以上皆是"},"a":"D","e":"對運動行銷人員而言，價格決定必須考慮競爭者、消費者、公司與環境等因素。"},{"n":218,"cat":"訂價策略","q":"運動贊助的價格訂定是非常困難的，贊助商所購買的贊助配套使用權利中，下列何者是有形因素？","o":{"A":"交叉行銷機會","B":"優先續約權","C":"場內產品配銷的權利","D":"以上皆非"},"a":"C","e":"場內產品配銷的權利屬於有形因素"},{"n":219,"cat":"訂價策略","q":"如果一個贊助商可以在賽會手冊得到 2 頁免費廣告，而非贊助商則可以每頁 10,000 元購買，那麼運動實體把贊助費用訂為 20,000 元。上述是利用什麼方式價格？","o":{"A":"相關價值定價法","B":"機會等值定價法","C":"市場競爭定價法","D":"成本加成定價法"},"a":"A","e":"相關價值定價法強調的是結果而不是成本。"},{"n":220,"cat":"訂價策略","q":"某網站依據消費者過去觀看產品的紀錄，判定該消費者是NBA 球星的球迷，當該消費者點入賣場尋找該球星的聯名產品時，網站的售價比其他消費者看到的要高出 10％，請問對於該網站的敘述何者為非？","o":{"A":"忠實消費者不會在意價格的差異","B":"網購業者的菜單成本（Menu Cost）低","C":"利用搜尋紀錄判斷消費者的知覺價值","D":"這是差別訂價"},"a":"A","e":"忠實消費者若得知價格較高，反而會有較大的反彈"},{"n":221,"cat":"訂價策略","q":"職棒隊在審視過去其他球隊於球衣廣告的各種價格後，決定將自家球衣右胸的贊助權以 500 萬元賣給製藥企業。上述是利用什麼方式訂定價格？","o":{"A":"相關價值定價法","B":"機會等值定價法","C":"市場競爭定價法","D":"成本加成定價法"},"a":"C","e":"市場競爭定價法根據的是市場現有環境來決定贊助價格。"},{"n":222,"cat":"訂價策略","q":"新興健身器材製造商，即便所賺利潤縮小，仍執意將其訂價定訂為與競爭對手差不多，請問此種定價策略為？","o":{"A":"知覺價值訂價法","B":"成本加成訂價法","C":"現行水準訂價法","D":"目標報酬訂價法"},"a":"C","e":"貼近市場上對手的售價來制訂價格，稱為現行水準訂價法。"},{"n":223,"cat":"訂價策略","q":"臺灣歷年承辦世界棒球經典賽，對於中華隊出賽場次之門票有極大全數售完的信心，因此棒協常以尋求投資回收率來訂定票價。請問此種定價策略稱之為？","o":{"A":"分版訂價","B":"目標報酬訂價","C":"風格訂價","D":"以上皆是"},"a":"B","e":"目標報酬訂價是根據企業預期的總銷售量與總成本，確定一個目標利潤率的定價方法。"},{"n":224,"cat":"訂價策略","q":"觀賞性運動聯盟經常會與其他組織採用一項名叫合購（Bundling）的定價策略。以下有關合購的論述，何者正確？","o":{"A":"適用於互補產品的定價","B":"目的是促銷消費者原本不太可能購買的商品","C":"屬於心理定價","D":"配套在一起的產品種類愈多，消費者愈願意購買"},"a":"B","e":"合購（bundling）是將幾種產品組合起來，再以較低的總價出售。配套中的主力產品必須有吸引力，才能將不受歡迎的附帶產品促銷出去。配套產品要能相互搭配，才能促進消費者的購買意願。"},{"n":225,"cat":"訂價策略","q":"以下哪一項不是差別訂價的例子？","o":{"A":"游泳池售票分軍警、全票、兒童票","B":"運動外套在夏天時的售價通常較低","C":"運動服飾店相同之 T 恤，第二件六折","D":"中華職棒依不同座位訂定不同定價"},"a":"C","e":"將兩件以上可分開銷售之產品，重新整合為一件，再以折扣方式出售，應為捆裝訂價。"},{"n":226,"cat":"訂價策略","q":"穿戴型裝置如雨後春筍般冒出，一向以平價且規格不錯來定位的「小米」在運動手環市場要以哪種訂價方法才能達到促銷效果？","o":{"A":"超值訂價（Value Pricing）","B":"知覺價值訂價（Perceived Value Pricing）","C":"競爭者導向定價（Competitor-Oriented Pricing）","D":"名望定價（Prestige Pricing）"},"a":"A","e":"超值訂價係指廠商針對品質不錯的商品訂出比消費者預期還要低的價格，藉此引起市場的高度注意與掀起購買熱潮。"},{"n":227,"cat":"訂價策略","q":"宏騰運動公司針對獨特研發的高爾夫球，訂出比消費者預期還要低的價格，其最不可能是採用下列何種訂價策略？","o":{"A":"知覺價值訂價法","B":"超值訂價法","C":"滲透訂價","D":"犠牲打訂價"},"a":"A","e":"知覺價值訂價法係指以消費者所認知的價值為訂價基礎 ，而不是比消費者預期還要低的價格。"},{"n":228,"cat":"訂價策略","q":"健身工廠收費是以月費計算的， 銀卡 1288 元、金卡 1688元、白金卡 1888 元。上述利用消費者習慣捨去零頭的運算心理策略稱之為？","o":{"A":"畸零訂價","B":"滲透訂價","C":"犠牲打訂價","D":"特殊事件訂價"},"a":"A","e":"畸零訂價是利用消費者習慣捨去零頭的運算心理，將價格歸類在比較便宜的區間。"},{"n":229,"cat":"訂價策略","q":"國內大部份高爾夫球場都採會員卡消費可獲折扣的方式，請問他們是採用哪一種訂價策略？","o":{"A":"漸降訂價","B":"關係訂價","C":"滲透訂價","D":"動態訂價"},"a":"B","e":"關係訂價是指利用訂價策略鼓勵建立長期關係。關係訂價的基本構想是優良顧客理應給予優惠價格，此一策略也是廠商追求顧客忠誠的有效途徑。"},{"n":230,"cat":"訂價策略","q":"「AIR JORDAN 的球鞋在不同國家有不同的售價，這其中的落差是因為代理商依各地區的市場行情，或是運費、關稅等成本反映在價格上。」以上的敘述為下列哪一項訂價方式？","o":{"A":"協議訂價（Price Negotiation）","B":"固定訂價（Fixed Pricing）","C":"地理區隔訂價（Geographic Segment Pricing）","D":"價值區隔訂價（Value Segment Pricing）"},"a":"C","e":"當公司在不同地區銷售產品時使用不同的定價稱為地理區隔訂價。"},{"n":231,"cat":"訂價策略","q":"許多運動手環在新產品上市時，為了取得較高的市場佔有率，因此常以低價吸引大量消費者購買。這是哪一種訂價策略？","o":{"A":"市場滲透訂價法","B":"差別訂價法","C":"心理訂價法","D":"成本加成訂價法"},"a":"A","e":"市場滲透訂價法，是指在產品導入期用低價銷售，以求快速提高市佔率。"},{"n":232,"cat":"訂價策略","q":"愛迪達（Adidas）推出系列球鞋款將產品價格訂為 6,800 元時，造成不少消費者連續排隊多日只為搶購這雙潮鞋。執行此一訂價策略有若干先決條件，以下何者為非？","o":{"A":"消費者的價格敏感度很高","B":"消費者具有高價格代表高品質的想法","C":"品牌具有高知名度","D":"產品的獨特性高，新穎且奇特"},"a":"A","e":"吸脂訂價是指訂定很高的價位，廠商從中賺取高額利潤。消費者的價格敏感度愈高，愈會因價格上升而降低購買意願，故並非吸脂訂價的目標市場。"},{"n":233,"cat":"通路策略","q":"下列何者並不屬於職棒隊之通路？","o":{"A":"洲際棒球場","B":"賽事售票網","C":"民營體育用品店","D":"體育電視台"},"a":"C","e":"運動賽會的通路型態包含運動場館、門票販售系統、媒體。"},{"n":234,"cat":"通路策略","q":"「Jordan」品牌在臺灣透過旗艦店、運動用品連鎖店與百貨公司等地點銷售商品外，該公司也在耐吉（Nike）官網上販售品牌產品，如此可能會產生以下哪種通路衝突？","o":{"A":"多重通路衝突","B":"水平通路衝突","C":"垂直通路衝突","D":"沒有通路衝突"},"a":"A","e":"多重通路衝突是指業者同時建立兩種以上通路分食相同市場，尤其是經銷體系與直營體系間的衝突。"},{"n":235,"cat":"通路策略","q":"眾多運動產業正試圖從巨量資料中，透過專業的分析找到背後的價值與意義，以有效掌握正確的創新發展方向。下列哪種通路階層布商最不利運動製造商進行大數據分析？","o":{"A":"三階通路","B":"二階通路","C":"一階通路","D":"零階通路"},"a":"A","e":"通路層級增加，想要獲得最終使用者的資訊就愈困難。"},{"n":236,"cat":"通路策略","q":"PUMA 運動品牌聯手人氣手搖飲料店，不但店家聯名，就連飲品也推出限定款，賣鞋和賣飲料結合，帶來人潮和商機。請問上述是屬於何種通路動態？","o":{"A":"合約型垂直行銷系統","B":"管理型垂直行銷系統","C":"水平行銷系統","D":"多重通路行銷系統"},"a":"C","e":"水平行銷系統是由兩家或多家沒有關聯的公司合作發掘新的行銷機會"},{"n":237,"cat":"通路策略","q":"愛迪達（Adidas）限量鞋吸引許多人徹夜排隊搶購，當時台中大遠百甚至爆發推擠，消費者怒斥品牌沒做好動線管理，並建議可以運用網路平台以避免衝突的情況。請問下列何者是網路購物所具備的特質？","o":{"A":"跨越時空的限制","B":"跨越中間商","C":"降低搜尋成本","D":"以上皆是"},"a":"D","e":"電子商務平臺的建立具備跨時空、跨中間商與低搜尋成本。"},{"n":238,"cat":"通路策略","q":"運動產業許多產品都具有不易儲存或易損壞腐敗的特性，所以在通路設計策略應朝向下列哪項原則？","o":{"A":"通路長度愈短愈好","B":"通路商密集度愈小愈好","C":"倉儲地點愈多愈好","D":"銷售市場範圍愈大愈好"},"a":"A","e":"易損壞腐敗產品需要較直接的銷售，即通路長度愈短愈好，以免因延遲或重複處理而有風險。"},{"n":239,"cat":"通路策略","q":"對於美津濃（MIZUNO）運動手套而言，PChome 網站的意義是一種？","o":{"A":"通路","B":"廣告媒體","C":"銷售團隊","D":"公關工具"},"a":"A","e":"PChome 是運動用品的販售管道，因此可視為運動用品的新興產品通路。"},{"n":240,"cat":"通路策略","q":"下列何者不屬於通路衝突？","o":{"A":"運動品牌不願意看到網購平台將新產品一開始上架就打 79 折","B":"蝦皮購物中心與 PChome 購物同時打折，且公告免運費來搶食市埸","C":"運動用品直營店擔心網路購物會威脅到其生存空間","D":"健身器材廠商與網購平台對拆帳談不攏"},"a":"B","e":"藉由優惠活動爭取顧客，屬於市場競爭而非通路衝突。"},{"n":241,"cat":"通路策略","q":"運動產業有許多不同種類的產品，其中造成有形產品和無形產品配銷通路策略訂定差異的最重要因素為何？","o":{"A":"通路衝突種類","B":"上架壽命","C":"產品多樣性","D":"通路階層"},"a":"B","e":"上架壽命是指產品製成後，在良好且可被消費的狀態下所保存的時間。"},{"n":242,"cat":"通路策略","q":"以下的銷售通路中，何者屬於零階通路型態？","o":{"A":"新莊棒球場","B":"緯來體育台","C":"蝦皮購物台","D":"摩曼頓運動用品店"},"a":"A","e":"新莊棒球場是棒球賽事的配銷地點，亦即觀眾是在生產地同時進行消費。"},{"n":243,"cat":"通路策略","q":"富邦悍將 2017 年宣佈認養新莊球場 10 年後，球團決定耗資1.2 億元來改善球場措施，以上是屬於哪一種決策？","o":{"A":"價格決策","B":"通路決策","C":"溝通決策","D":"產品決策"},"a":"B","e":"比賽場館為觀賞性運動的通路之一。"},{"n":244,"cat":"通路策略","q":"岱宇國際（Dyaco）健身器材製造商自行建立網站以銷售產品的作法，不屬於下列何者？","o":{"A":"一階通路","B":"電子商務","C":"去通路","D":"零階通路"},"a":"A","e":"自闢網站銷售產品是零階通路的作法"},{"n":245,"cat":"通路策略","q":"過去主要開發零組件的喬山健身器材代工廠，在 1995 年併購美國品牌 Trek 健身器材公司，1999 年成立 Horizon 品牌量販店通路，2001年設立 Matrix 自有品牌，2002 年起在亞洲建立 JOHNSON 連鎖零售店。由以上敘述判斷，喬山公司意圖建立哪種配銷通路？","o":{"A":"合約型垂直行銷系統","B":"管理型垂直行銷系統","C":"企業型垂直行銷系統","D":"多重通路行銷系統"},"a":"C","e":"企業型垂直行銷系統擁有結合所有生產與配銷各階段的單一所有權。"},{"n":246,"cat":"通路策略","q":"如果你經營一家體適能工作室，你的課程廣告較適合放在下列哪個社群平台？","o":{"A":"旅遊社群","B":"健身社群","C":"單車社群","D":"美食社群"},"a":"B","e":"網路上最適合分眾行銷，健身社群聚集許多健身同好的消費者。"},{"n":247,"cat":"通路策略","q":"Nike 近期同意讓旗下部分產品直接在亞馬遜（Amazon）官網上販售，造成過去相當依賴的實體通路「Foot Locker」公司股價暴跌。請問下列何者是 Nike 採用電商通路的原因？","o":{"A":"沒有儲存空間限制","B":"全天候的服務","C":"沒有距離限制","D":"以上皆是"},"a":"D","e":"虛擬通路具有如下的優點：1.全天候 24 小時不間斷的服務。2.沒有距離限制。3.沒有儲存空間限制。"},{"n":248,"cat":"通路策略","q":"統一獅隊決定要結合集團旗下關係企業進行慈善義賣，消費者只能在 7-11、星巴克等通路才能買到相關商品。請問統一獅隊是下列何項配銷策略？","o":{"A":"密集配銷","B":"選擇性配銷","C":"獨家配銷","D":"聯合配銷"},"a":"B","e":"選擇性配銷指僅在某些有限的銷售點出售。"},{"n":249,"cat":"通路策略","q":"全球最大運動品牌美國 Nike 為確保 2022 年全年營收達到 500億美元目標，著手大肆整頓全球零售業務，未來合作的零售夥伴數量將從目前約 3 萬家大砍至 40 家。下列何者應非其目的？","o":{"A":"電子商務趨勢所驅","B":"擺脫實體通路的庫存與備貨問題","C":"積極鞏固美國市場","D":"有效控管銷售商品模式"},"a":"C","e":"Nike 降低實體零售店增加網路銷售部份，主要是希望大幅拓展海外市場。"},{"n":250,"cat":"通路策略","q":"全球最大運動用品「Foot Locker」公司已逐漸取代大眾媒體廣告，成為運動品牌攻佔消費者心房的「最後一哩」，而這代表零售商運動產業具有愈來愈高的通路權力。請問應如何解釋「通路權力」？","o":{"A":"通路系統中，影響力最大的成員所擁有的特別待遇","B":"通路成員面對及處理通路衝突的能力","C":"通路系統中無形的規範與應盡的義務","D":"某個通路成員影響或控制其他成員行為的能力"},"a":"D","e":"通路權力是指某個通路成員影響或控制其他成員行為的能力。"},{"n":251,"cat":"通路策略","q":"「摩曼頓」運動用品店是屬於那一種通路型態？","o":{"A":"批發商","B":"零售商","C":"顧客","D":"製造商"},"a":"B","e":"運動用品店零售商"},{"n":252,"cat":"通路策略","q":"中華職棒除在比賽球場賣票之外，許多文具店、運動用品店、網路平臺、甚至便利商店也都能買得到門票。請問中華職棒是進行下列何項配銷密度策略？","o":{"A":"密集配銷","B":"選擇性配銷","C":"獨家配銷","D":"聯合配銷"},"a":"A","e":"密集配銷指將產品於所有可能的銷售點出售。"},{"n":253,"cat":"通路策略","q":"運動賽會為無形的產品，但季票的販售可以提供觀眾專屬消費的滿足感。這是影響運動產業配銷通路策略的哪一個因素？","o":{"A":"時間","B":"地點","C":"所有權","D":"以上皆是"},"a":"C","e":"所有權效用是為消費者創造產品的所有權，以提供個人專屬消費的滿足感"},{"n":254,"cat":"通路策略","q":"下列哪項運動產品最可能不涉及中間媒介，就能將產品從製造商直接送到消費者手中？","o":{"A":"運動鞋","B":"網球教學","C":"健身器材","D":"以上皆是"},"a":"B","e":"無形運動產品生產與消費同時進行。"},{"n":255,"cat":"通路策略","q":"消費者經由全網購票網購買棒球主場的門票，上述通路階層可稱是？","o":{"A":"三階通路","B":"二階通路","C":"一階通路","D":"零階通路"},"a":"C","e":"包含售票系統商的一階通路"},{"n":256,"cat":"通路策略","q":"因為 Under Amour 提供某款式的 Polo 衫，在微笑體育用品店搭配球星簽名活動，進行極低價格促銷活動，因此摩曼頓的銷售量受到嚴重威脅，於是將此款 Polo 衫以低於進價拍賣銷售。上述為何種形式通路衝突？","o":{"A":"垂直通路衝突","B":"水平通路衝突","C":"多重通路衝突","D":"沒有衝突"},"a":"B","e":"通路中同一階層的不同成員間因為服務、廣告或定價上產生衝突，稱為水平通路衝突。"},{"n":257,"cat":"通路策略","q":"臺灣每年舉辦數百場路跑活動，其中「田中馬」歷來以當地特色補給豐盛，及鄉親們熱情加油最為吸睛。請問下列何者不是主辦單位考量之重點？","o":{"A":"消費者參與程度","B":"各組開跑時間","C":"參與者性別比例","D":"各項紀念品發放"},"a":"C","e":"參與性運動的提供者在乎群眾的參與程度，為了吸引更多跑者參加會設計各項服務。此題與地點考量無關者，便是答案"},{"n":258,"cat":"通路策略","q":"智慧手機的普及對於電子競技軟體開發廠商而言，是代表一種新的________。","o":{"A":"產品通路","B":"廣告媒體","C":"公關工具","D":"促銷工具"},"a":"A","e":"智慧型手機是遊戲軟體的另一種販售管道，因此可視為該產業的新興產品通路。"},{"n":259,"cat":"通路策略","q":"DICK'S Sporting Goods 是美國運動用品的知名通路商，以下何者不屬於它的通路權力？","o":{"A":"合法的權力","B":"認同的權力","C":"專業的權力","D":"抱怨的權力"},"a":"D","e":"通路權力包括專業、認同、獎賞、懲罰、合法等五種權力。"},{"n":260,"cat":"通路策略","q":"迪卡儂是全台最大的運動用品連鎖量販店，如果迪卡儂從事以下何種行為，容易與製造商造成通路衝突？","o":{"A":"蒐集消費者資訊","B":"提供庫存量與實體運送","C":"提供買方付款方式","D":"建立通路品牌"},"a":"D","e":"通路商推出自己的通路品牌，會與製造商形成競爭敵對關係，是造成通路衝突的原因之一。"},{"n":261,"cat":"通路策略","q":"下列有關運動產業的通路設計之考慮因素，何者有誤？","o":{"A":"無形產品的通路通常比有形產品的通路還要短","B":"羽球購買量很大，通路較短","C":"棒球發球機比跳繩單價高出許多，有較長的通路","D":"Trackman 追蹤系統因為需要廠商技術支援與售後服務，多採用較短的通路"},"a":"C","e":"高單價產品如一套上千萬的機器設備，很少透過中間商銷售，通常是由製造商和顧客直接交易。"},{"n":262,"cat":"通路策略","q":"健身器材製造商為爭取中間通路商合作，通常會採用一些正面激勵的方式，以下何者不屬於之？","o":{"A":"降低中間商的銷售額達成率","B":"給予店頭展示津貼","C":"提供訓練計劃","D":"優惠的交易條件"},"a":"A","e":"正面激勵之目的是要提高銷售量，故降低銷售量達成率不屬於正面激勵。"},{"n":263,"cat":"通路策略","q":"以下何者不是運動產品的中間商（Middlemen）？","o":{"A":"寶成鞋業","B":"摩曼頓運動用品","C":"愛爾達體育台","D":"ibon 售票系統"},"a":"A","e":"中間商即通路商，介於買方與賣方之間。製造商屬於賣方，不是中間商。"},{"n":264,"cat":"銷售推廣策略","q":"以職業運動持票者而言，輕度使用者一般是指？","o":{"A":"第一次入場的消費者","B":"持免費票入場者","C":"與友人隨行入場球迷","D":"以上皆是"},"a":"D","e":"上述這三種情況較為普遍"},{"n":265,"cat":"銷售推廣策略","q":"下列何者是銷售促銷活動的類型？","o":{"A":"特賣會","B":"記者會","C":"贊助","D":"公開演講"},"a":"A","e":"B 是公共報導，C 是另一促銷組合，D 是公共報導"},{"n":266,"cat":"銷售推廣策略","q":"下列何者是公共報導的類型？","o":{"A":"廣告推廣","B":"贊助","C":"電話促銷","D":"記者會"},"a":"D","e":"只有記者會是公共報導"},{"n":267,"cat":"銷售推廣策略","q":"SBL 籃球賽中場時，贈送汽車給現場觀眾做為抽獎的獎品，這是屬於何種促銷工具？","o":{"A":"廣告","B":"個人銷售","C":"公共關係","D":"銷售促銷"},"a":"D","e":"銷售促銷中的獎品"},{"n":268,"cat":"銷售推廣策略","q":"中華職棒在比賽 略","q":"運動贊助的贊助商權益不包括________。","o":{"A":"標識使用權","B":"活動促銷權","C":"活動主導權","D":"禮遇款待權"},"a":"C","e":"運動贊助的贊助商權益包括:標識使用權、活動促銷權及禮遇款待權"},{"n":334,"cat":"運動贊助策略","q":"一般運動贊助商退出的原因為何？","o":{"A":"比賽的市場價值下降","B":"贊助的成本變高","C":"公司方針的改變","D":"以上皆是"},"a":"D","e":"一般運動贊助商退出的原因包括:比賽的市場價值下降、贊助的成本變高及公司方針的改變"},{"n":335,"cat":"運動贊助策略","q":"贊助效益的評估通常不包括哪種方法？","o":{"A":"知名度評估法","B":"形象評估法","C":"運動員品牌喜好程度","D":"銷售量評估法"},"a":"C","e":"贊助效益的評估方法通常包括:知名度評估法、形象評估法及銷售量評估法"},{"n":336,"cat":"運動贊助策略","q":"贊助價格的制定通常採用哪個方法？","o":{"A":"市場競爭策略","B":"成本加成法","C":"相對價值法","D":"以上皆是"},"a":"D","e":"贊助價格的制定通常採用方法包括:市場競爭策略、成本加成法及相對價值法"},{"n":337,"cat":"運動贊助策略","q":"執行贊助企劃時需做哪些活動分析？","o":{"A":"活動規模","B":"活動性質","C":"活動成熟度","D":"以上皆是"},"a":"D","e":"執行贊助企劃時需做活動規模分析、活動性質分析及活動成熟度分析"},{"n":338,"cat":"運動贊助策略","q":"企業贊助的動機通常不包括哪一項？","o":{"A":"提升企業形象","B":"活動主導權","C":"增加銷售機會","D":"媒體宣傳"},"a":"B","e":"企業贊助的動機通常包括:提升企業形象、增加銷售機會、媒體宣傳效果"}]};
const PARTS={tour:{name:'觀光行銷實務'},sport:{name:'運動行銷實務'}};
const PER=20;
let part='tour',page=1,ans={tour:{},sport:{}};
try{const s=localStorage.getItem('tims-quiz-v1');if(s)ans=Object.assign(ans,JSON.parse(s))}catch(e){}
try{const p=localStorage.getItem('tims-part');if(PARTS[p])part=p}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem('tims-quiz-v1',JSON.stringify(ans))}catch(e){}};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function tabs(){
  $('tabs').innerHTML=Object.keys(PARTS).map(k=>`<button class="tab" role="tab" data-k="${k}" aria-selected="${k===part}">${PARTS[k].name}<small>${DATA[k].length} 題</small></button>`).join('');
  document.documentElement.dataset.part=part;
}
function cats(){
  const c=[...new Set(DATA[part].map(x=>x.cat))];
  $('cat').innerHTML='<option value="all">全部章節</option>'+c.map(x=>`<option>${x}</option>`).join('');
}
function stats(){
  const d=DATA[part],a=ans[part];let ok=0,no=0;
  d.forEach(x=>{if(a[x.n]){a[x.n]===x.a?ok++:no++}});
  const done=ok+no,rate=done?Math.round(ok/done*100):0;
  $('stats').innerHTML=`<span>已作答<b>${done}</b>/${d.length}</span><span class="g">正確<b>${ok}</b></span><span class="r">錯誤<b>${no}</b></span><span>正確率<b>${rate}%</b></span>`;
  $('prog').innerHTML=`<i class="pg" style="width:${ok/d.length*100}%"></i><i class="pb" style="width:${no/d.length*100}%"></i>`;
}
function filtered(){
  const c=$('cat').value,s=$('st').value,a=ans[part];
  return DATA[part].filter(x=>(c==='all'||x.cat===c)&&(s==='all'||(s==='todo'?!a[x.n]:s==='ok'?a[x.n]===x.a:a[x.n]&&a[x.n]!==x.a)));
}
function card(x){
  const u=ans[part][x.n],done=!!u,ok=u===x.a;
  const opts=Object.keys(x.o).map(k=>{
    let cl='';if(done){if(k===x.a)cl='right';else if(k===u)cl='wrong'}
    return `<button class="opt ${cl}" data-n="${x.n}" data-k="${k}" ${done?'disabled':''}><span class="l">${k}</span><span>${esc(x.o[k])}</span></button>`}).join('');
  return `<article class="card ${done?(ok?'ok':'no'):''}" id="q${x.n}">
   <div class="meta"><span class="qn">第 ${x.n} 題</span><span class="cat">${x.cat}</span>${done?`<span class="verdict">${ok?'✔ 正確':'✘ 錯誤'}</span>`:''}</div>
   <p class="q">${esc(x.q)}</p><div class="opts">${opts}</div>
   ${done?`<p class="exp"><b>${ok?'答對了，':'你選 '+u+'，'}正確答案 ${x.a}。</b> ${esc(x.e)}</p><div class="row"><button class="link" data-redo="${x.n}">重做此題</button></div>`:''}
  </article>`;
}
function render(keepScroll){
  stats();
  const f=filtered(),pages=Math.max(1,Math.ceil(f.length/PER));
  if(page>pages)page=pages;
  $('count').textContent=`共 ${f.length} 題・第 ${page}/${pages} 頁`;
  $('list').innerHTML=f.length?f.slice((page-1)*PER,page*PER).map(card).join(''):'<p class="empty">沒有符合條件的題目</p>';
  let p='';for(let i=1;i<=pages;i++)p+=`<button data-p="${i}" ${i===page?'aria-current="true"':''}>${i}</button>`;
  $('pager').innerHTML=pages>1?p:'';
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.k&&t.dataset.n&&t.classList.contains('opt')){
    ans[part][t.dataset.n]=t.dataset.k;save();
    const y=window.scrollY;
    stats();const x=DATA[part].find(q=>q.n==t.dataset.n);
    const el=$('q'+x.n);el.outerHTML=card(x);
  }else if(t.dataset.redo){delete ans[part][t.dataset.redo];save();const x=DATA[part].find(q=>q.n==t.dataset.redo);$('q'+x.n).outerHTML=card(x);stats()}
  else if(t.dataset.p){page=+t.dataset.p;render();scrollTo(0,0)}
  else if(t.classList.contains('tab')){part=t.dataset.k;try{localStorage.setItem('tims-part',part)}catch(_){}page=1;tabs();cats();$('st').value='all';render();scrollTo(0,0)}
});
let armed=false;
$('reset').onclick=()=>{
  if(!armed){armed=true;$('reset').textContent='再按一次確認重置';setTimeout(()=>{armed=false;$('reset').textContent='重置此部分作答'},3000);return}
  armed=false;$('reset').textContent='重置此部分作答';ans[part]={};save();page=1;render();
};
$('cat').onchange=$('st').onchange=()=>{page=1;render()};
tabs();cats();render();
</script>
